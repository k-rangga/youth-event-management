<style>
  .ku-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .ku-tile { background: #fff; border: 1px solid #ece0c2; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ku-big { font-weight: 800; font-size: 22px; letter-spacing: -.01em; color: #3a2a15; font-variant-numeric: tabular-nums; }
  .ku-bar { height: 6px; border-radius: 4px; background: #F3E9CE; overflow: hidden; }
  .ku-bar > span { display: block; height: 100%; border-radius: 4px; }
  .ku-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ku-grid { display: grid; grid-template-columns: minmax(0, 1fr) 128px 128px 128px 84px; gap: 12px; align-items: center; padding: 10px 18px; }
  .ku-head { background: #F3E9CE; border-bottom: 1px solid #e7d9b3; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a7952; padding-top: 11px; padding-bottom: 11px; }
  .ku-cat { background: #FBF6E7; border-top: 1px solid #f1e7cd; font-size: 12.5px; font-weight: 800; color: #6E2621; padding-top: 8px; padding-bottom: 8px; }
  .ku-line { border-top: 1px solid #f4ecd8; font-size: 14px; cursor: pointer; }
  .ku-line:hover { background: #FEFBF2; }
  .ku-tx { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto 128px 84px; gap: 12px; align-items: center; padding: 6px 18px 6px 34px; font-size: 13px; color: #6b5a38; cursor: pointer; }
  .ku-tx:hover { background: #FEFBF2; }
  .ku-total { border-top: 1px solid #e7d9b3; font-weight: 800; font-size: 14px; background: #FBF6E7; }
  .ku-acts { display: flex; justify-content: flex-end; gap: 2px; }
  .ku-act { width: 30px; height: 30px; border-radius: 9px; color: #a08b62; cursor: pointer; }
  .ku-act:hover { background: #F3E9CE; color: #6E2621; }
  .ku-act.del:hover { background: #fbe3dc; color: #B3261E; }
  .ku-row { text-align: left; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 1fr) 140px 140px 210px; gap: 20px; align-items: center; padding: 10px 20px 10px 12px; background: #fff; border: 1px solid #ece0c2; border-radius: 16px; }
  .ku-row:hover { border-color: #d9c79b; box-shadow: 0 10px 24px -20px rgba(74,59,23,.5); }
  .ku-panel-body { flex: 1; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .ku-err { background: #fbe3dc; color: #8e2a1f; border-radius: 12px; padding: 10px 13px; font-size: 13.5px; font-weight: 600; }
  .ku-hint:empty { display: none; }
  .ku-panel-body .ti-seg button { flex: 1; justify-content: center; }
  .ku-panel-body .ti-field { height: 43px; }
  .ku-panel-body textarea.ti-field { height: auto; }
  .ku-chk { margin: 2px 0; }
  .ku-chk { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; color: #3a2a15; cursor: pointer; }
  .ku-chk input { width: 18px; height: 18px; accent-color: #6E2621; }
  @media (max-width: 820px) {
    .ku-grid { grid-template-columns: minmax(0, 1fr) 104px 34px; padding: 10px 14px; }
    .ku-grid .c-bud, .ku-grid .c-diff { display: none; }
    .ku-head .c-acts { visibility: hidden; }
    .ku-acts .ku-act:not(.more) { display: none; }
    .ku-tx { grid-template-columns: minmax(0, 1fr) 104px 34px; padding-left: 24px; }
    .ku-tx .c-date, .ku-tx .c-who { display: none !important; }
    .ku-row { grid-template-columns: 52px minmax(0, 1fr); column-gap: 14px; row-gap: 6px; padding-right: 14px; }
    .ku-row .c-num, .ku-row-head { display: none !important; }
    .ku-row .c-pills { grid-column: 2; justify-content: flex-start !important; }
  }
</style>

<script>
/* ===================== Finance (budget vs actual per event) ===================== */

var KU_CATS = {
  out: ['Food', 'Transport', 'Lodging', 'Venue', 'Sound & media', 'Decoration', 'Supplies', 'Print & publicity', 'Honorarium & love gift', 'Prizes', 'Other'],
  in: ['Youth fund', 'Participant fees', 'Sponsors & donations', 'Church subsidy', 'Offering', 'Sales', 'Other']
};
var KU_TYPE = { out: 'Expense', in: 'Income' };
var KU_LIST_CAP = 120;

var kuState = {
  token: kuStored(), status: null, loaded: false, loading: false, loadError: '',
  events: [], lines: [], txs: [],
  screen: 'list', eventId: null, q: '', filter: null,
  pin: { v: '', v2: '', error: '', busy: false },
  form: null,       // open side panel: { kind: 'line' | 'tx' | 'copy' | 'pin', …fields, error, busy }
  receipt: null     // receipt being viewed: { loading, name, mimeType, url, error }
};

function kuStored() { try { return sessionStorage.getItem('ku_token') || ''; } catch (e) { return ''; } }
function kuStore(t) { try { if (t) sessionStorage.setItem('ku_token', t); else sessionStorage.removeItem('ku_token'); } catch (e) {} }

/* ---------- money ---------- */

function kuRp(n) {
  n = Math.round(Number(n) || 0);
  return (n < 0 ? '−' : '') + 'Rp ' + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

/* "150000", "150.000", "150k", "150rb", "1.5m", "1,5jt" → rupiah; NaN when unreadable. */
function kuParseAmt(s) {
  s = String(s == null ? '' : s).toLowerCase().replace(/rp\.?/g, '').replace(/\s+/g, '');
  if (!s) return NaN;
  var m = /^([\d.,]+)(rb|ribu|k|jt|juta|m|mio)$/.exec(s);
  if (m) {
    var mult = /^(jt|juta|m|mio)$/.test(m[2]) ? 1e6 : 1e3;
    var v = parseFloat(m[1].replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
    return isFinite(v) ? Math.round(v * mult) : NaN;
  }
  return /^[\d.,]+$/.test(s) ? Number(s.replace(/[.,]/g, '')) : NaN;
}

function kuAmtHint(s) {
  var v = kuParseAmt(s);
  if (!String(s || '').trim()) return '';
  return isFinite(v) && v > 0 ? '= ' + kuRp(v) : 'e.g. 150000, 150k, 1.5m';
}

/* ---------- data helpers ---------- */

function kuEvent(id) {
  var e = kuState.events.filter(function (x) { return x.id === id; })[0];
  return e || { id: id, date: '', theme: 'Deleted event (ID ' + id + ')', tag: '', gone: true };
}
function kuEventTitle(e) { return (e.theme && !/^untitled(\s+event)?$/i.test(e.theme.trim())) ? e.theme : 'Untitled'; }
function kuLinesOf(id) { return kuState.lines.filter(function (l) { return l.eventId === id; }); }
function kuTxsOf(id) { return kuState.txs.filter(function (t) { return t.eventId === id; }); }

function kuSum(id) {
  var s = { budOut: 0, budIn: 0, actOut: 0, actIn: 0, owed: 0, owedN: 0, lines: 0, txs: 0 };
  kuLinesOf(id).forEach(function (l) { s.lines++; if (l.type === 'in') s.budIn += l.amount; else s.budOut += l.amount; });
  kuTxsOf(id).forEach(function (t) {
    s.txs++;
    if (t.type === 'in') s.actIn += t.amount; else s.actOut += t.amount;
    if (t.source === 'personal' && !t.reimbursed) { s.owed += t.amount; s.owedN++; }
  });
  return s;
}

function kuPill(text, bg, fg) { return '<span class="ti-pill" style="background:' + bg + '; color:' + fg + ';">' + esc(text) + '</span>'; }

function kuStatusPills(s) {
  var out = [];
  if (!s.lines && !s.txs) return kuPill('No budget', '#F3E9CE', '#9a8763');
  if (s.budOut && s.actOut > s.budOut) out.push(kuPill('Over by ' + kuRp(s.actOut - s.budOut), '#fbe3dc', '#8e2a1f'));
  if (s.owed) out.push(kuPill('To repay ' + kuRp(s.owed), '#fdf0e6', '#a3420e'));
  if (!out.length) out.push(s.txs ? kuPill('On budget', '#e3eedf', '#24401F') : kuPill('Planned', '#CFE4F7', '#31536f'));
  return out.join('');
}

/* ---------- server calls ---------- */

var KU_WHAT = { getKeuanganData: 'load finance data', saveBudgetLine: 'save the budget line', deleteBudgetLine: 'delete the budget line', saveTransaction: 'save the transaction',
  deleteTransaction: 'delete the transaction', copyBudget: 'copy the budget', uploadReceipt: 'upload the receipt', getReceipt: 'open the receipt', kuChangePin: 'change the PIN', kuLock: 'lock' };

/* Runs fn(token, …) on the server; a lapsed unlock sends the user back to the PIN screen. */
function kuCall(name, args, ok, fail) {
  var r = google.script.run
    .withSuccessHandler(ok)
    .withFailureHandler(function (err) {
      var raw = err && err.message ? err.message : String(err);
      if (/KU_LOCKED/.test(raw)) { kuRelock(); return; }
      var msg = /^Receipt not found/.test(raw) ? 'Receipt not found.' : errText(err, KU_WHAT[name] || 'do that');
      if (fail) fail(msg); else flash(msg);
    });
  r[name].apply(r, [kuState.token].concat(args || []));
}

function kuRelock() {
  kuState.token = ''; kuStore('');
  kuState.loaded = false; kuState.form = null; kuState.receipt = null;
  kuState.status = { pinSet: true };
  kuState.pin = { v: '', v2: '', error: 'Session ended. Enter the PIN again.', busy: false };
  kuRender();
}

function kuEnter() {
  if (!kuState.status) {
    google.script.run
      .withSuccessHandler(function (st) { kuState.status = st; if (st.unlocked) kuLoad(); else { kuState.token = ''; kuStore(''); } kuRender(); })
      .withFailureHandler(function (err) { kuState.loadError = errText(err, 'open Finance'); kuRender(); })
      .kuStatus(kuState.token);
  } else if (kuState.token && !kuState.loaded && !kuState.loading) kuLoad();
  kuRender();
}

function kuLoad() {
  kuState.loading = true;
  kuCall('getKeuanganData', [], function (d) {
    kuState.loading = false; kuState.loaded = true; kuState.loadError = '';
    kuState.events = d.events || []; kuState.lines = d.lines || []; kuState.txs = d.txs || [];
    if (kuState.filter == null) kuState.filter = kuState.lines.length || kuState.txs.length ? 'budget' : 'all';
    kuRender();
  }, function (msg) { kuState.loading = false; kuState.loadError = msg; kuRender(); });
}

function kuSubmitPin() {
  var p = kuState.pin, setup = !kuState.status.pinSet;
  if (setup && p.v !== p.v2) { p.error = 'The PINs don\'t match.'; kuRender(); return; }
  p.busy = true; p.error = ''; kuRender();
  google.script.run
    .withSuccessHandler(function (res) {
      p.busy = false;
      if (!res.success) { p.error = res.message; kuRender(); var el = document.getElementById('kuPin'); if (el) el.focus(); return; }
      kuState.token = res.token; kuStore(res.token);
      kuState.status = { pinSet: true, unlocked: true };
      kuState.pin = { v: '', v2: '', error: '', busy: false };
      kuLoad(); kuRender();
    })
    .withFailureHandler(function (err) { p.busy = false; p.error = errText(err, 'check the PIN'); kuRender(); })[setup ? 'kuSetupPin' : 'kuUnlock'](p.v);
}

/* ---------- render ---------- */

function kuRender() {
  var root = document.getElementById('viewKeuangan');
  if (!root) return;
  var s = kuState;
  if (!s.status) root.innerHTML = kuHeader('Pemuda GKI Kota Wisata', 'Finance', '') + kuMsg(s.loadError ? esc(s.loadError) : 'Loading…');
  else if (!s.token) root.innerHTML = kuPinHtml();
  else if (!s.loaded) root.innerHTML = kuHeader('Pemuda GKI Kota Wisata', 'Finance', '') + kuMsg(s.loadError ? esc(s.loadError) : 'Loading…');
  else if (s.screen === 'event' && s.eventId) root.innerHTML = kuEventHtml();
  else root.innerHTML = kuListHtml();
  kuRenderPanel();
  kuRenderReceipt();
}

function kuMsg(text) { return '<div class="empty-msg" style="padding:40px 20px;">' + text + '</div>'; }

function kuHeader(eyebrow, title, right, back) {
  return '<header class="page-head">' +
    '<div class="page-head-in">' +
      '<div style="display:flex; flex-direction:column; gap:4px; min-width:0;">' +
        (back ? '<span data-ku="back" class="ti-link" style="display:inline-flex; align-items:center; gap:4px; margin-bottom:4px;">' + icon('left', 14) + 'All events</span>' : '') +
        '<span class="ti-eyebrow" style="line-height:1.4;">' + eyebrow + '</span>' +
        '<h1 class="page-title">' + title + '</h1>' +
      '</div>' + right +
    '</div>' +
  '</header>';
}

function kuPinHtml() {
  var p = kuState.pin, setup = !kuState.status.pinSet;
  return kuHeader('Pemuda GKI Kota Wisata', 'Finance', '') +
    '<main class="page-main" style="padding-top:40px;"><div class="ti-card" style="max-width:400px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:14px;">' +
      '<h2 style="margin:0; font-weight:800; font-size:20px; letter-spacing:-.02em;">' + (setup ? 'Create a finance PIN' : 'Enter the finance PIN') + '</h2>' +
      (setup ? '<p style="margin:0; font-size:14px; line-height:1.55; color:#6b5a38;">Share it only with whoever handles the money.</p>' : '') +
      (p.error ? '<div class="ku-err">' + esc(p.error) + '</div>' : '') +
      '<label class="ti-label"><span>PIN' + (setup ? ' (at least 6 characters)' : '') + '</span>' +
        '<input id="kuPin" data-kupin="v" type="password" autocomplete="' + (setup ? 'new-password' : 'current-password') + '" class="ti-field" value="' + esc(p.v) + '"></label>' +
      (setup ? '<label class="ti-label"><span>Repeat PIN</span><input data-kupin="v2" type="password" autocomplete="new-password" class="ti-field" value="' + esc(p.v2) + '"></label>' : '') +
      '<button data-ku="pinGo" class="ti-btn-orange"' + (p.busy ? ' disabled style="opacity:.6"' : '') + '>' + (p.busy ? 'Checking…' : setup ? 'Save and open' : 'Open') + '</button>' +
    '</div></main>';
}

function kuListHtml() {
  var s = kuState;
  var right = '<span style="display:flex; gap:8px; flex-wrap:wrap;">' +
    '<button data-ku="changePin" class="ti-btn-outline">Change PIN</button>' +
    '<button data-ku="lock" class="ti-btn-outline">Lock</button></span>';
  var html = kuHeader('Pemuda GKI Kota Wisata', 'Event budgets', right);
  html += '<main class="page-main"><div class="page-wrap">';

  var owed = 0, owedN = 0;
  s.txs.forEach(function (t) { if (t.source === 'personal' && !t.reimbursed) { owed += t.amount; owedN++; } });
  if (owed) {
    html += '<div class="notice"><span><strong style="font-weight:800; color:#a3420e;">' + kuRp(owed) + ' to repay</strong> · ' + owedN + (owedN === 1 ? ' personal payment' : ' personal payments') + '</span></div>';
  }

  html += '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">' +
    '<div class="search-box" style="min-width:240px; flex:0 1 340px;">' +
      '<span style="color:#b3a37c;">' + icon('search', 16) + '</span>' +
      '<input id="kuQ" data-kuq="1" value="' + esc(s.q) + '" placeholder="Search events" autocomplete="off">' +
    '</div>' +
    '<div style="display:flex; gap:6px;">' + [['budget', 'With budget'], ['all', 'All events']].map(function (f) {
      return '<button data-ku="filter" data-v="' + f[0] + '" class="pill-btn' + (s.filter === f[0] ? ' on' : '') + '">' + f[1] + '</button>';
    }).join('') + '</div></div>';

  html += '<section id="kuRows" style="display:flex; flex-direction:column; gap:8px;">' + kuRowsHtml() + '</section>';
  return html + '</div></main>';
}

function kuListEvents() {
  var s = kuState, q = tiNorm(s.q), ids = {}, out = [];
  s.lines.forEach(function (l) { ids[l.eventId] = true; });
  s.txs.forEach(function (t) { ids[t.eventId] = true; });
  var seen = {};
  s.events.forEach(function (e) { seen[e.id] = true; if (s.filter === 'all' || ids[e.id]) out.push(e); });
  Object.keys(ids).forEach(function (id) { if (!seen[id]) out.push(kuEvent(id)); });
  if (q) out = out.filter(function (e) { var h = tiNorm(kuEventTitle(e) + ' ' + e.tag + ' ' + e.date + ' ' + (e.date ? tiDateLong(e.date) : '')); return q.split(' ').every(function (t) { return h.indexOf(t) !== -1; }); });
  return out.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
}

function kuRowsHtml() {
  var s = kuState, rows = kuListEvents();
  if (!rows.length) {
    return '<div class="empty-msg">' + (s.q ? 'No matching events.' : s.filter === 'budget' ? 'No budgets yet. Open an event under <b>All events</b>.' : 'No events in Event input.') + '</div>';
  }
  var head = '<div class="ku-row ku-row-head" style="cursor:default; background:transparent; border-color:transparent; box-shadow:none; padding-top:0; padding-bottom:0; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#8a7952;">' +
    '<span></span><span>Event</span><span class="ku-num c-num">Budget</span><span class="ku-num c-num">Actual</span><span></span></div>';
  return head + rows.slice(0, KU_LIST_CAP).map(function (e) {
    var sum = kuSum(e.id), d = fromIso(e.date), over = sum.budOut && sum.actOut > sum.budOut;
    return '<button data-ku="open" data-id="' + esc(e.id) + '" class="ku-row">' +
      '<span style="background:#F3E9CE; border-radius:12px; padding:6px 0; display:flex; flex-direction:column; align-items:center; line-height:1.05;">' +
        '<span style="font-weight:800; font-size:20px; color:#6E2621;">' + (d ? d.getDate() : '–') + '</span>' +
        '<span style="font-size:10px; font-weight:700; letter-spacing:.06em; color:#8a7952; white-space:nowrap;">' + (d ? TI_MON[d.getMonth()].toUpperCase() + ' ' + String(d.getFullYear()).slice(2) : '') + '</span>' +
      '</span>' +
      '<span style="min-width:0; display:flex; flex-direction:column; gap:3px;">' +
        '<span style="font-weight:700; font-size:15.5px; color:' + (e.gone ? '#9a8763' : '#3a2a15') + '; text-wrap:pretty;">' + esc(kuEventTitle(e)) + '</span>' +
        '<span style="font-size:13px; color:#8a7952; font-weight:600;">' + esc([e.tag, sum.lines ? sum.lines + ' budget lines' : '', sum.txs ? sum.txs + ' transactions' : ''].filter(Boolean).join(' · ')) + '</span>' +
      '</span>' +
      '<span class="ku-num c-num" style="font-weight:700; color:#6b5a38;">' + (sum.budOut ? kuRp(sum.budOut) : '<span style="color:#cdbd96;">–</span>') + '</span>' +
      '<span class="ku-num c-num" style="font-weight:700; color:' + (over ? TI_RED : '#3a2a15') + ';">' + (sum.actOut ? kuRp(sum.actOut) : '<span style="color:#cdbd96;">–</span>') + '</span>' +
      '<span class="c-pills" style="display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;">' + kuStatusPills(sum) + '</span>' +
    '</button>';
  }).join('') + (rows.length > KU_LIST_CAP ? '<div style="text-align:center; color:#9a8763; font-size:13px;">' + (rows.length - KU_LIST_CAP) + ' more. Search to narrow down.</div>' : '');
}

/* ---------- render: one event ---------- */

function kuEventHtml() {
  var e = kuEvent(kuState.eventId), sum = kuSum(e.id), blank = !sum.lines && !sum.txs;
  var right = '<span style="display:flex; gap:8px; flex-wrap:wrap;">' +
    (blank ? '' : '<button data-ku="lineNew" data-type="out" class="ti-btn-outline">+ Budget line</button>') +
    '<button data-ku="txNew" data-type="out" class="' + (blank ? 'ti-btn-outline' : 'ti-btn-orange') + '"' + (blank ? '' : ' style="padding:9px 16px; font-size:14px;"') + '>+ Record transaction</button></span>';
  var html = kuHeader(esc(e.date ? tiDateLong(e.date) : 'No date') + (e.tag ? ' · ' + esc(e.tag) : ''), esc(kuEventTitle(e)), right, true);
  html += '<main class="page-main"><div class="page-wrap">';

  /* A new event starts from a plain choice instead of empty totals. */
  if (blank) {
    html += '<section class="ti-card" style="padding:36px 24px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;">' +
      '<h2 style="margin:0; font-weight:800; font-size:20px; letter-spacing:-.02em;">No budget yet</h2>' +
      '<span style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">' +
        '<button data-ku="lineNew" data-type="out" class="ti-btn-orange">Create budget</button>' +
        '<button data-ku="copyOpen" class="ti-btn-outline" style="padding:12px 16px; font-size:14px;">Copy from another event</button>' +
      '</span></section>';
    return html + '</div></main>';
  }

  var bal = sum.actIn - sum.actOut;
  html += '<section class="ku-tiles">' +
    kuTile('Expenses', sum.actOut, sum.budOut, true) +
    kuTile('Income', sum.actIn, sum.budIn, false) +
    '<div class="ku-tile"><span class="ti-eyebrow">Balance</span><span class="ku-big" style="color:' + (bal < 0 ? TI_RED : TI_GREEN) + ';">' + kuRp(bal) + '</span>' +
      '<span style="font-size:12.5px; color:#8a7952; font-weight:600;">Planned: ' + kuRp(sum.budIn - sum.budOut) + '</span></div>' +
    '<div class="ku-tile"><span class="ti-eyebrow">To repay</span><span class="ku-big" style="color:' + (sum.owed ? '#a3420e' : '#3a2a15') + ';">' + kuRp(sum.owed) + '</span>' +
      '<span style="font-size:12.5px; color:#8a7952; font-weight:600;">' + (sum.owedN ? sum.owedN + (sum.owedN === 1 ? ' personal payment' : ' personal payments') : 'Nothing owed') + '</span></div>' +
  '</section>';

  html += kuSectionHtml(e.id, 'out') + kuSectionHtml(e.id, 'in');
  return html + '</div></main>';
}

function kuTile(label, act, bud, isOut) {
  var pct = bud ? Math.min(100, Math.round(act / bud * 100)) : 0, over = isOut ? act > bud : act < bud;
  var color = !bud ? '#d9c79b' : isOut ? (act > bud ? TI_RED : act > bud * 0.9 ? TI_AMBER : TI_GREEN) : (act >= bud ? TI_GREEN : TI_AMBER);
  return '<div class="ku-tile"><span class="ti-eyebrow">' + label + '</span>' +
    '<span class="ku-big">' + kuRp(act) + '</span>' +
    '<div class="ku-bar"><span style="width:' + (bud ? pct : 0) + '%; background:' + color + ';"></span></div>' +
    '<span style="font-size:12.5px; color:' + (bud && over && isOut ? TI_RED : '#8a7952') + '; font-weight:600;">' +
      (bud ? 'of ' + kuRp(bud) + ' · ' + Math.round(act / bud * 100) + '%' : 'No budget') + '</span></div>';
}

/* Budget lines grouped by category, each with its transactions under it; unbudgeted transactions get their own row. */
function kuSectionHtml(eventId, type) {
  var lines = kuLinesOf(eventId).filter(function (l) { return l.type === type; });
  var txs = kuTxsOf(eventId).filter(function (t) { return t.type === type; });
  var lineIds = {};
  lines.forEach(function (l) { lineIds[l.id] = true; });
  var cats = [];
  KU_CATS[type].concat(lines.map(function (l) { return l.category; }), txs.map(function (t) { return t.category; })).forEach(function (c) {
    if (cats.indexOf(c) === -1) cats.push(c);
  });

  var body = '', totBud = 0, totAct = 0;
  cats.forEach(function (cat) {
    var cl = lines.filter(function (l) { return l.category === cat; });
    var loose = txs.filter(function (t) { return t.category === cat && !lineIds[t.lineId]; });
    if (!cl.length && !loose.length) return;
    var catBud = 0, catAct = 0, rows = '';
    cl.forEach(function (l) {
      var mine = txs.filter(function (t) { return t.lineId === l.id; }), act = kuTotal(mine);
      catBud += l.amount; catAct += act;
      rows += kuLineRow(l.desc, l.qty !== '' && l.price !== '' ? l.qty + ' × ' + kuRp(l.price) : l.notes, l.amount, act, type,
        'data-ku="lineEdit" data-id="' + esc(l.id) + '"', l.id) + mine.map(kuTxRow).join('');
    });
    if (loose.length) {
      var la = kuTotal(loose);
      catAct += la;
      rows += kuLineRow('Unbudgeted', '', 0, la, type, '', '') + loose.map(kuTxRow).join('');
    }
    totBud += catBud; totAct += catAct;
    body += '<div class="ku-grid ku-cat"><span>' + esc(cat) + '</span><span class="ku-num c-bud">' + kuRp(catBud) + '</span><span class="ku-num">' + kuRp(catAct) + '</span>' +
      '<span class="ku-num c-diff">' + kuDiff(catBud, catAct, type) + '</span><span></span></div>' + rows;
  });

  var title = type === 'out' ? 'Expenses' : 'Income';
  var html = '<section class="ti-card" style="overflow:hidden;">' +
    '<div style="display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 18px; flex-wrap:wrap;">' +
      '<h2 style="margin:0; font-weight:800; font-size:19px; letter-spacing:-.02em;">' + title + '</h2>' +
      '<span style="display:flex; gap:12px;"><span data-ku="lineNew" data-type="' + type + '" class="ti-link">+ Budget</span><span data-ku="txNew" data-type="' + type + '" class="ti-link">+ Transaction</span></span>' +
    '</div>';
  if (!body) {
    return html + '<div style="padding:4px 18px 18px; font-size:14px; color:#9a8763;">' + (type === 'out' ? 'No expenses yet.' : 'No income yet.') + '</div></section>';
  }
  html += '<div class="ku-grid ku-head"><span>Item</span><span class="ku-num c-bud">Budget</span><span class="ku-num">Actual</span><span class="ku-num c-diff">Difference</span><span class="c-acts"></span></div>' + body;
  html += '<div class="ku-grid ku-total"><span>Total ' + title.toLowerCase() + '</span><span class="ku-num c-bud">' + kuRp(totBud) + '</span><span class="ku-num">' + kuRp(totAct) + '</span>' +
    '<span class="ku-num c-diff">' + kuDiff(totBud, totAct, type) + '</span><span></span></div>';
  return html + '</section>';
}

function kuTotal(txs) { return txs.reduce(function (n, t) { return n + t.amount; }, 0); }

/* Difference: for spending, budget left (red when over); for income, what came in beyond the plan (amber when short). */
function kuDiff(bud, act, type) {
  if (!bud && !act) return '–';
  var d = type === 'out' ? bud - act : act - bud;
  var color = d < 0 ? (type === 'out' ? TI_RED : TI_AMBER) : '#6b5a38';
  return '<span style="color:' + color + '; font-weight:700;">' + (d > 0 ? '+' : '') + kuRp(d) + '</span>';
}

function kuLineRow(desc, sub, bud, act, type, attrs, lineId) {
  var acts = lineId
    ? '<span class="ku-acts"><span role="button" data-ku="txNew" data-type="' + type + '" data-line="' + esc(lineId) + '" class="icon-btn ku-act more" title="Record a transaction for this line" aria-label="Record transaction">' + icon('plus', 16) + '</span>' +
      '<span role="button" data-ku="lineDel" data-id="' + esc(lineId) + '" class="icon-btn ku-act del" title="Delete budget line" aria-label="Delete budget line">' + icon('trash', 15) + '</span></span>'
    : '<span></span>';
  return '<div class="ku-grid ku-line" ' + (attrs || 'style="cursor:default;"') + '>' +
    '<span style="min-width:0; display:flex; flex-direction:column; gap:1px;"><span style="font-weight:600; color:' + (lineId ? '#3a2a15' : '#8a7952') + '; ' + (lineId ? '' : 'font-style:italic;') + '">' + esc(desc) + '</span>' +
      (sub ? '<span style="font-size:12px; color:#9a8763; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(sub) + '</span>' : '') + '</span>' +
    '<span class="ku-num c-bud">' + (lineId ? kuRp(bud) : '–') + '</span>' +
    '<span class="ku-num" style="font-weight:700; color:' + (type === 'out' && lineId && act > bud ? TI_RED : '#3a2a15') + ';">' + (act ? kuRp(act) : '–') + '</span>' +
    '<span class="ku-num c-diff">' + (lineId ? kuDiff(bud, act, type) : '') + '</span>' + acts +
  '</div>';
}

function kuTxRow(t) {
  var who = t.source === 'personal'
    ? kuPill(t.paidBy + (t.reimbursed ? ' · repaid' : ' · to repay'), t.reimbursed ? '#e3eedf' : '#fdf0e6', t.reimbursed ? '#24401F' : '#a3420e')
    : '';
  return '<div class="ku-tx" data-ku="txEdit" data-id="' + esc(t.id) + '">' +
    '<span class="c-date tnum">' + esc(tiShort(t.date)) + '</span>' +
    '<span style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(t.desc || (t.type === 'in' ? 'Income' : 'Payment')) + '</span>' +
    '<span class="c-who" style="display:flex; gap:6px; align-items:center;">' + who +
      (t.receiptId ? '<span role="button" data-ku="receipt" data-id="' + esc(t.receiptId) + '" data-name="' + esc(t.receiptName) + '" class="ti-link" style="font-size:12px;">Receipt</span>' : '') + '</span>' +
    '<span class="ku-num" style="color:#3a2a15;">' + kuRp(t.amount) + '</span>' +
    '<span class="ku-acts"><span role="button" data-ku="txDel" data-id="' + esc(t.id) + '" class="icon-btn ku-act del more" title="Delete transaction" aria-label="Delete transaction">' + icon('trash', 15) + '</span></span>' +
  '</div>';
}

/* ---------- side panel forms ---------- */

function kuOpenLine(line, type) {
  kuState.form = line
    ? { kind: 'line', id: line.id, type: line.type, category: line.category, desc: line.desc, qty: line.qty === '' ? '' : String(line.qty), price: line.price === '' ? '' : String(line.price), amount: String(line.amount), notes: line.notes, mode: line.qty !== '' && line.price !== '' ? 'unit' : 'total' }
    : { kind: 'line', id: '', type: type || 'out', category: '', desc: '', qty: '', price: '', amount: '', notes: '', mode: 'total' };
  kuRenderPanel();
  kuFocus('kuF-desc');
}

function kuOpenTx(tx, type, lineId) {
  var line = lineId && kuState.lines.filter(function (l) { return l.id === lineId; })[0];
  kuState.form = tx
    ? { kind: 'tx', id: tx.id, type: tx.type, lineId: tx.lineId, category: tx.category, date: tx.date, desc: tx.desc, amount: String(tx.amount), source: tx.source, paidBy: tx.paidBy, reimbursed: tx.reimbursed, receiptId: tx.receiptId, receiptName: tx.receiptName, newReceipt: null }
    : { kind: 'tx', id: '', type: line ? line.type : (type || 'out'), lineId: line ? line.id : '', category: line ? line.category : '', date: iso(startOfToday()), desc: line ? line.desc : '', amount: '', source: 'kas', paidBy: '', reimbursed: false, receiptId: '', receiptName: '', newReceipt: null };
  kuRenderPanel();
  kuFocus('kuF-amount');
}

function kuFocus(id) { setTimeout(function () { var el = document.getElementById(id); if (el) el.focus(); }, 30); }

function kuRenderPanel() {
  var host = document.getElementById('kuPanel');
  if (!host) { host = document.createElement('div'); host.id = 'kuPanel'; document.body.appendChild(host); }
  var f = kuState.form;
  if (!f) { host.innerHTML = ''; return; }
  var title = { line: f.id ? 'Edit budget line' : 'New budget line', tx: f.id ? 'Edit transaction' : 'Record transaction', copy: 'Copy budget', pin: 'Change finance PIN' }[f.kind];
  var body = f.kind === 'line' ? kuLineForm(f) : f.kind === 'tx' ? kuTxForm(f) : f.kind === 'copy' ? kuCopyForm(f) : kuPinForm(f);
  host.innerHTML = '<div style="position:fixed; inset:0; z-index:85;"><div data-ku="closePanel" style="position:absolute; inset:0; background:rgba(58,42,21,.38);"></div></div>' +
    '<section class="ti-lib-panel" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="drawer-head">' +
        '<div style="display:flex; flex-direction:column; gap:2px; min-width:0;"><span class="ti-eyebrow">' + esc(kuState.eventId ? kuEventTitle(kuEvent(kuState.eventId)) : 'Finance') + '</span>' +
        '<h2 style="margin:0; font-weight:800; font-size:21px; letter-spacing:-.02em;">' + title + '</h2></div>' +
        '<button data-ku="closePanel" class="icon-btn close-btn" aria-label="Close">' + icon('x', 18) + '</button>' +
      '</div>' +
      '<div class="ku-panel-body">' + (f.error ? '<div class="ku-err">' + esc(f.error) + '</div>' : '') + body + '</div>' +
      '<div class="drawer-foot">' +
        '<button data-ku="closePanel" class="ti-btn-outline" style="padding:10px 16px; font-size:14px;">Cancel</button>' +
        '<button data-ku="save" class="ti-btn-orange"' + (f.busy ? ' disabled style="opacity:.6"' : '') + '>' + (f.busy ? (f.newReceipt ? 'Uploading receipt…' : 'Saving…') : f.kind === 'copy' ? 'Copy' : 'Save') + '</button>' +
      '</div>' +
    '</section>';
}

function kuSeg(field, value, opts) {
  return '<div class="ti-seg">' + opts.map(function (o) {
    return '<button data-ku="seg" data-f="' + field + '" data-v="' + o[0] + '" class="' + (value === o[0] ? 'on' : '') + '">' + esc(o[1]) + '</button>';
  }).join('') + '</div>';
}

function kuField(label, inner, hint) {
  return '<label class="ti-label"><span>' + label + '</span>' + inner + (hint != null ? hint : '') + '</label>';
}

function kuInput(field, value, attrs) {
  return '<input id="kuF-' + field + '" data-kuf="' + field + '" class="ti-field" value="' + esc(value) + '" ' + (attrs || '') + '>';
}

function kuAmtField(label, field, value) {
  return kuField(label, kuInput(field, value, 'inputmode="decimal" autocomplete="off" placeholder="e.g. 150k or 1.5m"'),
    '<span id="kuHint-' + field + '" class="ku-hint" style="font-size:12px; color:#8a7952; font-weight:600; margin-top:-2px;">' + esc(kuAmtHint(value)) + '</span>');
}

function kuLineForm(f) {
  var total = f.mode === 'unit' ? kuParseAmt(f.price) * Number(String(f.qty).replace(',', '.')) : NaN;
  return kuField('Type', kuSeg('type', f.type, [['out', 'Expense'], ['in', 'Income']])) +
    kuField('Category', tiComboHtml('kuCat')) +
    kuField('Description', kuInput('desc', f.desc, 'placeholder="' + (f.type === 'out' ? 'e.g. Snacks for 60' : 'e.g. Fees from 40 people') + '" autocomplete="off"')) +
    kuField('Amount as', kuSeg('mode', f.mode, [['total', 'Total'], ['unit', 'Qty × price']])) +
    (f.mode === 'unit'
      ? '<div style="display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:start;">' + kuField('Qty', kuInput('qty', f.qty, 'inputmode="decimal" autocomplete="off"')) + kuAmtField('Unit price', 'price', f.price) + '</div>' +
        '<div id="kuLineTotal" style="font-size:14px; font-weight:700; color:#6E2621;">' + (isFinite(total) && total > 0 ? 'Total ' + kuRp(total) : '') + '</div>'
      : kuAmtField('Amount', 'amount', f.amount)) +
    kuField('Notes', '<textarea data-kuf="notes" class="ti-field" rows="2" style="resize:vertical;">' + esc(f.notes) + '</textarea>');
}

function kuTxForm(f) {
  var html = kuField('Type', kuSeg('type', f.type, [['out', 'Expense'], ['in', 'Income']])) +
    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start;">' + kuAmtField('Amount', 'amount', f.amount) + kuField('Date', kuInput('date', f.date, 'type="date"')) + '</div>' +
    kuField('Budget line', tiComboHtml('kuLine')) +
    (f.lineId ? '' : kuField('Category', tiComboHtml('kuCat'))) +
    kuField('Description', kuInput('desc', f.desc, 'placeholder="' + (f.type === 'out' ? 'e.g. Catering deposit' : 'e.g. First round of fees') + '" autocomplete="off"'));
  if (f.type === 'out') {
    html += kuField('Paid from', kuSeg('source', f.source, [['kas', 'Youth fund'], ['personal', 'Personal money']]));
    if (f.source === 'personal') {
      html += kuField('Paid by', tiComboHtml('kuPaidBy')) +
        '<label class="ku-chk"><input type="checkbox" data-kuf="reimbursed"' + (f.reimbursed ? ' checked' : '') + '>Repaid from the fund</label>';
    }
  }
  var has = f.newReceipt || f.receiptId;
  html += kuField('Receipt (photo or PDF)',
    (has ? '<div style="display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #e6d8b6; border-radius:12px; padding:10px 12px;">' +
        (f.newReceipt && f.newReceipt.preview ? '<img src="' + f.newReceipt.preview + '" alt="" style="width:44px; height:44px; object-fit:cover; border-radius:8px;">' : '<span style="color:#8a7952;">' + icon('external', 18) + '</span>') +
        '<span style="flex:1; min-width:0; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(f.newReceipt ? f.newReceipt.name : f.receiptName || 'Receipt') + (f.newReceipt ? ' · not saved yet' : '') + '</span>' +
        (f.receiptId && !f.newReceipt ? '<span role="button" data-ku="receipt" data-id="' + esc(f.receiptId) + '" data-name="' + esc(f.receiptName) + '" class="ti-link">View</span>' : '') +
        '<span role="button" data-ku="receiptRemove" class="ti-link" style="color:' + TI_RED + ';">Remove</span></div>'
      : '<input type="file" data-kufile="1" accept="image/*,application/pdf" class="ti-field" style="padding:9px 12px;">'),
    f.reading ? '<span style="font-size:12px; color:#8a7952; font-weight:600;">Preparing photo…</span>' : '');
  return html;
}

function kuCopyForm(f) {
  return kuField('Copy from', tiComboHtml('kuCopy'));
}

function kuPinForm(f) {
  return kuField('Current PIN', '<input data-kuf="old" type="password" autocomplete="current-password" class="ti-field" value="' + esc(f.old) + '">') +
    kuField('New PIN (at least 6 characters)', '<input data-kuf="pin" type="password" autocomplete="new-password" class="ti-field" value="' + esc(f.pin) + '">') +
    kuField('Repeat new PIN', '<input data-kuf="pin2" type="password" autocomplete="new-password" class="ti-field" value="' + esc(f.pin2) + '">');
}

/* Searchable dropdowns reuse the Tata Ibadah combo (tiComboHtml); tiComboSpec hands ku* keys to this. */
function kuComboSpec(k) {
  var f = kuState.form || {};
  if (k === 'kuCat') {
    return {
      ph: 'Choose a category', value: f.category, text: f.category || '',
      options: function () { return KU_CATS[f.type].map(function (c) { return { v: c, label: c }; }); },
      pick: function (v) { f.category = v; }
    };
  }
  if (k === 'kuLine') {
    var cur = kuState.lines.filter(function (l) { return l.id === f.lineId; })[0];
    return {
      ph: 'Search budget lines', value: f.lineId, text: cur ? cur.desc : 'Unbudgeted',
      options: function () {
        return [{ v: '', label: 'Unbudgeted', sub: 'not planned', keep: true }].concat(kuLinesOf(kuState.eventId).filter(function (l) { return l.type === f.type; }).map(function (l) {
          return { v: l.id, label: l.desc, sub: l.category + ' · ' + kuRp(l.amount) };
        }));
      },
      pick: function (v) {
        var l = kuState.lines.filter(function (x) { return x.id === v; })[0];
        f.lineId = v;
        if (l) { f.category = l.category; if (!f.desc) f.desc = l.desc; }
        kuKeepFormValues(); kuRenderPanel();
      }
    };
  }
  if (k === 'kuPaidBy') {
    return {
      free: true, value: f.paidBy, text: f.paidBy || '', ph: 'Search or type a name', fresh: 'New name',
      options: function () {
        var seen = {}, out = [];
        kuState.txs.slice().reverse().concat(memberPool().map(function (m) { return { paidBy: m.name }; })).forEach(function (t) {
          var n = String(t.paidBy || '').trim();
          if (n && !seen[n.toLowerCase()]) { seen[n.toLowerCase()] = true; out.push({ v: n, label: n }); }
        });
        return out;
      },
      pick: function (v) { f.paidBy = v; }
    };
  }
  var src = kuState.events.filter(function (e) { return e.id === f.from; })[0];
  return { // kuCopy
    ph: 'Search events with a budget', value: f.from, text: src ? kuEventTitle(src) : '',
    options: function () {
      var n = {};
      kuState.lines.forEach(function (l) { n[l.eventId] = (n[l.eventId] || 0) + 1; });
      return kuState.events.filter(function (e) { return n[e.id] && e.id !== kuState.eventId; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
        .map(function (e) { return { v: e.id, label: kuEventTitle(e), sub: tiDayLabel(e.date) + ' · ' + n[e.id] + ' lines · ' + kuRp(kuSum(e.id).budOut) }; });
    },
    pick: function (v) { f.from = v; }
  };
}

/* Text inputs write to kuState.form as you type; this re-reads them before a re-render, in case one event was missed. */
function kuKeepFormValues() {
  var f = kuState.form;
  if (!f) return;
  Array.prototype.forEach.call(document.querySelectorAll('#kuPanel [data-kuf]'), function (el) {
    var k = el.getAttribute('data-kuf');
    f[k] = el.type === 'checkbox' ? el.checked : el.value;
  });
}

/* ---------- save ---------- */

function kuSave() {
  var f = kuState.form;
  if (!f || f.busy || f.reading) return;
  kuKeepFormValues();
  var fail = function (msg) { f.busy = false; f.error = msg; kuRenderPanel(); };
  var done = function () { kuState.form = null; kuRender(); };
  if (f.kind === 'line') {
    var p = { id: f.id, eventId: kuState.eventId, type: f.type, category: f.category, desc: f.desc, notes: f.notes, qty: '', price: '', amount: '' };
    if (!f.category) return fail('Choose a category.');
    if (f.mode === 'unit') {
      p.qty = Number(String(f.qty).replace(',', '.')); p.price = kuParseAmt(f.price);
      if (!(p.qty > 0) || !(p.price > 0)) return fail('Enter qty and unit price.');
    } else {
      p.amount = kuParseAmt(f.amount);
      if (!(p.amount > 0)) return fail('Enter an amount, e.g. 500000 or 500k.');
    }
    f.busy = true; f.error = ''; kuRenderPanel();
    kuCall('saveBudgetLine', [p], function (res) {
      if (!res.success) return fail(res.message);
      kuState.lines = kuState.lines.filter(function (l) { return l.id !== res.line.id; }).concat([res.line]);
      flash(f.id ? 'Budget line updated' : 'Budget line added');
      done();
    }, fail);
    return;
  }
  if (f.kind === 'tx') {
    var amt = kuParseAmt(f.amount);
    if (!(amt > 0)) return fail('Enter an amount, e.g. 250000 or 250k.');
    if (!f.lineId && !f.category) return fail('Choose a budget line or category.');
    if (f.type === 'out' && f.source === 'personal' && !String(f.paidBy).trim()) return fail('Enter who paid.');
    f.busy = true; f.error = ''; kuRenderPanel();
    var send = function (receiptId, receiptName) {
      var line = kuState.lines.filter(function (l) { return l.id === f.lineId; })[0];
      var t = { id: f.id, eventId: kuState.eventId, lineId: f.lineId, type: f.type, category: line ? line.category : f.category, date: f.date, desc: f.desc,
        amount: amt, source: f.source, paidBy: f.paidBy, reimbursed: f.reimbursed, receiptId: receiptId, receiptName: receiptName };
      kuCall('saveTransaction', [t], function (res) {
        if (!res.success) return fail(res.message);
        kuState.txs = kuState.txs.filter(function (x) { return x.id !== res.tx.id; }).concat([res.tx]);
        flash(f.id ? 'Transaction updated' : 'Transaction recorded');
        done();
      }, fail);
    };
    if (f.newReceipt) {
      kuCall('uploadReceipt', [kuState.eventId, f.newReceipt.name, f.newReceipt.mimeType, f.newReceipt.data], function (res) {
        if (!res.success) return fail(res.message);
        f.receiptId = res.receiptId; f.receiptName = res.receiptName; f.newReceipt = null;
        send(res.receiptId, res.receiptName);
      }, fail);
    } else send(f.receiptId, f.receiptName);
    return;
  }
  if (f.kind === 'copy') {
    if (!f.from) return fail('Choose an event to copy from.');
    f.busy = true; f.error = ''; kuRenderPanel();
    kuCall('copyBudget', [f.from, kuState.eventId], function (res) {
      if (!res.success) return fail(res.message);
      kuState.lines = kuState.lines.concat(res.lines);
      flash(res.lines.length + ' budget lines copied');
      done();
    }, fail);
    return;
  }
  if (f.kind === 'pin') {
    if (f.pin !== f.pin2) return fail('The new PINs don\'t match.');
    f.busy = true; f.error = ''; kuRenderPanel();
    kuCall('kuChangePin', [f.old, f.pin], function (res) {
      if (!res.success) return fail(res.message);
      flash(res.message);
      done();
    }, fail);
  }
}

/* Photos are shrunk to 1600px JPEG before upload (a phone photo drops from ~4 MB to ~300 KB); PDFs go as they are. */
function kuReadFile(file) {
  var f = kuState.form;
  if (!file || !f) return;
  if (!/^image\//.test(file.type) && file.type !== 'application/pdf') { f.error = 'Receipts must be a photo or PDF.'; kuRenderPanel(); return; }
  if (file.size > 20 * 1024 * 1024) { f.error = 'That file is too large.'; kuRenderPanel(); return; }
  f.reading = true; f.error = ''; kuKeepFormValues(); kuRenderPanel();
  var reader = new FileReader();
  reader.onload = function () {
    var url = String(reader.result), raw = function () {
      if (file.size > 8 * 1024 * 1024) { f.reading = false; f.error = 'Receipt is too large (max 8 MB).'; kuRenderPanel(); return; }
      f.newReceipt = { name: file.name, mimeType: file.type, data: url.slice(url.indexOf(',') + 1), preview: /^image\//.test(file.type) ? url : '' };
      f.reading = false; kuRenderPanel();
    };
    if (!/^image\//.test(file.type)) { raw(); return; }
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var jpg = c.toDataURL('image/jpeg', 0.82);
      f.newReceipt = { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', data: jpg.slice(jpg.indexOf(',') + 1), preview: jpg };
      f.reading = false; kuRenderPanel();
    };
    img.onerror = raw;   // e.g. HEIC outside Safari: upload unchanged
    img.src = url;
  };
  reader.onerror = function () { f.reading = false; f.error = 'Couldn\'t read that file.'; kuRenderPanel(); };
  reader.readAsDataURL(file);
}

/* ---------- receipt viewer ---------- */

function kuOpenReceipt(id, name) {
  kuState.receipt = { loading: true, name: name || 'Receipt' };
  kuRenderReceipt();
  kuCall('getReceipt', [id], function (res) {
    if (!kuState.receipt) return;
    var url = 'data:' + res.mimeType + ';base64,' + res.data;
    if (!/^image\//.test(res.mimeType)) {   // PDFs show through a blob URL; browsers refuse data: PDFs in frames
      var bin = atob(res.data), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      url = URL.createObjectURL(new Blob([bytes], { type: res.mimeType }));
    }
    kuState.receipt = { name: res.name, mimeType: res.mimeType, url: url };
    kuRenderReceipt();
  }, function (msg) { if (kuState.receipt) { kuState.receipt = { name: name, error: msg }; kuRenderReceipt(); } });
}

function kuCloseReceipt() {
  if (kuState.receipt && /^blob:/.test(kuState.receipt.url || '')) URL.revokeObjectURL(kuState.receipt.url);
  kuState.receipt = null;
  kuRenderReceipt();
}

function kuRenderReceipt() {
  var host = document.getElementById('kuReceipt');
  if (!host) { host = document.createElement('div'); host.id = 'kuReceipt'; document.body.appendChild(host); }
  var r = kuState.receipt;
  if (!r) { host.innerHTML = ''; return; }
  var inner = r.loading ? '<div style="color:#b3a37c; padding:40px;">Loading receipt…</div>'
    : r.error ? '<div class="ku-err" style="margin:20px;">' + esc(r.error) + '</div>'
    : /^image\//.test(r.mimeType) ? '<img src="' + r.url + '" alt="' + esc(r.name) + '" style="max-width:100%; max-height:calc(100vh - 160px); display:block; margin:0 auto;">'
    : '<iframe src="' + r.url + '" title="' + esc(r.name) + '" style="width:100%; height:calc(100vh - 160px); border:0;"></iframe>';
  host.innerHTML = '<div style="position:fixed; inset:0; z-index:150; display:flex; align-items:center; justify-content:center; padding:20px;">' +
    '<div data-ku="receiptClose" style="position:absolute; inset:0; background:rgba(58,42,21,.6);"></div>' +
    '<div style="position:relative; background:#FBF6E7; border-radius:18px; max-width:900px; width:100%; overflow:hidden; box-shadow:0 30px 70px rgba(58,42,21,.4);">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px; background:#F3E9CE; border-bottom:1px solid #e7d9b3;">' +
        '<span style="font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + esc(r.name) + '</span>' +
        '<span style="display:flex; gap:10px; align-items:center;">' + (r.url ? '<a href="' + r.url + '" download="' + esc(r.name) + '" class="ti-link">Download</a>' : '') +
        '<button data-ku="receiptClose" class="icon-btn close-btn" aria-label="Close">' + icon('x', 17) + '</button></span>' +
      '</div>' +
      '<div style="padding:12px; background:#fff; text-align:center;">' + inner + '</div>' +
    '</div></div>';
}

/* ---------- events ---------- */

function kuOnClick(e) {
  var el = e.target.closest && e.target.closest('[data-ku]');
  if (!el || !document.getElementById('viewKeuangan').contains(el) && !el.closest('#kuPanel') && !el.closest('#kuReceipt')) return;
  var a = el.getAttribute('data-ku'), id = el.getAttribute('data-id'), s = kuState;
  switch (a) {
    case 'pinGo': kuSubmitPin(); break;
    case 'lock': kuCall('kuLock', [], function () {}); s.token = ''; kuStore(''); s.loaded = false; s.screen = 'list'; s.form = null; s.pin = { v: '', v2: '', error: '', busy: false }; kuRender(); break;
    case 'changePin': s.form = { kind: 'pin', old: '', pin: '', pin2: '' }; kuRenderPanel(); break;
    case 'filter': s.filter = el.getAttribute('data-v'); kuRender(); break;
    case 'open': s.screen = 'event'; s.eventId = id; kuRender(); window.scrollTo(0, 0); break;
    case 'back': s.screen = 'list'; s.eventId = null; kuRender(); window.scrollTo(0, 0); break;
    case 'lineNew': kuOpenLine(null, el.getAttribute('data-type')); break;
    case 'lineEdit':
      if (e.target.closest('.ku-acts')) return;
      kuOpenLine(s.lines.filter(function (l) { return l.id === id; })[0]); break;
    case 'lineDel': e.stopPropagation(); kuAskDeleteLine(id); break;
    case 'txNew': e.stopPropagation(); kuOpenTx(null, el.getAttribute('data-type'), el.getAttribute('data-line')); break;
    case 'txEdit':
      if (e.target.closest('.ku-acts') || e.target.closest('[data-ku=receipt]')) return;
      kuOpenTx(s.txs.filter(function (t) { return t.id === id; })[0]); break;
    case 'txDel': e.stopPropagation(); kuAskDeleteTx(id); break;
    case 'copyOpen': s.form = { kind: 'copy', from: '' }; kuRenderPanel(); break;
    case 'closePanel': s.form = null; kuRenderPanel(); break;
    case 'save': kuSave(); break;
    case 'seg':
      kuKeepFormValues();
      var fld = el.getAttribute('data-f'), v = el.getAttribute('data-v');
      if (fld === 'type' && s.form.type !== v) { s.form.category = ''; s.form.lineId = ''; }
      s.form[fld] = v;
      kuRenderPanel(); break;
    case 'receipt': e.stopPropagation(); kuOpenReceipt(id, el.getAttribute('data-name')); break;
    case 'receiptClose': kuCloseReceipt(); break;
    case 'receiptRemove': kuKeepFormValues(); s.form.newReceipt = null; s.form.receiptId = ''; s.form.receiptName = ''; kuRenderPanel(); break;
  }
}

function kuAskDeleteLine(id) {
  var l = kuState.lines.filter(function (x) { return x.id === id; })[0];
  if (!l) return;
  var n = kuState.txs.filter(function (t) { return t.lineId === id; }).length;
  tiConfirm({ title: 'Delete budget line?', text: l.desc + ' (' + kuRp(l.amount) + ').' + (n ? ' Its ' + n + ' transactions stay as unbudgeted.' : ''), ok: 'Delete', danger: true }, function () {
    kuCall('deleteBudgetLine', [id], function (res) {
      if (!res.success) { flash(res.message); return; }
      kuState.lines = kuState.lines.filter(function (x) { return x.id !== id; });
      kuState.txs.forEach(function (t) { if (t.lineId === id) t.lineId = ''; });
      flash('Budget line deleted');
      kuRender();
    });
  });
}

function kuAskDeleteTx(id) {
  var t = kuState.txs.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  tiConfirm({ title: 'Delete transaction?', text: (t.desc || KU_TYPE[t.type]) + ' · ' + kuRp(t.amount) + ' · ' + tiShort(t.date) + (t.receiptId ? '. Its receipt moves to Drive trash.' : '.'), ok: 'Delete', danger: true }, function () {
    kuCall('deleteTransaction', [id], function (res) {
      if (!res.success) { flash(res.message); return; }
      kuState.txs = kuState.txs.filter(function (x) { return x.id !== id; });
      kuState.form = null;
      flash('Transaction deleted');
      kuRender();
    });
  });
}

function kuOnInput(e) {
  var t = e.target, s = kuState;
  var pin = t.getAttribute && t.getAttribute('data-kupin');
  if (pin) { s.pin[pin] = t.value; return; }
  if (t.getAttribute && t.getAttribute('data-kuq')) {
    s.q = t.value;
    var rows = document.getElementById('kuRows');
    if (rows) rows.innerHTML = kuRowsHtml();
    return;
  }
  var f = t.getAttribute && t.getAttribute('data-kuf');
  if (f && s.form) {
    s.form[f] = t.type === 'checkbox' ? t.checked : t.value;
    var hint = document.getElementById('kuHint-' + f);
    if (hint) hint.textContent = kuAmtHint(t.value);
    if ((f === 'qty' || f === 'price') && document.getElementById('kuLineTotal')) {
      var total = kuParseAmt(s.form.price) * Number(String(s.form.qty).replace(',', '.'));
      document.getElementById('kuLineTotal').textContent = isFinite(total) && total > 0 ? 'Total ' + kuRp(total) : '';
    }
  }
}

function kuOnChange(e) {
  if (e.target.getAttribute && e.target.getAttribute('data-kufile')) kuReadFile(e.target.files && e.target.files[0]);
}

function kuOnKey(e) {
  if (tiState.dialog || (e.target.getAttribute && e.target.getAttribute('data-ticombo'))) return;
  if (e.key === 'Escape') {
    if (kuState.receipt) { kuCloseReceipt(); return; }
    if (kuState.form) { kuState.form = null; kuRenderPanel(); return; }
  }
  if (e.key === 'Enter' && e.target.getAttribute) {
    if (e.target.getAttribute('data-kupin')) { e.preventDefault(); kuSubmitPin(); return; }
    if (kuState.form && e.target.closest('#kuPanel') && e.target.tagName === 'INPUT' && e.target.type !== 'file') { e.preventDefault(); kuSave(); }
  }
}

document.addEventListener('click', kuOnClick);
document.addEventListener('input', kuOnInput);
document.addEventListener('change', kuOnChange);
document.addEventListener('keydown', kuOnKey);
</script>
