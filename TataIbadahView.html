<script>

  ]},
  { name: 'Persembahan', blocks: [
    tiB('b17', 17, 'Nas persembahan', 'text', 'Duduk', { verse: 'of', field: 'offering', fieldLabel: 'Ajakan persembahan (Pnt)' }),
    tiB('b18', 18, 'Nyanyian persembahan', 'song', 'Duduk → berdiri', { cue: 'Kantong persembahan diedarkan · QR persembahan tampil di layar' }),
    tiB('b19', 19, 'Doa persembahan dan kesimpulan khotbah', 'fixed', 'Berdiri')
  ]},
  { name: 'Pengutusan', blocks: [

    tiB('b22', 22, 'Nyanyian penutup', 'song', 'Berdiri', { optional: true }),
    tiB('b23', 23, 'Penutup · saat teduh dan pengumuman', 'fixed', 'Duduk')
  ]}
];
var TI_BLOCKS = [].concat.apply([], TI_TPL.map(function (s) { return s.blocks; }));
var TI_BLOCK = {};
TI_BLOCKS.forEach(function (b) { TI_BLOCK[b.k] = b; });
var TI_VARIANT_KEYS = TI_BLOCKS.filter(function (b) { return b.kind === 'variant'; }).map(function (b) { return b.k; });
var TI_VARIANT_DEFAULT = { b8: 'A', b9: '1×', b11: '767h', b21: '768b' };

var tiState = {
  loaded: false, loading: false, loadError: '',
  services: [], songs: [], songById: {}, schedule: [],
  screen: 'list', monthF: 'all', statusF: 'Semua',
  cur: null, open: {}, flash: null, lastJump: null,
  saveLabel: '', saveError: false, saving: false, pending: null,
  picker: null, songForm: null, dialog: null, fetchSeq: 0,
  dl: { busy: '', error: '' },
  liturgy: { fixed: {}, defaults: {}, offeringVerse: { ref: '', text: '' } },
  conflict: null, vFetch: { kp: {}, ba: {}, of: {} }, vTimers: {}, combo: null, dateFree: false,
  searchIx: {}, searchCache: null,
  lib: { q: '', h: 'Semua', sort: 'number', limit: 80, sel: null, menu: false, merge: null, mergeTo: '', fetch: null, importing: false }
};

/* ---------- helpers ---------- */

function tiN(n) { return String(n).padStart(2, '0'); }
function tiAddDays(s, n) { return iso(shiftDays(fromIso(s), n)); }
function tiIsSunday(s) { var d = fromIso(s); return !!d && !isNaN(d) && d.getDay() === 0; }
function tiShort(s) { var d = fromIso(s); return d && !isNaN(d) ? d.getDate() + ' ' + TI_MON[d.getMonth()] : ''; }
function tiDateLong(s) {
  var d = fromIso(s);
  if (!d || isNaN(d)) return 'Tanggal belum diisi';
  return TI_DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + TI_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function tiSongCode(s) { return s && s.hymnal ? s.hymnal + ' ' + s.number : ''; }
function tiTheme(svc) { return (svc.series ? svc.series + ': ' : '') + (svc.sub || '…'); }
/* Verses picked as book / chapter / verses: svc.kpBook, svc.kpCh, svc.kpVs and so on; their TB text is texts.kpText. */
var TI_VERSES = { kp: 'Nas kata pembuka', ba: 'Nas berita anugerah', of: 'Nas persembahan' };
function tiRef(svc, p) {
  var vs = String(svc[p + 'Vs'] || '').trim();
  return svc[p + 'Book'] && svc[p + 'Ch'] && TI_VS_RE.test(vs) ? svc[p + 'Book'] + ' ' + svc[p + 'Ch'] + ':' + vs : '';
}
function tiIsOn(svc, b) { return (b.optional || b.kind === 'optional') ? !!svc.enabled[b.k] : true; }
function tiActiveSongBlocks(svc) { return TI_BLOCKS.filter(function (b) { return b.kind === 'song' && tiIsOn(svc, b); }); }
function tiByDate(date, exceptId) { return tiState.services.filter(function (s) { return s.date === date && s !== exceptId; })[0]; }
function tiSortedServices() { return tiState.services.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }); }
function tiPrevService(svc) {
  return tiSortedServices().filter(function (s) { return s !== svc && s.date && s.date < svc.date; })[0];
}
/* Tata Ibadah is for services only: a day's service is its Schedule row tagged "Service" (as pickScheduleEvent_). */
function tiIsService(e) { return String(e.tag || '').trim().toLowerCase() === 'service'; }

function tiScheduleOn(date) {
  return tiState.schedule.filter(function (e) { return e.date === date && tiIsService(e); })[0];
}

/* Upcoming service dates: Service rows in the Schedule plus Tata Ibadah already made, soonest first. */
function tiUpcomingServiceDates(n) {
  var today = iso(startOfToday()), seen = {};
  tiState.schedule.forEach(function (e) { if (tiIsService(e) && e.date >= today) seen[e.date] = true; });
  tiState.services.forEach(function (s) { if (s.date && s.date >= today) seen[s.date] = true; });
  return Object.keys(seen).sort().slice(0, n);
}

/* The service's weekly liturgist texts, with missing ones filled from the defaults. */
function tiTexts(svc) {
  var d = tiState.liturgy.defaults || {};
  svc.texts = svc.texts || {};
  ['call', 'confession', 'offering'].forEach(function (k) { if (svc.texts[k] == null) svc.texts[k] = d[k] || ''; });
  ['reading', 'kpText', 'kpTextRef', 'baText', 'baTextRef', 'ofText', 'ofTextRef'].forEach(function (k) { if (svc.texts[k] == null) svc.texts[k] = ''; });
  tiVerseDefaults(svc);
  return svc.texts;
}

/* Older services: Nas kata pembuka was free text, and the offering verse was the fixed one in LiturgiText.js. */
function tiVerseDefaults(svc) {
  if (svc.kp && !svc.kpBook) {
    var m = /^(.+?)\s+(\d+)\s*:\s*(.+)$/.exec(String(svc.kp).trim());
    var book = m && TI_BOOKS.filter(function (b) { return b.toLowerCase() === m[1].toLowerCase(); })[0];
    if (book && TI_VS_RE.test(m[3].trim())) { svc.kpBook = book; svc.kpCh = m[2]; svc.kpVs = m[3].trim(); }
  }
  if (svc.ofBook == null) {
    var ov = tiState.liturgy.offeringVerse || {}, om = /^(.+?)\s+(\d+):(.+)$/.exec(ov.ref || '');
    svc.ofBook = om ? om[1] : ''; svc.ofCh = om ? om[2] : ''; svc.ofVs = om ? om[3] : '';
    if (om && !svc.texts.ofText) { svc.texts.ofText = ov.text; svc.texts.ofTextRef = ov.ref; svc.texts.ofTextAuto = true; }
  }
}

/* LiturgiText.js marks (*bold* _italic_ ~blue italic~ ^blue^) as HTML. */
function tiMarksHtml(text) {
  var st = {}, out = '', keys = { '*': 'b', '_': 'i', '~': 'bi', '^': 'blue' };
  var open = function () {
    var css = (st.b ? 'font-weight:700;' : '') + (st.i || st.bi ? 'font-style:italic;' : '') + (st.bi || st.blue ? 'color:#31536f;' : '');
    return css ? '<span style="' + css + '">' : '<span>';
  };
  out = open();
  String(text).split('').forEach(function (c) {
    if (keys[c]) { st[keys[c]] = !st[keys[c]]; out += '</span>' + open(); } else out += esc(c);
  });
  return out + '</span>';
}

/* A fixed block's wording, as the booklet prints it. */
function tiFixedHtml(k) {
  var line = 'style="margin:0 0 4px;"';
  return (tiState.liturgy.fixed[k] || []).map(function (e) {
    switch (e[0]) {
      case 'say': return '<p ' + line + '><span style="display:inline-block; min-width:34px; font-weight:700;">' + esc(e[1]) + '</span>' + (e[1] ? ': ' : '') + tiMarksHtml(e[2]) + '</p>';
      case 'note': case 'p': return '<p style="margin:0 0 4px; text-align:center; font-style:italic;">' + tiMarksHtml(e[1]) + '</p>';
      case 'line': return '<p ' + line + '>' + tiMarksHtml(e[1]) + '</p>';
      case 'steps': return e[1].map(function (x) { return '<p style="margin:0 0 4px; padding-left:16px; text-indent:-16px;">•&nbsp;&nbsp;' + tiMarksHtml(x) + '</p>'; }).join('');
      case 'image': return '<p style="margin:0 0 4px; text-align:center; color:#9a8763;">[notasi ' + esc(e[1]) + ']</p>';
      case 'posture': return '<p style="margin:0 0 4px; text-align:right; font-style:italic;">(' + esc(e[1]) + ')</p>';
    }
    return '';
  }).join('');
}

/* Runs fn once any pending autosave has reached the sheet. */
function tiAfterSave(fn) {
  if (tiState.pending) tiFlushSave();
  (function go() {
    if (tiState.saving || tiState.pending) { setTimeout(go, 300); return; }
    fn();
  })();
}
function tiArr(svc, k) { var s = svc.arr[k]; return s ? s.split(' → ') : []; }

/* Most recent other service before svc that used songId: { date, weeks } or null. */
function tiSongUsage(songId, svc) {
  var hit = null;
  tiState.services.forEach(function (s) {
    if (s === svc || !s.date || s.date >= svc.date) return;
    var used = TI_BLOCKS.some(function (b) { return b.kind === 'song' && s.slots[b.k] === songId && tiIsOn(s, b); });
    if (used && (!hit || s.date > hit.date)) hit = { date: s.date };
  });
  if (hit) hit.weeks = Math.max(1, Math.round((fromIso(svc.date) - fromIso(hit.date)) / (7 * 86400000)));
  return hit;
}

/* Church-year label for a date (Gregorian Easter via the anonymous algorithm). */
function tiEaster(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  var month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function tiSeason(s) {
  var d = fromIso(s);
  if (!d || isNaN(d)) return '';
  var y = d.getFullYear(), t = d.getTime();
  var easter = tiEaster(y).getTime(), day = 86400000;
  var ashWed = easter - 46 * day, pentecost = easter + 49 * day;
  var dec24 = new Date(y, 11, 24);
  var advent1 = shiftDays(dec24, -dec24.getDay() - 21).getTime();
  var christKing = advent1 - 7 * day;
  if (t >= new Date(y, 11, 25).getTime() || t < new Date(y, 0, 6).getTime()) return 'Masa Natal';
  if (t >= advent1) return 'Masa Adven';
  if (t < ashWed) return 'Masa Epifania';
  if (t < easter) return 'Masa Prapaskah';
  if (t === easter) return 'Minggu Paskah';
  if (t < pentecost) return 'Masa Paskah';
  if (t === pentecost) return 'Minggu Pentakosta';
  if (t === christKing) return 'Minggu Kristus Raja';
  return d.getMonth() === 9 ? 'Bulan Keluarga' : 'Masa Biasa';
}

/* ---------- checks ---------- */

function tiChecks(svc) {
  var reds = [], ambers = [], greens = [];
  var req = [['date', 'Tanggal', svc.date], ['series', 'Seri', svc.series], ['sub', 'Sub-tema', svc.sub], ['pf', 'Pelayan Firman', svc.pf], ['kpBook', 'Nas kata pembuka', tiRef(svc, 'kp') || svc.kp], ['baBook', 'Nas berita anugerah', tiRef(svc, 'ba')], ['ofBook', 'Nas persembahan', tiRef(svc, 'of')]]
    .filter(function (r) { return !String(r[2] || '').trim(); });
  if (req.length) reds.push({ text: 'Kolom wajib kosong', sub: req.map(function (r) { return r[1]; }).join(', '), to: 'tiF-' + req[0][0] });
  else greens.push({ text: 'Kolom wajib lengkap' });

  if (tiIsSunday(svc.date)) greens.push({ text: 'Tanggal hari Minggu' });
  else if (svc.date) reds.push({ text: 'Tanggal bukan hari Minggu', to: 'tiF-date' });

  var songBlocks = tiActiveSongBlocks(svc);
  var empty = songBlocks.filter(function (b) { return !svc.slots[b.k]; });
  empty.forEach(function (b) { reds.push({ text: 'Slot lagu kosong', sub: tiN(b.n) + ' · ' + b.title, to: 'tiBlk-' + b.k }); });
  if (!empty.length) greens.push({ text: 'Semua slot lagu terisi' });

  var ph = [['series', svc.series], ['sub', svc.sub], ['season', svc.season]].filter(function (f) { return TI_PLACEHOLDER.test(String(f[1] || '')); });
  if (ph.length) reds.push({ text: 'Teks placeholder tertinggal', sub: ph.map(function (f) { return '“' + f[1] + '”'; }).join(', '), to: 'tiF-' + ph[0][0] });
  else greens.push({ text: 'Tanpa teks placeholder' });

  var ids = songBlocks.map(function (b) { return svc.slots[b.k]; }).filter(Boolean);
  var dups = ids.filter(function (x, i) { return ids.indexOf(x) !== i; }).filter(function (x, i, a) { return a.indexOf(x) === i; });
  dups.forEach(function (id) {
    var last = songBlocks.filter(function (b) { return svc.slots[b.k] === id; }).pop();
    reds.push({ text: 'Lagu dipakai dua kali', sub: (tiState.songById[id] || {}).title || id, to: 'tiBlk-' + last.k });
  });
  if (!dups.length) greens.push({ text: 'Tidak ada lagu ganda' });

  songBlocks.forEach(function (b) {
    var song = tiState.songById[svc.slots[b.k]];
    var u = song && tiSongUsage(song.id, svc);
    if (u && u.weeks <= TI_RECENT_WEEKS) ambers.push({ text: song.title + ' baru dipakai', sub: tiShort(u.date) + ' · ' + b.title, to: 'tiBlk-' + b.k });
  });
  songBlocks.forEach(function (b) {
    var song = tiState.songById[svc.slots[b.k]];
    if (song && !tiHasLyrics(song)) ambers.push({ text: 'Lirik ' + song.title + ' belum ada', sub: 'Buka pemilih lagu untuk mengambil lirik', to: 'tiBlk-' + b.k });
  });
  songBlocks.forEach(function (b) {
    if (svc.slots[b.k] && !svc.arr[b.k]) ambers.push({ text: 'Urutan lagu belum diisi', sub: tiN(b.n) + ' · ' + b.title, to: 'tiBlk-' + b.k });
  });

  var next = svc.date ? tiByDate(tiAddDays(svc.date, 7)) : null;
  if (next && next.pk) {
    if (svc.enabled.b15) greens.push({ text: 'Sensura Morum sesuai kalender', sub: 'Perjamuan Kudus pada ' + tiShort(next.date) });
    else ambers.push({ text: 'Sensura Morum mati', sub: 'Minggu depan Perjamuan Kudus (' + tiShort(next.date) + ')', to: 'tiBlk-b15' });
  }

  var tx = tiTexts(svc);
  if (!tx.call.trim() || /\.\.\.\s*$/.test(tx.call)) ambers.push({ text: 'Kata liturgos panggilan beribadah belum diisi', to: 'tiF-call' });
  if (!tx.reading.trim()) ambers.push({ text: 'Bacaan Alkitab belum diisi', to: 'tiF-reading' });
  ['ba', 'of'].forEach(function (p) {
    if (tiRef(svc, p) && !tx[p + 'Text'].trim()) ambers.push({ text: 'Teks ' + TI_VERSES[p].toLowerCase() + ' kosong', sub: tiRef(svc, p), to: 'tiF-' + p + 'Text' });
  });

  var prev = tiPrevService(svc);
  if (prev && prev.texts && prev.texts.confession && prev.texts.confession === tx.confession) {
    ambers.push({ text: 'Narasi pengakuan dosa sama dengan minggu lalu', sub: 'Pastikan disengaja', to: 'tiF-confession' });
  }
  if (prev) {
    TI_VARIANT_KEYS.forEach(function (k) {
      if (prev.variants[k] && svc.variants[k] !== prev.variants[k]) ambers.push({ text: 'Variasi berbeda dari minggu lalu', sub: TI_BLOCK[k].title + ': pastikan disengaja', to: 'tiBlk-' + k });
    });
  }
  return { reds: reds, ambers: ambers, greens: greens };
}

function tiTodos(svc) {
  var t = [];
  [['date', 'Tanggal'], ['series', 'Seri'], ['sub', 'Sub-tema'], ['pf', 'Pelayan Firman']].forEach(function (f) {
    if (!String(svc[f[0]] || '').trim() || (f[0] === 'date' && !tiIsSunday(svc.date))) t.push({ id: 'tiF-' + f[0], label: f[1] });
  });
  TI_BLOCKS.forEach(function (b) {
    if (b.k === 'b2' && /\.\.\.\s*$|^\s*$/.test(tiTexts(svc).call)) t.push({ id: 'tiF-call', label: 'Kata liturgos' });
    if (b.verse && !tiRef(svc, b.verse) && !(b.verse === 'kp' && svc.kp)) t.push({ id: 'tiF-' + b.verse + 'Book', label: TI_VERSES[b.verse] });
    if (b.k === 'b11' && !tiTexts(svc).reading.trim()) t.push({ id: 'tiF-reading', label: 'Bacaan Alkitab' });
    if (b.kind === 'song' && tiIsOn(svc, b)) {
      if (!svc.slots[b.k]) t.push({ id: 'tiBlk-' + b.k, label: tiN(b.n) + ' · ' + b.title });
      else if (!svc.arr[b.k]) t.push({ id: 'tiBlk-' + b.k, label: 'Urutan · ' + b.title });
    }
  });
  return t;
}

/* ---------- data ---------- */

function tiEnter() {
  if (!tiState.loaded && !tiState.loading) tiLoad();
  tiRender();
}

function tiLoad() {
  tiState.loading = true;
  google.script.run
    .withSuccessHandler(function (data) {
      tiState.loading = false;
      tiState.loaded = true;
      tiState.services = data.services || [];
      tiState.schedule = data.schedule || [];
      if (tiState.cur && tiState.cur.id) {
        var fresh = tiState.services.filter(function (s) { return s.id === tiState.cur.id; })[0];
        if (fresh) tiState.cur = fresh;
      }
      if (data.liturgy) tiState.liturgy = data.liturgy;
      tiSetSongs(data.songs || []);
      tiRender();
    })
    .withFailureHandler(function (err) {
      tiState.loading = false;
      tiState.loadError = err && err.message ? err.message : String(err);
      tiRender();
    })
    .getTataIbadahData();
}

function tiSetSongs(songs) {
  tiState.songs = songs;
  tiState.songById = {};
  songs.forEach(function (s) { tiState.songById[s.id] = s; });
}

function tiQueueSave() {
  tiState.pending = tiState.cur;
  tiState.saveLabel = 'Menyimpan…';
  tiState.saveError = false;
  tiRenderSaveLabel();
  clearTimeout(tiState.saveTimer);
  tiState.saveTimer = setTimeout(tiFlushSave, 700);
}

/* Saves the service waiting in tiState.pending; a save requested while one is in flight runs when it returns. */
function tiFlushSave() {
  clearTimeout(tiState.saveTimer);
  var svc = tiState.pending;
  if (!svc || tiState.saving) return;
  if (tiState.conflict && tiState.conflict.svc === svc && !svc.forceSave) { tiState.pending = null; return; }
  tiState.pending = null;
  tiState.saving = true;
  var payload = {
    id: svc.id, date: svc.date, season: svc.season, series: svc.series, sub: svc.sub, pf: svc.pf, kp: svc.kp,
    pk: svc.pk, status: svc.status,
    slots: svc.slots, arr: svc.arr, variants: svc.variants, enabled: svc.enabled, lyrics: svc.lyrics,
    texts: tiTexts(svc), baseUpdatedAt: svc.updatedAt || '', force: !!svc.forceSave
  };
  Object.keys(TI_VERSES).forEach(function (p) {
    payload[p + 'Book'] = svc[p + 'Book'] || ''; payload[p + 'Ch'] = svc[p + 'Ch'] || ''; payload[p + 'Vs'] = String(svc[p + 'Vs'] || '').trim();
  });
  google.script.run
    .withSuccessHandler(function (res) {
      tiState.saving = false;
      if (res.success) {
        svc.id = res.id;
        svc.updatedAt = res.updatedAt;
        svc.forceSave = false;
        tiState.saveLabel = 'Tersimpan otomatis · ' + res.savedAt;
        tiState.saveError = false;
        if (res.schedule) {
          tiState.schedule = tiState.schedule.filter(function (e) { return e.id !== res.schedule.id; }).concat([res.schedule]);
          tiRenderSchedHint();
        }
        if (res.scheduleChanged && typeof fetchSchedule === 'function') fetchSchedule();
      } else if (res.conflict) {
        tiState.conflict = { svc: svc, latest: res.latest };
        tiState.saveLabel = 'Belum tersimpan: ada versi lebih baru';
        tiState.saveError = true;
        tiRenderBanner();
      } else {
        tiState.saveLabel = res.message;
        tiState.saveError = true;
      }
      tiRenderSaveLabel();
      if (tiState.pending) tiFlushSave();
    })
    .withFailureHandler(function (err) {
      tiState.saving = false;
      tiState.saveLabel = 'Gagal menyimpan: ' + (err && err.message ? err.message : err);
      tiState.saveError = true;
      tiRenderSaveLabel();
    })
    .saveTataIbadah(payload);
}

/* ---------- navigation inside Tata Ibadah ---------- */

/* The next Service in the Schedule without a Tata Ibadah; else the next free Sunday. */
function tiNextOpenService() {
  var open = tiUpcomingServiceDates(60).filter(function (d) { return !tiByDate(d) && tiScheduleOn(d); })[0];
  return open || tiNextEmptySunday();
}

function tiNextEmptySunday() {
  var d = startOfToday();
  d = shiftDays(d, (7 - d.getDay()) % 7);
  for (var i = 0; i < 104; i++) {
    var s = iso(shiftDays(d, i * 7));
    if (!tiByDate(s)) return s;
  }
  return iso(d);
}

function tiNewService(date, duplicate) {
  date = date || tiNextOpenService();
  var probe = { date: date };
  var prev = tiPrevService(probe) || tiSortedServices()[0];
  var sched = tiScheduleOn(date);
  var next = tiByDate(tiAddDays(date, 7));
  var svc = {
    id: null, date: date, season: '', series: prev ? prev.series : '', sub: '', pf: prev ? prev.pf : '', kp: '',
    kpBook: '', kpCh: '', kpVs: '', baBook: '', baCh: '', baVs: '', pk: false, status: 'Draft',
    slots: {}, arr: {}, variants: {}, enabled: { b15: !!(next && next.pk), b22: false }, lyrics: {}, texts: {}
  };
  var carry = (prev && prev.texts) || {};
  ['call', 'confession', 'offering'].forEach(function (k) { if (carry[k] != null) svc.texts[k] = carry[k]; });
  if (prev && prev.ofBook != null) {
    svc.ofBook = prev.ofBook; svc.ofCh = prev.ofCh; svc.ofVs = prev.ofVs;
    ['ofText', 'ofTextRef', 'ofTextAuto'].forEach(function (k) { if (carry[k] != null) svc.texts[k] = carry[k]; });
  }
  tiTexts(svc);
  TI_VARIANT_KEYS.forEach(function (k) { svc.variants[k] = (prev && prev.variants[k]) || TI_VARIANT_DEFAULT[k]; });
  if (duplicate && prev) {
    svc.slots = JSON.parse(JSON.stringify(prev.slots));
    svc.arr = JSON.parse(JSON.stringify(prev.arr));
    svc.lyrics = JSON.parse(JSON.stringify(prev.lyrics || {}));
    svc.enabled.b22 = !!prev.enabled.b22;
  }
  if (sched) tiApplySchedule(svc, sched);
  tiState.services.push(svc);
  tiOpenService(svc);
  tiState.pending = svc;
  tiFlushSave();
}

function tiApplySchedule(svc, sched) {
  var theme = tiThemeOf(sched);
  var i = theme.indexOf(':');
  if (i !== -1) { svc.series = theme.slice(0, i).trim(); svc.sub = theme.slice(i + 1).trim(); }
  else if (theme) { svc.series = ''; svc.sub = theme; }
  if (sched.pastor) svc.pf = sched.pastor;
}

function tiOpenService(svc) {
  tiTexts(svc);
  tiState.dateFree = false;
  tiState.combo = null;
  tiState.cur = svc;
  tiState.conflict = null;
  tiState.screen = 'builder';
  tiState.open = {};
  tiState.lastJump = null;
  tiState.saveLabel = svc.id ? 'Tersimpan' : '';
  tiState.saveError = false;
  tiState.dl.error = '';
  tiRender();
  window.scrollTo(0, 0);
}

function tiGoList() {
  if (tiState.pending) tiFlushSave();
  tiState.screen = 'list';
  tiState.cur = null;
  tiRender();
  window.scrollTo(0, 0);
}

/* Asks before deleting a service (from its row in the list or the builder header). */
function tiAskDelete(svc) {
  if (!svc) return;
  tiConfirm({ title: 'Hapus tata ibadah?', text: tiTheme(svc) + ' · ' + tiDateLong(svc.date) + ' akan dihapus' + (svc.status === 'Published' ? ', walaupun sudah diterbitkan' : '') +
    '. Jadwal di Event input dan Google Doc-nya tidak ikut terhapus. Ini tidak bisa dibatalkan.', ok: 'Hapus', danger: true },
    function () { tiDeleteService(svc); });
}

function tiTrashHtml(attrs) {
  return '<span role="button" ' + attrs + ' class="icon-btn ti-trash" title="Hapus tata ibadah" aria-label="Hapus tata ibadah">' + icon('trash', 17) + '</span>';
}

function tiDeleteService(svc) {
  if (tiState.pending === svc) { clearTimeout(tiState.saveTimer); tiState.pending = null; }
  var drop = function () {
    tiState.services = tiState.services.filter(function (s) { return s !== svc; });
    tiState.cur = null;
    tiState.screen = 'list';
    tiRender();
  };
  if (!svc.id) { drop(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { flash(res.message); return; }
      drop();
      flash(res.message);
    })
    .withFailureHandler(function (err) { flash('Gagal menghapus: ' + (err && err.message ? err.message : err)); })
    .deleteTataIbadah(svc.id);
}

function tiJumpTo(id) {
  var el = document.getElementById(id);
  if (!el) return;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 110, behavior: 'smooth' });
  if (el.matches('input,select')) setTimeout(function () { el.focus({ preventScroll: true }); }, 350);
  tiState.lastJump = id;
  var card = el.querySelector('[data-ring]') || el;
  card.animate([{ boxShadow: '0 0 0 4px #fbd9bc' }, { boxShadow: '0 0 0 4px rgba(251,217,188,0)' }], { duration: 1600, easing: 'ease-out' });
  tiRenderAside();
}

function tiRender() {
  var root = document.getElementById('viewTata');
  if (tiState.screen === 'builder' && tiState.cur) root.innerHTML = tiBuilderHtml();
  else if (tiState.screen === 'library') { root.innerHTML = tiLibraryHtml(); tiRenderLibraryList(); tiRenderLibPanel(); }
  else root.innerHTML = tiListHtml();
  tiRenderModal();
}

function tiTabs(active) {
  return '<div style="display:flex; gap:6px; margin-top:10px;">' + [['list', 'Ibadah'], ['library', 'Perpustakaan lagu']].map(function (t) {
    return '<button data-ti="tab" data-v="' + t[0] + '" class="pill-btn' + (active === t[0] ? ' on' : '') + '">' + t[1] + '</button>';

}

      '</span>' +
      '<span style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">' + tiStatusPill(svc.status) +
        (warn ? '<span style="font-size:12px; font-weight:600; color:' + (chk.reds.length ? TI_RED : '#a3420e') + '; white-space:nowrap;">' + warn + '</span>' : '') +

}

/* Tanggal is picked from the Service events registered in Event input; "Tanggal lain…" falls back to any date. */
function tiServiceEvents(svc) {
  var from = iso(shiftDays(startOfToday(), -35)), byDate = {};
  tiState.schedule.forEach(function (e) { if (tiIsService(e) && (e.date >= from || e.date === svc.date) && !byDate[e.date]) byDate[e.date] = e; });
  return Object.keys(byDate).sort().map(function (d) { return byDate[d]; });
}

function tiDateFieldHtml(svc) {
  var evs = tiServiceEvents(svc), input;
  if (tiState.dateFree || !evs.length) {
    input = '<input id="tiF-date" data-tif="date" type="date" class="ti-field" value="' + esc(svc.date) + '">' +
      (evs.length ? '<span><span data-ti="dateList" class="ti-link">Pilih dari jadwal</span></span>' : '<span style="font-size:12px; color:#8a7952;">Belum ada ibadah terdaftar di Event input</span>');
  } else {
    input = tiComboHtml('date');
  }
  return '<div id="tiDateField" class="ti-label"><span>Tanggal · ibadah terdaftar</span>' + input + '</div>';
}

function tiRenderDateField() {
  var el = document.getElementById('tiDateField');
  if (el) el.outerHTML = tiDateFieldHtml(tiState.cur);
}

/* A Service picked as the date brings its theme and Pelayan Firman from the schedule. */
function tiTakeSchedule(svc) {
  var sched = tiScheduleOn(svc.date);
  if (!sched || !(tiThemeOf(sched) || sched.pastor)) return;
  tiApplySchedule(svc, sched);
  ['series', 'sub', 'pf'].forEach(function (k) { var el = document.getElementById('tiF-' + k); if (el) el.value = svc[k]; });
}

/* Masa is optional: blank by default, with the church-calendar season offered as a one-click suggestion. */
function tiSeasonHintHtml() {
  var svc = tiState.cur, s = !svc.season && tiSeason(svc.date);
  return s ? '<span style="font-size:12px; color:#8a7952;">Saran: <span data-ti="seasonUse" class="ti-link">' + esc(s) + '</span></span>' : '';
}

/* ---------- searchable dropdowns ---------- */

/* Event input rows can carry "Untitled event" as their theme: treat it as no theme. */
function tiThemeOf(e) {
  var t = String(e && e.theme || '').trim();
  return /^untitled(\s+event)?$/i.test(t) ? '' : t;
}

function tiDayLabel(d) { return d ? tiShort(d) + ' ' + d.slice(0, 4) : ''; }

/* Values used before (series or PF), newest first, leaving out the open service's own. */
function tiRecent(fromSvc, fromEvent) {
  var last = {}, cur = tiState.cur;
  var add = function (v, date) { v = String(v || '').trim(); if (v && !(last[v] >= date)) last[v] = date || ''; };
  tiState.services.forEach(function (s) { if (s !== cur) add(fromSvc(s), s.date); });
  tiState.schedule.forEach(function (e) { if (tiIsService(e) && !(cur && e.date === cur.date)) add(fromEvent(e), e.date); });
  return Object.keys(last).sort(function (a, b) { return last[a] < last[b] ? 1 : last[a] > last[b] ? -1 : a.localeCompare(b); })
    .map(function (v) { return { v: v, label: v, sub: tiDayLabel(last[v]) }; });
}

/*
 * What each dropdown lists and does. Items are { v, label, sub, disabled, keep };
 * "free" dropdowns keep whatever is typed (a new series or name), the others
 * only take a listed item and show its text again when left.
 */
function tiComboSpec(k) {
  var svc = tiState.cur, L = tiState.lib;
  if (k === 'date') {
    var sched = tiScheduleOn(svc.date);
    return {
      ph: 'Cari tanggal atau tema', value: svc.date,
      text: svc.date ? tiDayLabel(svc.date) + (sched && tiThemeOf(sched) ? ' · ' + tiThemeOf(sched) : '') : '',
      options: function () {
        var evs = tiServiceEvents(svc), items = [];
        if (svc.date && !evs.some(function (e) { return e.date === svc.date; })) items.push({ v: svc.date, label: tiDayLabel(svc.date), sub: 'belum di jadwal', keep: true });
        evs.forEach(function (e) {
          var taken = tiByDate(e.date, svc);
          items.push({ v: e.date, label: tiDayLabel(e.date), sub: (tiThemeOf(e) || 'tanpa tema') + (taken ? ' · sudah ada' : ''), disabled: !!taken });
        });
        return items.concat([{ v: '__free', label: 'Tanggal lain…', keep: true }]);
      },
      pick: function (v) {
        if (v === '__free') { tiState.dateFree = true; tiRenderDateField(); return; }
        svc.date = v;
        tiTakeSchedule(svc);
      }
    };
  }
  if (k === 'series' || k === 'pf') {
    return {
      free: true, value: svc[k], text: svc[k] || '',
      ph: k === 'series' ? 'Cari atau tulis seri' : 'Cari atau tulis nama PF', fresh: k === 'series' ? 'Seri baru' : 'Nama baru',
      options: function () {
        return k === 'series'
          ? tiRecent(function (s) { return s.series; }, function (e) { var t = tiThemeOf(e); return t.indexOf(':') !== -1 ? t.split(':')[0] : ''; })
          : tiRecent(function (s) { return s.pf; }, function (e) { return e.pastor; });
      },
      pick: function (v) { svc[k] = v; }
    };
  }
  if (k === 'mergeTo') {
    var into = tiState.songById[L.mergeTo];
    return {
      ph: 'Cari lagu pengganti', value: L.mergeTo, text: into ? (tiSongCode(into) ? tiSongCode(into) + ' · ' : '') + into.title : '',
      options: function () {
        return tiState.songs.filter(function (o) { return o.id !== L.merge; }).sort(function (a, b) { return a.title.localeCompare(b.title); })
          .map(function (o) { return { v: o.id, label: o.title, sub: tiSongCode(o) || 'Kontemporer' }; });
      },
      pick: function (v) { L.mergeTo = v; }
    };
  }
  return { // kpBook, baBook, ofBook
    ph: 'Cari kitab', value: svc[k], text: svc[k] || '',
    options: function () { return TI_BOOKS.map(function (b) { return { v: b, label: b }; }); },
    pick: function (v) { svc[k] = v; tiVerseChanged(k.slice(0, 2)); }
  };
}

function tiComboHtml(k, wrapStyle, inputStyle) {
  var sp = tiComboSpec(k);
  return '<div style="position:relative; min-width:0; ' + (wrapStyle || '') + '">' +
    '<input id="tiF-' + k + '" data-ticombo="' + k + '"' + (sp.free ? ' data-tif="' + k + '"' : '') + ' class="ti-field ti-combo-input" autocomplete="off" spellcheck="false" value="' + esc(sp.text) + '" placeholder="' + esc(sp.ph) + '" style="' + (inputStyle || '') + '">' +
    '<span data-ti="comboToggle" data-k="' + k + '" class="ti-chev">' + icon('down', 16) + '</span>' +
    '<div id="tiCombo-' + k + '" class="ti-combo" hidden></div>' +
  '</div>';
}

function tiComboItems(c) {
  var sp = tiComboSpec(c.k), all = sp.options(), q = tiNorm(c.q), toks = q ? q.split(' ') : [];
  var match = function (o) { var h = tiNorm(o.label + ' ' + (o.sub || '')); return toks.every(function (t) { return h.indexOf(t) !== -1; }); };
  if (!sp.free) return q ? all.filter(function (o) { return o.keep || match(o); }) : all;
  var exact = all.some(function (o) { return tiNorm(o.v) === q; });
  var items = exact || !q ? all : all.filter(match);
  return q && !exact ? [{ v: c.q.trim(), label: sp.fresh + ': “' + c.q.trim() + '”' }].concat(items) : items;
}

function tiRenderCombo() {
  var c = tiState.combo, box = c && document.getElementById('tiCombo-' + c.k);
  if (!box) return;
  c.items = tiComboItems(c);
  c.hi = Math.max(0, Math.min(c.hi, c.items.length - 1));
  box.hidden = false;
  box.innerHTML = c.items.length ? c.items.map(function (o, i) {
    return '<div class="ti-combo-opt' + (i === c.hi ? ' on' : '') + (o.disabled ? ' dis' : '') + (o.v === c.value ? ' cur' : '') + '" data-ticopt="' + i + '">' +
      '<span class="ti-combo-l">' + esc(o.label) + '</span>' + (o.sub ? '<small>' + esc(o.sub) + '</small>' : '') + '</div>';
  }).join('') : '<div class="ti-combo-empty">Tidak ditemukan</div>';
  var on = box.querySelector('.on');
  if (on && on.offsetTop < box.scrollTop) box.scrollTop = on.offsetTop;
  else if (on && on.offsetTop + on.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = on.offsetTop + on.offsetHeight - box.clientHeight;
}

function tiComboOpen(k) {
  var sp = tiComboSpec(k), inp = document.getElementById('tiF-' + k);
  tiState.combo = { k: k, q: sp.free && inp ? inp.value : '', value: sp.value, hi: 0 };
  var items = tiComboItems(tiState.combo);
  items.forEach(function (o, i) { if (o.v === sp.value) tiState.combo.hi = i; });
  if (!sp.free && inp) inp.select();
  tiRenderCombo();
}

function tiComboClose() {
  var c = tiState.combo;
  tiState.combo = null;
  if (!c) return;
  var box = document.getElementById('tiCombo-' + c.k), inp = document.getElementById('tiF-' + c.k), sp = tiComboSpec(c.k);
  if (box) box.hidden = true;
  if (inp && !sp.free) inp.value = sp.text;
}

function tiComboPick(i) {
  var c = tiState.combo, o = c && c.items && c.items[i];
  if (!o || o.disabled) return;
  tiComboSpec(c.k).pick(o.v);
  tiComboClose();
  var inp = document.getElementById('tiF-' + c.k);
  if (inp) inp.value = tiComboSpec(c.k).text;
  if (c.k !== 'mergeTo' && tiState.cur) { tiRenderDynamic(); tiQueueSave(); }
}

/* Moves the highlight, skipping items that cannot be picked. */
function tiComboMove(dir) {
  var c = tiState.combo, n = c.items.length, i = c.hi;
  for (var step = 0; step < n; step++) {
    i = Math.max(0, Math.min(n - 1, i + dir));
    if (!c.items[i].disabled) { c.hi = i; break; }
  }
  tiRenderCombo();
}

function tiComboKey(e, k) {
  var c = tiState.combo;
  if (!c || c.k !== k) { if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); tiComboOpen(k); } return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); tiComboMove(e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (c.items.length) tiComboPick(c.hi); else tiComboClose(); }
  else if (e.key === 'Escape') { e.preventDefault(); tiComboClose(); }
  else if (e.key === 'Tab') tiComboClose();
}

/* Options and the chevron act on mousedown so the input keeps focus. */
function tiOnMouseDown(e) {
  var opt = e.target.closest && e.target.closest('[data-ticopt]');
  if (opt) { e.preventDefault(); tiComboPick(Number(opt.getAttribute('data-ticopt'))); return; }
  var tog = e.target.closest && e.target.closest('[data-ti=comboToggle]');
  if (!tog) return;
  e.preventDefault();
  var k = tog.getAttribute('data-k'), inp = document.getElementById('tiF-' + k);
  if (!inp || inp.matches(':disabled')) return;
  if (tiState.combo && tiState.combo.k === k) tiComboClose();
  else if (document.activeElement === inp) tiComboOpen(k);
  else inp.focus();
}

/* Fills a verse's text from Alkitab TB; force replaces text the user edited. */
function tiFetchVerse(p, force) {
  var svc = tiState.cur, ref = svc && tiRef(svc, p);

  var tx = tiTexts(svc);
  if (!force && tx[p + 'Text'] && (tx[p + 'TextRef'] === ref || !tx[p + 'TextAuto'])) { tiRenderVerse(p); return; }
  tiState.vFetch[p] = { busy: true };
  tiRenderVerse(p);
  google.script.run
    .withSuccessHandler(function (res) {
      tiState.vFetch[p] = { error: res.success ? '' : res.message };
      if (res.success && tiState.cur === svc && tiRef(svc, p) === ref) {
        tx[p + 'Text'] = res.text; tx[p + 'TextRef'] = ref; tx[p + 'TextAuto'] = true;
        var el = document.getElementById('tiF-' + p + 'Text');
        if (el) el.value = res.text;
        tiRenderAside();
        tiQueueSave();

      tiRenderVerse(p);
    })
    .withFailureHandler(function (err) { tiState.vFetch[p] = { error: err && err.message ? err.message : String(err) }; tiRenderVerse(p); })
    .fetchBibleText(svc[p + 'Book'], svc[p + 'Ch'], String(svc[p + 'Vs'] || '').trim());
}

/* Builds the liturgy on the server (after any pending autosave): saves .pdf/.docx in the browser, or makes a Google Doc. */
function tiDownload(fmt, confirmed) {
  var svc = tiState.cur, dl = tiState.dl;
  if (!confirmed) {
    var reds = tiChecks(svc).reds.length, warn = [];
    if (fmt === 'gdocUpdate') warn.push('Isi Google Doc akan ditulis ulang dari tata ibadah ini. Perubahan manual di Doc itu tertimpa; versi lama tetap ada di File › Riwayat versi.');
    if (reds) warn.push('Masih ada ' + reds + ' pemblokir merah di pemeriksaan.');
    if (warn.length) {
      tiConfirm({ title: fmt === 'gdocUpdate' ? 'Perbarui Google Doc?' : 'Tetap buat liturgi?', text: warn.join(' '), ok: fmt === 'gdocUpdate' ? 'Perbarui' : 'Tetap buat' },
        function () { tiDownload(fmt, true); });
      return;
    }
  }
  dl.busy = fmt; dl.error = '';
  tiRenderAside();
  tiAfterSave(function () {
    google.script.run
      .withSuccessHandler(function (res) {
        dl.busy = '';
        if (!res.success) { if (res.gone) svc.doc = null; dl.error = res.message; tiRenderAside(); return; }
        if (fmt === 'gdoc' || fmt === 'gdocUpdate') { svc.doc = res.doc; flash(res.message); tiRenderAside(); return; }
        var bin = atob(res.base64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([bytes], { type: res.mimeType }));
        var a = document.createElement('a');
        a.href = url; a.download = res.filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
        flash(res.filename + ' diunduh');
        tiRenderAside();
      })
      .withFailureHandler(function (err) { dl.busy = ''; dl.error = err && err.message ? err.message : String(err); tiRenderAside(); })
      [{ gdoc: 'createLiturgyDoc', gdocUpdate: 'updateLiturgyDoc' }[fmt] || 'downloadLiturgy'](svc.id, fmt);
  });
}

/* Songs matching the library's search, book filter and sort. */
function tiLibraryRows() {
  var L = tiState.lib, q = L.q.trim().toLowerCase();
  var num = /^\d+[a-z]?$/.test(q) ? q : '';
  var match = function (s, h) {
    if (h === 'Lirik kosong') return !tiHasLyrics(s);
    return h === 'Semua' || (h === 'Kontemporer' ? !s.hymnal : s.hymnal === h);
  };
  var ranks = !num && q ? tiSearchRanks(q).ranks : null;
  var matchQ = function (s) {
    if (!q) return true;
    if (num) return s.number.toLowerCase().indexOf(num) === 0;
    return ranks[s.id] != null;
  };
  var stats = {};
  var stat = function (s) { return stats[s.id] || (stats[s.id] = tiSongStats(s.id)); };
  var byNumber = function (a, b) {
    return TI_LIB_BOOKS.indexOf(a.hymnal) - TI_LIB_BOOKS.indexOf(b.hymnal) ||
      (parseInt(a.number, 10) || 0) - (parseInt(b.number, 10) || 0) || a.number.localeCompare(b.number) || a.title.localeCompare(b.title);
  };
  var sorts = {
    number: function (a, b) { return (num ? (a.number.toLowerCase() === num ? 0 : 1) - (b.number.toLowerCase() === num ? 0 : 1) : ranks ? ranks[a.id] - ranks[b.id] : 0) || byNumber(a, b); },
    title: function (a, b) { return a.title.localeCompare(b.title); },
    recent: function (a, b) { return (stat(b).last || '').localeCompare(stat(a).last || '') || byNumber(a, b); },
    used: function (a, b) { return stat(b).count - stat(a).count || byNumber(a, b); }
  };
  return {
    match: match, matchQ: matchQ, stat: stat,
    rows: tiState.songs.filter(function (s) { return match(s, L.h) && matchQ(s); }).sort(sorts[L.sort] || sorts.number)
  };
}

function tiImportAllTitles(confirmed) {

      flash(res.total ? res.total + ' lagu ditambahkan (KJ ' + (a.KJ || 0) + ', KK ' + (a.KK || 0) + ', PKJ ' + (a.PKJ || 0) + ', NKB ' + (a.NKB || 0) + ')' : 'Semua judul sudah ada di perpustakaan');

    .importHymnalIndex();

/* Fetches a hymn's lyrics into the library; number may name one version ("767h"), which becomes its own song. */
function tiLibFetchLyrics(id, number) {
  var L = tiState.lib, song = tiState.songById[id];
  if (!song) return;
  var token = ++tiState.fetchSeq;
  L.fetch = { id: id, busy: true, error: '', variants: null, token: token, number: number };
  tiRenderLibPanel();
  tiSlowFetchWatch(function () { return L.fetch && L.fetch.token === token && L.fetch.busy ? L.fetch : null; }, tiRenderLibPanel);
  google.script.run
    .withSuccessHandler(function (res) {
      if (!L.fetch || L.fetch.token !== token) return;   // a newer request (retry or another song) took over
      if (res.variants) L.fetch = { id: id, busy: false, error: '', variants: res.variants };
      else if (!res.success) L.fetch = { id: id, busy: false, error: res.message, variants: null };
      else {
        L.fetch = null;
        tiSetSongs(tiState.songs.filter(function (s) { return s.id !== res.song.id; }).concat([res.song]));
        if (L.sel === id) L.sel = res.song.id;
        if (res.ms != null) console.info('Lirik ' + res.song.title + ' diambil dalam ' + res.ms + ' ms');
      }
      tiRenderLibraryList();
      tiRenderLibPanel();
    })
    .withFailureHandler(function (err) {
      if (!L.fetch || L.fetch.token !== token) return;
      L.fetch = { id: id, busy: false, error: err && err.message ? err.message : String(err), variants: null };
      tiRenderLibPanel();
    })
    .importHymnalSong(song.hymnal, number || song.number);
}

function tiDeleteSong(id, replaceWith) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        if (res.used) { tiState.lib.merge = id; tiState.lib.mergeTo = ''; tiRenderLibPanel(); }
        flash(res.message);
        return;
      }
      tiState.lib.merge = null;
      tiState.lib.sel = null;
      flash(res.message);
      tiLoad();
    })
    .withFailureHandler(function (err) { flash('Gagal: ' + (err && err.message ? err.message : err)); })
    .deleteSong(id, replaceWith || '');
}

/*
 * Fetches a hymn's lyrics from the online hymnal into its library entry
 * (titles imported in bulk start without them). number may name one version
 * ("767h") of a number that has several.
 */
function tiFetchLyrics(id, number) {
  var pk = tiState.picker, song = tiState.songById[id];
  if (!pk || !song) return;
  var token = ++tiState.fetchSeq;
  pk.fetch = { id: id, busy: true, error: '', variants: null, token: token, number: number };
  tiRenderPickerParts();
  tiSlowFetchWatch(function () { return tiState.picker === pk && pk.fetch && pk.fetch.token === token && pk.fetch.busy ? pk.fetch : null; }, tiRenderPickerParts);
  google.script.run
    .withSuccessHandler(function (res) {
      if (tiState.picker !== pk || !pk.fetch || pk.fetch.token !== token) return;
      if (res.variants) { pk.fetch = { id: id, busy: false, error: '', variants: res.variants }; tiRenderPickerParts(); return; }
      if (!res.success) { pk.fetch = { id: id, busy: false, error: res.message, variants: null }; tiRenderPickerParts(); return; }
      pk.fetch = null;
      tiSetSongs(tiState.songs.filter(function (s) { return s.id !== res.song.id; }).concat([res.song]));
      tiSelectSong(res.song.id);
    })
    .withFailureHandler(function (err) {
      if (tiState.picker !== pk || !pk.fetch || pk.fetch.token !== token) return;
      pk.fetch = { id: id, busy: false, error: err && err.message ? err.message : String(err), variants: null };
      tiRenderPickerParts();
    })
    .importHymnalSong(song.hymnal, number || song.number);
}

function tiLyric(song, label) {

/* ---------- song search (title, number, credits, lyrics) ---------- */

/* Lowercase, punctuation dropped (so "Firman-Mu" matches "firmanmu"), whitespace collapsed. */
function tiNorm(s) {
  return String(s || '').toLowerCase().replace(/[’‘'`"“”!?.,:;()\[\]\/\-–—]/g, '').replace(/\s+/g, ' ').trim();
}

/* Search text per song, rebuilt only when the song object or its sections change. */
function tiSearchIndex(s) {
  var ix = tiState.searchIx[s.id];
  if (ix && ix.s === s && ix.sec === s.sections) return ix;
  var head = tiNorm(tiSongCode(s) + ' ' + s.title);
  var body = tiNorm(s.credits + ' ' + s.sections.map(function (x) { return x.text; }).join(' '));
  var words = {};
  (head + ' ' + body).split(' ').forEach(function (w) { if (w.length >= 3) words[w] = 1; });
  return (tiState.searchIx[s.id] = { s: s, sec: s.sections, head: head, title: tiNorm(s.title), body: body, words: Object.keys(words) });
}

/* At most one typo between two words: a letter added, dropped, changed or two swapped ("plita" ~ "pelita"). */
function tiNear(a, b) {
  var la = a.length, lb = b.length, i = 0;
  if (Math.abs(la - lb) > 1) return false;
  while (i < la && i < lb && a.charAt(i) === b.charAt(i)) i++;
  if (i === la && i === lb) return true;
  if (la === lb) return a.slice(i + 1) === b.slice(i + 1) || (a.charAt(i) === b.charAt(i + 1) && a.charAt(i + 1) === b.charAt(i) && a.slice(i + 2) === b.slice(i + 2));
  return la > lb ? a.slice(i + 1) === b.slice(i) : a.slice(i) === b.slice(i + 1);
}

function tiTokenIn(tok, ix) {
  if (ix.head.indexOf(tok) !== -1 || ix.body.indexOf(tok) !== -1) return 1;
  if (tok.length < 4) return 0;
  for (var i = 0; i < ix.words.length; i++) if (tiNear(tok, ix.words[i])) return 2;
  return 0;
}

/* 0 title starts with it · 1 in code/title · 2 phrase in lyrics or credits · 3 every word found · 4 with typos · -1 no match. */
function tiSongRank(s, q, toks) {
  var ix = tiSearchIndex(s);
  if (ix.title.indexOf(q) === 0 || ix.head.indexOf(q) === 0) return 0;
  if (ix.head.indexOf(q) !== -1) return 1;
  if (ix.body.indexOf(q) !== -1) return 2;
  var fuzzy = false;
  for (var i = 0; i < toks.length; i++) {
    var hit = tiTokenIn(toks[i], ix);
    if (!hit) return -1;
    if (hit === 2) fuzzy = true;
  }
  return fuzzy ? 4 : 3;
}

/* Ranks by song id for a query, cached until the query or the library changes. */
function tiSearchRanks(query) {
  var q = tiNorm(query), c = tiState.searchCache;
  if (c && c.q === q && c.songs === tiState.songs) return c;
  var toks = q ? q.split(' ') : [], ranks = {};
  tiState.songs.forEach(function (s) { var r = q ? tiSongRank(s, q, toks) : 0; if (r >= 0) ranks[s.id] = r; });
  return (tiState.searchCache = { q: q, toks: toks, songs: tiState.songs, ranks: ranks });
}

/* The lyric line that best matches the query, shown under results found by their lyrics. */
function tiLyricHit(s, toks) {
  var best = '', bestN = 0;
  s.sections.forEach(function (sec) {
    String(sec.text || '').split('\n').forEach(function (line) {
      var n = tiNorm(line), words = n.split(' '), hits = 0;
      toks.forEach(function (t) { if (n.indexOf(t) !== -1 || (t.length >= 4 && words.some(function (w) { return tiNear(t, w); }))) hits++; });
      if (hits > bestN) { bestN = hits; best = line; }
    });
  });
  return best;
}

function tiPickerMatches() {
  var pk = tiState.picker, sr = tiSearchRanks(pk.q), ranks = sr.ranks;
  var matchH = function (s, h) { return h === 'Semua' || (h === 'Kontemporer' ? !s.hymnal : s.hymnal === h); };
  if (!pk.sorted || pk.sorted.sr !== sr) {
    pk.sorted = { sr: sr, list: tiState.songs.filter(function (s) { return ranks[s.id] != null; })
      .sort(function (a, b) { return ranks[a.id] - ranks[b.id] || a.title.localeCompare(b.title); }) };
  }
  return { matchH: matchH, ranks: ranks, toks: sr.toks, all: pk.sorted.list, results: pk.sorted.list.filter(function (s) { return matchH(s, pk.h); }) };
}

/* ---------- pasted lyrics → sections ---------- */

var TI_HEADING_RE = /^[\[\(]?\s*(bait|verse|ayat|v|reff?|refrain|chorus|korus|bridge|jembatan|pre[\s-]?chorus|pre[\s-]?reff?|tag|coda|ending|outro|intro|interlude|ad[\s-]?lib)\s*(\d+)?\s*[\]\)]?\s*[:.]?\s*(.*)$/i;
var TI_CHORD_RE = /\[[A-G][#b]?(m|maj|min|sus|dim|aug|add)?\d*(\/[A-G][#b]?)?\]/g;
var TI_FOOTER_RE = /^(ccli|©|\(c\)|copyright|for use solely|note: reproduction|all rights reserved|admin\.? by|lisensi)/i;
var TI_FOOTER_SKIP_RE = /^(ccli (song|license)|for use solely|note: reproduction)/i;
var TI_REPEAT_RE = /\s*[\(\[]?\s*(?:x\s*(\d)|(\d)\s*x)\s*[\)\]]?\s*$/i;

/* Canonical label for a heading word: verses become "Bait N", the rest keep a tidy English/Indonesian name. */
function tiHeadingLabel(word, num, counters) {
  var w = word.toLowerCase().replace(/[\s-]/g, '');
  if (w === 'bait' || w === 'verse' || w === 'ayat' || w === 'v') {
    var n = num ? Number(num) : (counters.verse + 1);
    counters.verse = Math.max(counters.verse, n);
    return 'Bait ' + n;
  }
  var names = { ref: 'Ref', reff: 'Ref', refrain: 'Ref', chorus: 'Chorus', korus: 'Chorus', bridge: 'Bridge', jembatan: 'Bridge',
    prechorus: 'Pre-Chorus', preref: 'Pre-Ref', prereff: 'Pre-Ref', tag: 'Tag', coda: 'Coda', ending: 'Ending', outro: 'Outro',
    intro: 'Intro', interlude: 'Interlude', adlib: 'Ad lib' };
  return (names[w] || word) + (num ? ' ' + num : '');
}

/*
 * Turns pasted lyrics into { title, credits, sections:[{label,text}], arr }.
 * Understands section headings ("Verse 1", "Reff:", "[Chorus]", "1."),
 * ChordPro ({title:}, {soc}, [G] chords), SongSelect text exports (title
 * line + CCLI footer) and "(2x)" repeats. Without headings, blank-line
 * paragraphs become verses and a paragraph that repeats becomes the Ref.
 */
function tiParseLyrics(raw) {
  var lines = String(raw || '').replace(/\r\n?/g, '\n').split('\n');
  var title = '', credits = [], blocks = [], cur = null, counters = { verse: 0 }, sawHeading = false, footer = false;

  var start = function (label) { cur = { label: label, lines: [], repeat: 1 }; blocks.push(cur); };
  var push = function (text) {
    if (!cur) start(null);
    var rep = text.match(TI_REPEAT_RE);
    if (rep) { cur.repeat = Number(rep[1] || rep[2]); text = text.replace(rep[0], ''); }
    if (text.trim()) cur.lines.push(text);
  };

  lines.forEach(function (line) {
    var t = line.replace(TI_CHORD_RE, '').replace(/\s+$/, '');
    var trimmed = t.trim();
    var dir = trimmed.match(/^\{\s*([a-z_]+)\s*(?::\s*(.*?))?\s*\}$/i);
    if (dir) {
      var key = dir[1].toLowerCase(), val = (dir[2] || '').trim();
      if (key === 'title' || key === 't') title = val;
      else if (/^(subtitle|st|artist|composer|lyricist|copyright)$/.test(key)) { if (val) credits.push(val); }
      else if (key === 'soc' || key === 'start_of_chorus') { sawHeading = true; start(tiHeadingLabel(val || 'Chorus', '', counters)); }
      else if (key === 'sov' || key === 'start_of_verse') { sawHeading = true; start(tiHeadingLabel('Verse', (val.match(/\d+/) || [''])[0], counters)); }
      else if (key === 'sob' || key === 'start_of_bridge') { sawHeading = true; start('Bridge'); }
      else if (/^(c|comment|ci|comment_italic)$/.test(key)) {
        var hm = val.match(TI_HEADING_RE);
        if (hm && !hm[3]) { sawHeading = true; start(tiHeadingLabel(hm[1], hm[2], counters)); }
      } else if (/^(eoc|end_of_chorus|eov|end_of_verse|eob|end_of_bridge)$/.test(key)) cur = null;
      return;
    }
    if (TI_FOOTER_RE.test(trimmed) || (footer && trimmed)) {
      footer = true;
      if (!TI_FOOTER_SKIP_RE.test(trimmed)) credits.push(trimmed.replace(/^(©|\(c\))\s*/i, '© ').replace(/\s*\|\s*/g, ', '));
      return;
    }
    if (!trimmed) { if (cur && cur.lines.length) cur = null; return; }

    var num = trimmed.match(/^(\d+)\s*[.)]\s*(.*)$/);
    if (num && Number(num[1]) < 30) {
      sawHeading = true;
      start(tiHeadingLabel('Bait', num[1], counters));
      if (num[2]) push(num[2]);
      return;
    }
    var repM = trimmed.match(TI_REPEAT_RE);
    var head = repM ? trimmed.replace(repM[0], '').trim() : trimmed;
    var hm2 = head.length <= 40 || /[:\]]/.test(head) ? head.match(TI_HEADING_RE) : null;
    if (hm2 && (!hm2[3] || /^[\[\(]?\s*\w[\w\s-]*\d*\s*[\]\):]/.test(head))) {
      sawHeading = true;
      start(tiHeadingLabel(hm2[1], hm2[2], counters));
      if (repM) cur.repeat = Number(repM[1] || repM[2]);
      if (hm2[3]) push(hm2[3].trim());
      return;
    }
    push(trimmed);
  });

  /* SongSelect / slide exports put the title alone on the first line. */
  if (!title && blocks.length > 1 && !blocks[0].label && blocks[0].lines.length === 1 && blocks[0].lines[0].length <= 60 && (footer || sawHeading)) {
    title = blocks.shift().lines[0];
  }

  var sections = [], order = [], textByLabel = {}, labelByText = {};
  if (!sawHeading) {
    var count = {};
    blocks.forEach(function (b) { var k = b.lines.join('\n'); count[k] = (count[k] || 0) + 1; });
    var refText = Object.keys(count).filter(function (k) { return count[k] > 1; }).sort(function (a, b) { return count[b] - count[a]; })[0];
    var v = 0;
    blocks.forEach(function (b) {
      var k = b.lines.join('\n');
      b.label = k === refText ? 'Ref' : labelByText[k] || 'Bait ' + (++v);
      labelByText[k] = b.label;
    });
  }

  var unnamed = 0;
  blocks.forEach(function (b) {
    var text = b.lines.join('\n').trim();
    var label = b.label || (sections.length ? 'Bagian ' + (++unnamed + 1) : 'Bait 1');
    if (!text) {
      if (textByLabel[label] != null) for (var r = 0; r < b.repeat; r++) order.push(label);
      return;
    }
    if (textByLabel[label] != null && textByLabel[label] !== text) {
      for (var n = 2; textByLabel[label + ' ' + n] != null && textByLabel[label + ' ' + n] !== text; n++);
      label = label + ' ' + n;
    }
    if (textByLabel[label] == null) { textByLabel[label] = text; sections.push({ label: label, text: text }); }
    for (var i = 0; i < b.repeat; i++) order.push(label);
  });

  return { title: title, credits: credits.join(' · '), sections: sections, arr: order.join(' → ') };
}

  tiState.songForm = song

    : { id: null, hymnal: '', number: '', title: tiTypedTitle(tiState.picker ? tiState.picker.q : ''), credits: '', language: 'Indonesia', arr: '', sections: [{ label: 'Bait 1', text: '' }, { label: 'Ref', text: '' }], error: '', saving: false, paste: '', pasteOpen: true, pasteNote: '' };

/* "sampai akhir hidupku" typed in search → "Sampai Akhir Hidupku"; text with any capitals is kept as typed. */
function tiTypedTitle(q) {
  q = String(q || '').trim();
  if (/^(kj|kk|pkj|nkb)\s*\d/i.test(q)) return '';
  return q === q.toLowerCase() ? q.replace(/(^|\s)(\S)/g, function (m, pre, ch) { return pre + ch.toUpperCase(); }) : q;
}

function tiParsePaste() {
  var f = tiState.songForm, r = tiParseLyrics(f.paste);
  if (!r.sections.length) { f.error = 'Tidak ada lirik yang terbaca dari teks yang ditempel.'; f.pasteNote = ''; tiRenderModal(); return; }
  f.sections = r.sections;
  f.arr = r.arr;
  if (r.title && !f.title.trim()) f.title = r.title;
  if (r.credits && !f.credits.trim()) f.credits = r.credits;
  f.error = '';
  f.pasteNote = r.sections.length + ' bagian terbaca · urutan: ' + r.arr;
  tiRenderModal();
}

function tiSaveSongForm() {
  var f = tiState.songForm;
  if (!f.title.trim()) { f.error = 'Judul lagu wajib diisi.'; tiRenderModal(); return; }
  f.saving = true; f.error = '';
  tiRenderModal();
  google.script.run
    .withSuccessHandler(function (res) {
      f.saving = false;
      if (!res.success) { f.error = res.message; tiRenderModal(); return; }
      var songs = tiState.songs.filter(function (s) { return s.id !== res.song.id; }).concat([res.song]);
      tiSetSongs(songs);
      tiState.songForm = null;
      tiRenderModal();
      if (tiState.picker) tiSelectSong(res.song.id);
      tiRenderDynamic();
      if (tiState.screen === 'library') { tiRenderLibraryList(); tiRenderLibPanel(); }
      flash(res.message);
    })
    .withFailureHandler(function (err) {
      f.saving = false;
      f.error = err && err.message ? err.message : String(err);
      tiRenderModal();
    })
    .saveSong({ id: f.id, hymnal: f.hymnal, number: f.number, title: f.title, credits: f.credits, language: f.language, arr: f.arr, sections: f.sections });
}

/*
 * In-app replacement for window.confirm. opts: { title, text, ok, cancel, danger }.
 * onOk runs when confirmed; Esc, Batal or the backdrop cancel.
 */
function tiConfirm(opts, onOk) {
  tiState.dialog = { opts: opts, onOk: onOk };
  var host = document.getElementById('tiDialog');
  if (!host) { host = document.createElement('div'); host.id = 'tiDialog'; document.body.appendChild(host); }
  var okBg = opts.danger ? TI_RED : '#E85511';
  host.innerHTML = '<div style="position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;">' +
    '<div data-ti="dialogCancel" style="position:absolute; inset:0; background:rgba(58,42,21,.45);"></div>' +
    '<div role="dialog" aria-modal="true" style="position:relative; width:100%; max-width:420px; background:#FBF6E7; border-radius:20px; box-shadow:0 30px 70px rgba(58,42,21,.4); padding:22px 22px 18px; display:flex; flex-direction:column; gap:10px;">' +
      '<h2 style="margin:0; font-weight:800; font-size:20px; letter-spacing:-.02em; color:#3a2a15;">' + esc(opts.title || 'Lanjutkan?') + '</h2>' +
      (opts.text ? '<p style="margin:0; font-size:14px; line-height:1.55; color:#6b5a38;">' + esc(opts.text) + '</p>' : '') +
      '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">' +
        '<button data-ti="dialogCancel" class="ti-btn-outline" style="padding:10px 16px; font-size:14px;">' + esc(opts.cancel || 'Batal') + '</button>' +
        '<button id="tiDialogOk" data-ti="dialogOk" style="padding:10px 18px; border-radius:12px; background:' + okBg + '; color:#fff; font-weight:700; font-size:14px; cursor:pointer;">' + esc(opts.ok || 'Lanjutkan') + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  document.getElementById('tiDialogOk').focus();
}

function tiCloseDialog(confirmed) {
  var d = tiState.dialog;
  tiState.dialog = null;
  var host = document.getElementById('tiDialog');
  if (host) host.innerHTML = '';
  if (confirmed && d && d.onOk) d.onOk();
}

/* ---------- events (delegated) ---------- */

function tiOnClick(e) {
  if (tiState.lib.menu && !(e.target.closest && e.target.closest('[data-ti=libMenu],[data-ti=libImportAll]'))) {
    tiState.lib.menu = false;
    if (tiState.screen === 'library') tiRender();
  }
  var el = e.target.closest && e.target.closest('[data-ti]');
  if (!el) return;
  var a = el.getAttribute('data-ti'), k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
  var svc = tiState.cur, pk = tiState.picker, sf = tiState.songForm;
  var i = Number(el.getAttribute('data-i'));

  var editing = { toggle: 1, variant: 1, pick: 1, fetchVerse: 1, seasonUse: 1, dateList: 1 };
  if (editing[a] && svc && svc.status === 'Published' && tiState.screen === 'builder') { flash('Terkunci: ubah status ke Review untuk mengedit'); return; }

  switch (a) {
    case 'dialogOk': tiCloseDialog(true); return;
    case 'dialogCancel': tiCloseDialog(false); return;
    case 'tab': tiState.screen = v; tiState.cur = null; tiRender(); window.scrollTo(0, 0); break;
    case 'libH': tiState.lib.h = v; tiState.lib.limit = 80; tiRenderLibraryList(); break;
    case 'libOpen': tiLibOpen(el.getAttribute('data-id')); break;
    case 'libClose': tiState.lib.sel = null; tiState.lib.merge = null; tiRenderLibraryList(); tiRenderLibPanel(); break;
    case 'libMore': tiState.lib.limit += 80; tiRenderLibraryList(); break;
    case 'libMenu': tiState.lib.menu = !tiState.lib.menu; tiRender(); break;
    case 'libEdit': tiOpenSongForm(tiState.songById[el.getAttribute('data-id')]); break;
    case 'libDelete':
      var sid = el.getAttribute('data-id'), stats = tiSongStats(sid);
      if (stats.count) { tiState.lib.merge = sid; tiState.lib.mergeTo = ''; tiRenderLibPanel(); }
      else tiConfirm({ title: 'Hapus lagu?', text: '“' + tiState.songById[sid].title + '” dihapus dari perpustakaan.', ok: 'Hapus', danger: true }, function () { tiDeleteSong(sid); });
      break;
    case 'libMerge':
      if (!tiState.lib.mergeTo) { flash('Pilih lagu pengganti dulu'); return; }
      var mid = el.getAttribute('data-id'), into = tiState.lib.mergeTo;
      tiConfirm({ title: 'Gabungkan lagu?', text: '“' + tiState.songById[mid].title + '” diganti dengan “' + tiState.songById[into].title + '” di semua tata ibadah, lalu dihapus.', ok: 'Gabungkan & hapus', danger: true },
        function () { tiDeleteSong(mid, into); });
      break;
    case 'libCancel': tiState.lib.merge = null; tiRenderLibPanel(); break;
    case 'libImportAll': tiImportAllTitles(); break;
    case 'libFetch': tiLibFetchLyrics(el.getAttribute('data-id')); break;
    case 'libVariant': tiLibFetchLyrics(tiState.lib.fetch.id, el.getAttribute('data-n')); break;
    case 'libRetry': tiLibFetchLyrics(tiState.lib.fetch.id, tiState.lib.fetch.number); break;
    case 'pickVariant': tiFetchLyrics(pk.fetch.id, el.getAttribute('data-n')); break;
    case 'retryLyrics': tiFetchLyrics(pk.fetch.id, pk.fetch.number); break;
    case 'fetchVerse': tiFetchVerse(k, true); break;
    case 'seasonUse': e.preventDefault(); svc.season = tiSeason(svc.date); document.getElementById('tiF-season').value = svc.season; tiRenderDynamic(); tiQueueSave(); break;
    case 'dateList': tiState.dateFree = false; tiRenderDateField(); break;
    case 'conflictLoad':
      var latest = tiState.conflict && tiState.conflict.latest;
      if (latest) Object.keys(latest).forEach(function (key) { svc[key] = latest[key]; });
      tiState.conflict = null; tiState.pending = null;
      tiState.saveLabel = 'Versi terbaru dimuat'; tiState.saveError = false;
      tiRender();
      break;
    case 'conflictForce':
      if (tiState.conflict && tiState.conflict.latest) svc.updatedAt = tiState.conflict.latest.updatedAt;
      tiState.conflict = null; svc.forceSave = true;
      tiRenderBanner(); tiQueueSave();
      break;
    case 'new': tiNewService(el.getAttribute('data-date')); break;
    case 'duplicate': tiNewService(el.getAttribute('data-date'), true); break;
    case 'open': tiOpenService(tiByDate(el.getAttribute('data-date'))); break;
    case 'openSvc': tiOpenService(tiState.services[Number(el.getAttribute('data-idx'))]); break;
    case 'statusF': tiState.statusF = v; tiRender(); break;
    case 'back': tiGoList(); break;
    case 'delete': tiAskDelete(svc); break;
    case 'trashSvc': tiAskDelete(tiState.services[Number(el.getAttribute('data-idx'))]); break;
    case 'jump': tiJumpTo(el.getAttribute('data-to')); break;
    case 'expand': tiState.open[k] = !tiState.open[k]; tiRenderBlock(k); break;
    case 'toggle': svc.enabled[k] = !svc.enabled[k]; tiRenderDynamic(); tiQueueSave(); break;
    case 'variant': svc.variants[k] = v; tiRenderBlock(k); tiRenderAside(); tiQueueSave(); break;
    case 'status':
      if (el.disabled) return;
      var was = svc.status;
      svc.status = v;
      if (was === 'Published' || v === 'Published') tiRender(); else tiRenderAside();
      tiQueueSave();
      break;
    case 'pick': e.preventDefault(); tiOpenPicker(k); break;
    case 'download': if (!el.disabled) tiDownload(v); break;

    case 'closePicker': tiState.picker = null; tiRenderModal(); break;
    case 'confirmPick': tiConfirmPick(); break;
    case 'hymnal': pk.h = v; tiRenderPickerParts(); tiOnlineSearchSoon(); break;
    case 'onlineImport': tiOnlineImport(el.getAttribute('data-h'), el.getAttribute('data-n'), el.getAttribute('data-row')); break;
    case 'selSong': tiSelectSong(el.getAttribute('data-id')); break;
    case 'seqReset': var song = tiState.songById[pk.sel]; pk.seq = song.arr ? song.arr.split(' → ') : []; pk.chipSel = null; tiRenderPickerParts(); break;
    case 'seqRepeat': if (pk.seq.length) { pk.seq = pk.seq.concat(pk.seq); pk.chipSel = null; tiRenderPickerParts(); } break;
    case 'addMenu': pk.addMenu = !pk.addMenu; tiRenderPickerParts(); break;
    case 'seqAdd': pk.seq.push(v); tiRenderPickerParts(); break;
    case 'chip': pk.chipSel = pk.chipSel === i ? null : i; tiRenderPickerParts(); break;
    case 'chipRemove': e.stopPropagation(); pk.seq.splice(i, 1); pk.chipSel = null; tiRenderPickerParts(); break;
    case 'chipLeft': if (pk.chipSel > 0) tiSeqMove(pk.chipSel, pk.chipSel - 1); break;
    case 'chipRight': if (pk.chipSel < pk.seq.length - 1) tiSeqMove(pk.chipSel, pk.chipSel + 1); break;
    case 'chipDup': pk.seq.splice(pk.chipSel + 1, 0, pk.seq[pk.chipSel]); pk.chipSel++; tiRenderPickerParts(); break;
    case 'secToggle': pk.secOpen[v] = !pk.secOpen[v]; pk.secEdit[v] = false; tiRenderPickerParts(); break;
    case 'secEdit': pk.secEdit[v] = true; tiRenderPickerParts(); break;
    case 'secDone': pk.secEdit[v] = false; tiRenderPickerParts(); break;
    case 'newSong': tiOpenSongForm(null); break;
    case 'editSong': tiOpenSongForm(tiState.songById[pk.sel]); break;

    case 'closeSongForm': tiState.songForm = null; tiRenderModal(); break;
    case 'sfAdd': sf.sections.push({ label: '', text: '' }); tiRenderModal(); break;
    case 'sfRemove': sf.sections.splice(i, 1); tiRenderModal(); break;
    case 'sfSave': tiSaveSongForm(); break;
    case 'sfParse': tiParsePaste(); break;
    case 'sfPasteOpen': sf.pasteOpen = true; tiRenderModal(); break;
  }
}

function tiOnInput(e) {
  var t = e.target, svc = tiState.cur;
  var f = t.getAttribute && t.getAttribute('data-tif');
  var ck = !f && t.getAttribute && t.getAttribute('data-ticombo');
  if (ck) { if (tiState.combo && tiState.combo.k === ck) { tiState.combo.q = t.value; tiState.combo.hi = 0; tiRenderCombo(); } return; }
  if (f && svc) {
    if (f === 'date' && t.value === '__free') { tiState.dateFree = true; tiRenderDateField(); return; }
    if (f === 'pk') svc.pk = t.checked;
    else svc[f] = t.value;
    if (f === 'date') tiTakeSchedule(svc);
    if (tiState.combo && tiState.combo.k === f) { tiState.combo.q = t.value; tiState.combo.hi = 0; tiRenderCombo(); }
    var vp = /^(kp|ba|of)(Book|Ch|Vs)$/.exec(f);
    if (vp) tiVerseChanged(vp[1]);
    tiRenderDynamic();
    tiQueueSave();
    return;
  }
  var tt = t.getAttribute && t.getAttribute('data-tit');
  if (tt && svc) {
    var texts = tiTexts(svc);
    texts[tt] = t.value;
    var tp = /^(kp|ba|of)Text$/.exec(tt);
    if (tp) { texts[tp[1] + 'TextAuto'] = false; if (!texts[tp[1] + 'TextRef']) texts[tp[1] + 'TextRef'] = tiRef(svc, tp[1]); tiRenderVerse(tp[1]); }
    tiRenderAside();
    tiQueueSave();
    return;
  }
  var lb = t.getAttribute && t.getAttribute('data-tilib');
  if (lb === 'q') { tiState.lib.q = t.value; tiState.lib.limit = 80; tiRenderLibraryList(); return; }
  if (lb === 'sort') { tiState.lib.sort = t.value; tiState.lib.limit = 80; tiRenderLibraryList(); return; }
  var p = t.getAttribute && t.getAttribute('data-tipk');
  if (p === 'q') { tiState.picker.q = t.value; tiRenderPickerList(); tiOnlineSearchSoon(); return; }
  if (p === 'lyric') { tiState.picker.lyrics[tiState.picker.sel + '|' + t.getAttribute('data-v')] = t.value; return; }
  var sf = t.getAttribute && t.getAttribute('data-tisf');
  if (sf) {
    var i = t.getAttribute('data-i');
    if (i != null) tiState.songForm.sections[Number(i)][sf] = t.value;
    else tiState.songForm[sf] = t.value;
    return;
  }
  var sel = t.getAttribute && t.getAttribute('data-tisel');
  if (sel === 'monthF') { tiState.monthF = t.value; tiRender(); }
}

function tiOnKey(e) {
  var pk = tiState.picker;
  if (tiState.dialog) {
    if (e.key === 'Escape') { e.preventDefault(); tiCloseDialog(false); }
    if (e.key === 'Enter' && e.target.id !== 'tiDialogOk') { e.preventDefault(); tiCloseDialog(true); }
    return;
  }
  var ck = e.target.getAttribute && e.target.getAttribute('data-ticombo');
  if (ck) { tiComboKey(e, ck); return; }
  if (e.key === 'Escape') {
    if (tiState.songForm) { tiState.songForm = null; tiRenderModal(); return; }
    if (pk) { tiState.picker = null; tiRenderModal(); return; }
    if (tiState.screen === 'library' && tiState.lib.sel) { tiState.lib.sel = null; tiState.lib.merge = null; tiRenderLibraryList(); tiRenderLibPanel(); return; }
  }
  if (!pk || tiState.songForm || e.target.id !== 'tiPkQ') return;
  if (e.key === 'Enter') { e.preventDefault(); tiConfirmPick(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  var ids = tiPickerMatches().results.map(function (s) { return s.id; });
  if (!ids.length) return;
  var i = ids.indexOf(pk.sel);
  tiSelectSong(ids[e.key === 'ArrowDown' ? Math.min(i + 1, ids.length - 1) : Math.max(i - 1, 0)]);
  var row = document.getElementById('tiPkRow-' + pk.sel);
  if (row) row.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', tiOnClick);
document.addEventListener('input', tiOnInput);
document.addEventListener('keydown', tiOnKey);
document.addEventListener('mousedown', tiOnMouseDown);
document.addEventListener('focusin', function (e) { var k = e.target.getAttribute && e.target.getAttribute('data-ticombo'); if (k) tiComboOpen(k); });
document.addEventListener('focusout', function (e) { if (e.target.getAttribute && e.target.getAttribute('data-ticombo')) tiComboClose(); });
document.addEventListener('dragstart', function (e) {
  var el = e.target.closest && e.target.closest('[data-ti-seq]');
  if (!el || !tiState.picker) return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', el.getAttribute('data-ti-seq'));
  tiState.picker.dragI = Number(el.getAttribute('data-ti-seq'));
  el.style.opacity = 0.4;
});
document.addEventListener('dragover', function (e) {
  if (e.target.closest && e.target.closest('[data-ti-seq]')) e.preventDefault();
});
document.addEventListener('drop', function (e) {
  var el = e.target.closest && e.target.closest('[data-ti-seq]');
  var pk = tiState.picker;
  if (!el || !pk) return;
  e.preventDefault();
  var to = Number(el.getAttribute('data-ti-seq'));
  if (pk.dragI == null || pk.dragI === to) { pk.dragI = null; tiRenderPickerParts(); return; }
  tiSeqMove(pk.dragI, to);
});
document.addEventListener('dragend', function () {
  if (tiState.picker && tiState.picker.dragI != null) { tiState.picker.dragI = null; tiRenderPickerParts(); }
});
</script>
