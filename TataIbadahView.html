<script>
/* ===================== Tata Ibadah ===================== */

var TI_ST_COLORS = { Draft: ['#F3E9CE', '#8a7952'], Review: ['#CFE4F7', '#31536f'], Published: ['#24401F', '#ffffff'] };
var TI_RED = '#B5483A', TI_AMBER = '#D08A1E', TI_GREEN = '#24401F';
var TI_MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var TI_MON = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var TI_DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var TI_HYMNALS = ['Semua', 'KK', 'KJ', 'NKB', 'PKJ', 'Kontemporer'];
var TI_BOOKS = ['Kejadian','Keluaran','Imamat','Bilangan','Ulangan','Yosua','Hakim-hakim','Rut','1 Samuel','2 Samuel','1 Raja-raja','2 Raja-raja','1 Tawarikh','2 Tawarikh','Ezra','Nehemia','Ester','Ayub','Mazmur','Amsal','Pengkhotbah','Kidung Agung','Yesaya','Yeremia','Ratapan','Yehezkiel','Daniel','Hosea','Yoel','Amos','Obaja','Yunus','Mikha','Nahum','Habakuk','Zefanya','Hagai','Zakharia','Maleakhi','Matius','Markus','Lukas','Yohanes','Kisah Para Rasul','Roma','1 Korintus','2 Korintus','Galatia','Efesus','Filipi','Kolose','1 Tesalonika','2 Tesalonika','1 Timotius','2 Timotius','Titus','Filemon','Ibrani','Yakobus','1 Petrus','2 Petrus','1 Yohanes','2 Yohanes','3 Yohanes','Yudas','Wahyu'];
var TI_VS_RE = /^\d+(\s*[-–]\s*\d+)?(\s*,\s*\d+(\s*[-–]\s*\d+)?)*$/;
var TI_PLACEHOLDER = /(x\s*:\s*x-x|\bTEMA\b|\.{4,}|…{2,}|lirik lagu)/i;
var TI_RECENT_WEEKS = 4;

function tiB(k, n, title, kind, posture, extra) {
  var b = { k: k, n: n, title: title, kind: kind, posture: posture };
  for (var key in (extra || {})) b[key] = extra[key];
  return b;
}

/* Liturgy template: fixed blocks are read-only, the rest are filled per service. */
var TI_TPL = [
  { name: 'Persiapan', blocks: [
    tiB('b0', 0, 'Sampul', 'auto', '—'),
    tiB('b1', 1, 'Persiapan · mulai 09.40', 'fixed', '—')
  ]},
  { name: 'Umat Berhimpun', blocks: [
    tiB('b2', 2, 'Panggilan beribadah', 'song', 'Berdiri', { field: 'call', fieldLabel: 'Kata liturgos' }),
    tiB('b3', 3, 'Votum dan salam', 'fixed', 'Berdiri'),
    tiB('b4', 4, 'Kata pembuka', 'auto', 'Duduk'),
    tiB('b5', 5, 'Nyanyian umat 1', 'song', 'Duduk'),
    tiB('b6', 6, 'Pengakuan dosa', 'text', 'Duduk', { field: 'confession', fieldLabel: 'Narasi liturgos' }),
    tiB('b7', 7, 'Nyanyian umat 2 · pengakuan dosa', 'song', 'Duduk'),
    tiB('b8', 8, 'Berita anugerah', 'variant', 'Berdiri', { verse: true, opts: [['A', 'Formula A'], ['B', 'Formula B']], notes: { A: '“Demikianlah berita anugerah dari Tuhan” / “Syukur kepada Allah”', B: '“Di dalam Kristus, engkau telah diampuni” + Damai Kristus' } }),
    tiB('b9', 9, 'Salam damai', 'variant', 'Berdiri', { opts: [['1×', 'Lagu 1×'], ['2×', 'Lagu 2×'], ['3×', 'Lagu 3×']], notes: { '1×': 'Lagu pengiring dinyanyikan 1 kali', '2×': 'Lagu pengiring dinyanyikan 2 kali', '3×': 'Lagu pengiring dinyanyikan 3 kali' } }),
    tiB('b10', 10, 'Nyanyian umat 3', 'song', 'Berdiri → duduk')
  ]},
  { name: 'Pelayanan Firman', blocks: [
    tiB('b11', 11, 'Doa, pembacaan Alkitab, Haleluya', 'variant', 'Duduk', { reading: true, opts: [['767h', 'KK 767h'], ['767F', 'KK 767F']], notes: { '767h': 'Notasi Haleluya KK 767h disisipkan sebagai gambar', '767F': 'Notasi Haleluya KK 767F disisipkan sebagai gambar' } }),
    tiB('b12', 12, 'Khotbah', 'auto', 'Duduk'),
    tiB('b13', 13, 'Saat hening', 'fixed', 'Duduk'),
    tiB('b14', 14, 'Pengakuan Iman Rasuli', 'fixed', 'Berdiri'),
    tiB('b15', 15, 'Persiapan Perjamuan Kudus (Sensura Morum)', 'optional', 'Duduk'),
    tiB('b16', 16, 'Doa syafaat', 'fixed', 'Duduk')
  ]},
  { name: 'Persembahan', blocks: [
    tiB('b17', 17, 'Nas persembahan · Mazmur 116:12-14', 'text', 'Duduk', { field: 'offering', fieldLabel: 'Ajakan persembahan (Pnt)' }),
    tiB('b18', 18, 'Nyanyian persembahan', 'song', 'Duduk → berdiri', { cue: 'Kantong persembahan diedarkan · QR persembahan tampil di layar' }),
    tiB('b19', 19, 'Doa persembahan dan kesimpulan khotbah', 'fixed', 'Berdiri')
  ]},
  { name: 'Pengutusan', blocks: [
    tiB('b20', 20, 'Nyanyian pengutusan', 'song', 'Berdiri'),
    tiB('b21', 21, 'Pengutusan dan berkat', 'variant', 'Berdiri', { opts: [['768b', 'KK 768b'], ['ongko', 'Haleluya Amin (Ongkowidjaja)']], notes: { '768b': 'Ordinarium KK 768b setelah berkat', ongko: 'Ordinarium Haleluya Amin (Ongkowidjaja) setelah berkat' } }),
    tiB('b22', 22, 'Nyanyian penutup', 'song', 'Berdiri', { optional: true }),
    tiB('b23', 23, 'Penutup · saat teduh dan pengumuman', 'fixed', 'Duduk')
  ]}
];
var TI_BLOCKS = [].concat.apply([], TI_TPL.map(function (s) { return s.blocks; }));
var TI_BLOCK = {};
TI_BLOCKS.forEach(function (b) { TI_BLOCK[b.k] = b; });
var TI_VARIANT_KEYS = TI_BLOCKS.filter(function (b) { return b.kind === 'variant'; }).map(function (b) { return b.k; });
var TI_VARIANT_DEFAULT = { b8: 'A', b9: '1×', b11: '767h', b21: '768b' };

var tiState = {
  loaded: false, loading: false, loadError: '',
  services: [], songs: [], songById: {}, schedule: [],
  screen: 'list', monthF: 'all', statusF: 'Semua',
  cur: null, open: {}, flash: null, lastJump: null,
  saveLabel: '', saveError: false, saving: false, pending: null,
  picker: null, songForm: null,
  dl: { busy: '', error: '' },
  liturgy: { fixed: {}, defaults: {}, offeringVerse: { ref: '', text: '' } },
  conflict: null, baFetch: { busy: false, error: '' },
  lib: { q: '', h: 'Semua', merge: null, mergeTo: '' }
};

/* ---------- helpers ---------- */

function tiN(n) { return String(n).padStart(2, '0'); }
function tiAddDays(s, n) { return iso(shiftDays(fromIso(s), n)); }
function tiIsSunday(s) { var d = fromIso(s); return !!d && !isNaN(d) && d.getDay() === 0; }
function tiShort(s) { var d = fromIso(s); return d && !isNaN(d) ? d.getDate() + ' ' + TI_MON[d.getMonth()] : ''; }
function tiDateLong(s) {
  var d = fromIso(s);
  if (!d || isNaN(d)) return 'Tanggal belum diisi';
  return TI_DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + TI_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function tiSongCode(s) { return s && s.hymnal ? s.hymnal + ' ' + s.number : ''; }
function tiTheme(svc) { return (svc.series ? svc.series + ': ' : '') + (svc.sub || '…'); }
function tiBa(svc) { return svc.baBook && svc.baCh && TI_VS_RE.test(String(svc.baVs || '').trim()) ? svc.baBook + ' ' + svc.baCh + ':' + String(svc.baVs).trim() : ''; }
function tiIsOn(svc, b) { return (b.optional || b.kind === 'optional') ? !!svc.enabled[b.k] : true; }
function tiActiveSongBlocks(svc) { return TI_BLOCKS.filter(function (b) { return b.kind === 'song' && tiIsOn(svc, b); }); }
function tiByDate(date, exceptId) { return tiState.services.filter(function (s) { return s.date === date && s !== exceptId; })[0]; }
function tiSortedServices() { return tiState.services.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }); }
function tiPrevService(svc) {
  return tiSortedServices().filter(function (s) { return s !== svc && s.date && s.date < svc.date; })[0];
}
/* Tags that are never the Sunday service itself (same rule as pickScheduleEvent_ on the server). */
var TI_SCHEDULE_SKIP = ['Meeting', 'Fellowship', 'OFF'];

function tiScheduleOn(date) {
  var usable = tiState.schedule.filter(function (e) { return e.date === date && TI_SCHEDULE_SKIP.indexOf(e.tag) === -1; });
  return usable.filter(function (e) { return e.tag === 'Service'; })[0] || usable[0];
}

/* The service's weekly liturgist texts, with missing ones filled from the defaults. */
function tiTexts(svc) {
  var d = tiState.liturgy.defaults || {};
  svc.texts = svc.texts || {};
  ['call', 'confession', 'offering'].forEach(function (k) { if (svc.texts[k] == null) svc.texts[k] = d[k] || ''; });
  ['reading', 'baText', 'baTextRef'].forEach(function (k) { if (svc.texts[k] == null) svc.texts[k] = ''; });
  return svc.texts;
}

/* LiturgiText.js marks (*bold* _italic_ ~blue italic~ ^blue^) as HTML. */
function tiMarksHtml(text) {
  var st = {}, out = '', keys = { '*': 'b', '_': 'i', '~': 'bi', '^': 'blue' };
  var open = function () {
    var css = (st.b ? 'font-weight:700;' : '') + (st.i || st.bi ? 'font-style:italic;' : '') + (st.bi || st.blue ? 'color:#31536f;' : '');
    return css ? '<span style="' + css + '">' : '<span>';
  };
  out = open();
  String(text).split('').forEach(function (c) {
    if (keys[c]) { st[keys[c]] = !st[keys[c]]; out += '</span>' + open(); } else out += esc(c);
  });
  return out + '</span>';
}

/* A fixed block's wording, as the booklet prints it. */
function tiFixedHtml(k) {
  var line = 'style="margin:0 0 4px;"';
  return (tiState.liturgy.fixed[k] || []).map(function (e) {
    switch (e[0]) {
      case 'say': return '<p ' + line + '><span style="display:inline-block; min-width:34px; font-weight:700;">' + esc(e[1]) + '</span>' + (e[1] ? ': ' : '') + tiMarksHtml(e[2]) + '</p>';
      case 'note': case 'p': return '<p style="margin:0 0 4px; text-align:center; font-style:italic;">' + tiMarksHtml(e[1]) + '</p>';
      case 'line': return '<p ' + line + '>' + tiMarksHtml(e[1]) + '</p>';
      case 'steps': return e[1].map(function (x, i) { return '<p ' + line + '>' + (i + 1) + '. ' + tiMarksHtml(x) + '</p>'; }).join('');
      case 'image': return '<p style="margin:0 0 4px; text-align:center; color:#9a8763;">[notasi ' + esc(e[1]) + ']</p>';
      case 'posture': return '<p style="margin:0 0 4px; text-align:right; font-style:italic;">(' + esc(e[1]) + ')</p>';
    }
    return '';
  }).join('');
}

/* Runs fn once any pending autosave has reached the sheet. */
function tiAfterSave(fn) {
  if (tiState.pending) tiFlushSave();
  (function go() {
    if (tiState.saving || tiState.pending) { setTimeout(go, 300); return; }
    fn();
  })();
}
function tiArr(svc, k) { var s = svc.arr[k]; return s ? s.split(' → ') : []; }

/* Most recent other service before svc that used songId: { date, weeks } or null. */
function tiSongUsage(songId, svc) {
  var hit = null;
  tiState.services.forEach(function (s) {
    if (s === svc || !s.date || s.date >= svc.date) return;
    var used = TI_BLOCKS.some(function (b) { return b.kind === 'song' && s.slots[b.k] === songId && tiIsOn(s, b); });
    if (used && (!hit || s.date > hit.date)) hit = { date: s.date };
  });
  if (hit) hit.weeks = Math.max(1, Math.round((fromIso(svc.date) - fromIso(hit.date)) / (7 * 86400000)));
  return hit;
}

/* Church-year label for a date (Gregorian Easter via the anonymous algorithm). */
function tiEaster(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  var month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function tiSeason(s) {
  var d = fromIso(s);
  if (!d || isNaN(d)) return '';
  var y = d.getFullYear(), t = d.getTime();
  var easter = tiEaster(y).getTime(), day = 86400000;
  var ashWed = easter - 46 * day, pentecost = easter + 49 * day;
  var dec24 = new Date(y, 11, 24);
  var advent1 = shiftDays(dec24, -dec24.getDay() - 21).getTime();
  var christKing = advent1 - 7 * day;
  if (t >= new Date(y, 11, 25).getTime() || t < new Date(y, 0, 6).getTime()) return 'Masa Natal';
  if (t >= advent1) return 'Masa Adven';
  if (t < ashWed) return 'Masa Epifania';
  if (t < easter) return 'Masa Prapaskah';
  if (t === easter) return 'Minggu Paskah';
  if (t < pentecost) return 'Masa Paskah';
  if (t === pentecost) return 'Minggu Pentakosta';
  if (t === christKing) return 'Minggu Kristus Raja';
  return d.getMonth() === 9 ? 'Bulan Keluarga' : 'Masa Biasa';
}

/* ---------- checks ---------- */

function tiChecks(svc) {
  var reds = [], ambers = [], greens = [];
  var req = [['date', 'Tanggal', svc.date], ['series', 'Seri', svc.series], ['sub', 'Sub-tema', svc.sub], ['pf', 'Pelayan Firman', svc.pf], ['kp', 'Nas kata pembuka', svc.kp], ['baBook', 'Nas berita anugerah', tiBa(svc)]]
    .filter(function (r) { return !String(r[2] || '').trim(); });
  if (req.length) reds.push({ text: 'Kolom wajib kosong', sub: req.map(function (r) { return r[1]; }).join(', '), to: 'tiF-' + req[0][0] });
  else greens.push({ text: 'Kolom wajib lengkap' });

  if (tiIsSunday(svc.date)) greens.push({ text: 'Tanggal hari Minggu' });
  else if (svc.date) reds.push({ text: 'Tanggal bukan hari Minggu', to: 'tiF-date' });

  var songBlocks = tiActiveSongBlocks(svc);
  var empty = songBlocks.filter(function (b) { return !svc.slots[b.k]; });
  empty.forEach(function (b) { reds.push({ text: 'Slot lagu kosong', sub: tiN(b.n) + ' · ' + b.title, to: 'tiBlk-' + b.k }); });
  if (!empty.length) greens.push({ text: 'Semua slot lagu terisi' });

  var ph = [['series', svc.series], ['sub', svc.sub], ['kp', svc.kp], ['season', svc.season]].filter(function (f) { return TI_PLACEHOLDER.test(String(f[1] || '')); });
  if (ph.length) reds.push({ text: 'Teks placeholder tertinggal', sub: ph.map(function (f) { return '“' + f[1] + '”'; }).join(', '), to: 'tiF-' + ph[0][0] });
  else greens.push({ text: 'Tanpa teks placeholder' });

  var ids = songBlocks.map(function (b) { return svc.slots[b.k]; }).filter(Boolean);
  var dups = ids.filter(function (x, i) { return ids.indexOf(x) !== i; }).filter(function (x, i, a) { return a.indexOf(x) === i; });
  dups.forEach(function (id) {
    var last = songBlocks.filter(function (b) { return svc.slots[b.k] === id; }).pop();
    reds.push({ text: 'Lagu dipakai dua kali', sub: (tiState.songById[id] || {}).title || id, to: 'tiBlk-' + last.k });
  });
  if (!dups.length) greens.push({ text: 'Tidak ada lagu ganda' });

  songBlocks.forEach(function (b) {
    var song = tiState.songById[svc.slots[b.k]];
    var u = song && tiSongUsage(song.id, svc);
    if (u && u.weeks <= TI_RECENT_WEEKS) ambers.push({ text: song.title + ' baru dipakai', sub: tiShort(u.date) + ' · ' + b.title, to: 'tiBlk-' + b.k });
  });
  songBlocks.forEach(function (b) {
    if (svc.slots[b.k] && !svc.arr[b.k]) ambers.push({ text: 'Urutan lagu belum diisi', sub: tiN(b.n) + ' · ' + b.title, to: 'tiBlk-' + b.k });
  });

  var next = svc.date ? tiByDate(tiAddDays(svc.date, 7)) : null;
  if (next && next.pk) {
    if (svc.enabled.b15) greens.push({ text: 'Sensura Morum sesuai kalender', sub: 'Perjamuan Kudus pada ' + tiShort(next.date) });
    else ambers.push({ text: 'Sensura Morum mati', sub: 'Minggu depan Perjamuan Kudus (' + tiShort(next.date) + ')', to: 'tiBlk-b15' });
  }

  var tx = tiTexts(svc);
  if (!tx.call.trim() || /\.\.\.\s*$/.test(tx.call)) ambers.push({ text: 'Kata liturgos panggilan beribadah belum diisi', to: 'tiF-call' });
  if (!tx.reading.trim()) ambers.push({ text: 'Bacaan Alkitab belum diisi', to: 'tiF-reading' });
  if (tiBa(svc) && !tx.baText.trim()) ambers.push({ text: 'Teks berita anugerah kosong', sub: tiBa(svc), to: 'tiF-baText' });

  var prev = tiPrevService(svc);
  if (prev && prev.texts && prev.texts.confession && prev.texts.confession === tx.confession) {
    ambers.push({ text: 'Narasi pengakuan dosa sama dengan minggu lalu', sub: 'Pastikan disengaja', to: 'tiF-confession' });
  }
  if (prev) {
    TI_VARIANT_KEYS.forEach(function (k) {
      if (prev.variants[k] && svc.variants[k] !== prev.variants[k]) ambers.push({ text: 'Variasi berbeda dari minggu lalu', sub: TI_BLOCK[k].title + ': pastikan disengaja', to: 'tiBlk-' + k });
    });
  }
  return { reds: reds, ambers: ambers, greens: greens };
}

function tiTodos(svc) {
  var t = [];
  [['date', 'Tanggal'], ['series', 'Seri'], ['sub', 'Sub-tema'], ['pf', 'Pelayan Firman'], ['kp', 'Nas kata pembuka']].forEach(function (f) {
    if (!String(svc[f[0]] || '').trim() || (f[0] === 'date' && !tiIsSunday(svc.date))) t.push({ id: 'tiF-' + f[0], label: f[1] });
  });
  TI_BLOCKS.forEach(function (b) {
    if (b.k === 'b2' && /\.\.\.\s*$|^\s*$/.test(tiTexts(svc).call)) t.push({ id: 'tiF-call', label: 'Kata liturgos' });
    if (b.k === 'b8' && !tiBa(svc)) t.push({ id: 'tiF-baBook', label: 'Nas berita anugerah' });
    if (b.k === 'b11' && !tiTexts(svc).reading.trim()) t.push({ id: 'tiF-reading', label: 'Bacaan Alkitab' });
    if (b.kind === 'song' && tiIsOn(svc, b)) {
      if (!svc.slots[b.k]) t.push({ id: 'tiBlk-' + b.k, label: tiN(b.n) + ' · ' + b.title });
      else if (!svc.arr[b.k]) t.push({ id: 'tiBlk-' + b.k, label: 'Urutan · ' + b.title });
    }
  });
  return t;
}

/* ---------- data ---------- */

function tiEnter() {
  if (!tiState.loaded && !tiState.loading) tiLoad();
  tiRender();
}

function tiLoad() {
  tiState.loading = true;
  google.script.run
    .withSuccessHandler(function (data) {
      tiState.loading = false;
      tiState.loaded = true;
      tiState.services = data.services || [];
      tiState.schedule = data.schedule || [];
      if (data.liturgy) tiState.liturgy = data.liturgy;
      tiSetSongs(data.songs || []);
      tiRender();
    })
    .withFailureHandler(function (err) {
      tiState.loading = false;
      tiState.loadError = err && err.message ? err.message : String(err);
      tiRender();
    })
    .getTataIbadahData();
}

function tiSetSongs(songs) {
  tiState.songs = songs;
  tiState.songById = {};
  songs.forEach(function (s) { tiState.songById[s.id] = s; });
}

function tiQueueSave() {
  tiState.pending = tiState.cur;
  tiState.saveLabel = 'Menyimpan…';
  tiState.saveError = false;
  tiRenderSaveLabel();
  clearTimeout(tiState.saveTimer);
  tiState.saveTimer = setTimeout(tiFlushSave, 700);
}

/* Saves the service waiting in tiState.pending; a save requested while one is in flight runs when it returns. */
function tiFlushSave() {
  clearTimeout(tiState.saveTimer);
  var svc = tiState.pending;
  if (!svc || tiState.saving) return;
  if (tiState.conflict && tiState.conflict.svc === svc && !svc.forceSave) { tiState.pending = null; return; }
  tiState.pending = null;
  tiState.saving = true;
  var payload = {
    id: svc.id, date: svc.date, season: svc.season, series: svc.series, sub: svc.sub, pf: svc.pf, kp: svc.kp,
    baBook: svc.baBook, baCh: svc.baCh, baVs: String(svc.baVs || '').trim(), pk: svc.pk, status: svc.status,
    slots: svc.slots, arr: svc.arr, variants: svc.variants, enabled: svc.enabled, lyrics: svc.lyrics,
    texts: tiTexts(svc), baseUpdatedAt: svc.updatedAt || '', force: !!svc.forceSave
  };
  google.script.run
    .withSuccessHandler(function (res) {
      tiState.saving = false;
      if (res.success) {
        svc.id = res.id;
        svc.updatedAt = res.updatedAt;
        svc.forceSave = false;
        tiState.saveLabel = 'Tersimpan otomatis · ' + res.savedAt;
        tiState.saveError = false;
      } else if (res.conflict) {
        tiState.conflict = { svc: svc, latest: res.latest };
        tiState.saveLabel = 'Belum tersimpan: ada versi lebih baru';
        tiState.saveError = true;
        tiRenderBanner();
      } else {
        tiState.saveLabel = res.message;
        tiState.saveError = true;
      }
      tiRenderSaveLabel();
      if (tiState.pending) tiFlushSave();
    })
    .withFailureHandler(function (err) {
      tiState.saving = false;
      tiState.saveLabel = 'Gagal menyimpan: ' + (err && err.message ? err.message : err);
      tiState.saveError = true;
      tiRenderSaveLabel();
    })
    .saveTataIbadah(payload);
}

/* ---------- navigation inside Tata Ibadah ---------- */

function tiNextEmptySunday() {
  var d = startOfToday();
  d = shiftDays(d, (7 - d.getDay()) % 7);
  for (var i = 0; i < 104; i++) {
    var s = iso(shiftDays(d, i * 7));
    if (!tiByDate(s)) return s;
  }
  return iso(d);
}

function tiNewService(date, duplicate) {
  date = date || tiNextEmptySunday();
  var probe = { date: date };
  var prev = tiPrevService(probe) || tiSortedServices()[0];
  var sched = tiScheduleOn(date);
  var next = tiByDate(tiAddDays(date, 7));
  var svc = {
    id: null, date: date, season: tiSeason(date), series: prev ? prev.series : '', sub: '', pf: prev ? prev.pf : '', kp: '',
    baBook: '', baCh: '', baVs: '', pk: false, status: 'Draft',
    slots: {}, arr: {}, variants: {}, enabled: { b15: !!(next && next.pk), b22: false }, lyrics: {}, texts: {}
  };
  var carry = (prev && prev.texts) || {};
  ['call', 'confession', 'offering'].forEach(function (k) { if (carry[k] != null) svc.texts[k] = carry[k]; });
  tiTexts(svc);
  TI_VARIANT_KEYS.forEach(function (k) { svc.variants[k] = (prev && prev.variants[k]) || TI_VARIANT_DEFAULT[k]; });
  if (duplicate && prev) {
    svc.slots = JSON.parse(JSON.stringify(prev.slots));
    svc.arr = JSON.parse(JSON.stringify(prev.arr));
    svc.lyrics = JSON.parse(JSON.stringify(prev.lyrics || {}));
    svc.enabled.b22 = !!prev.enabled.b22;
  }
  if (sched) tiApplySchedule(svc, sched);
  tiState.services.push(svc);
  tiOpenService(svc);
  tiState.pending = svc;
  tiFlushSave();
}

function tiApplySchedule(svc, sched) {
  var theme = String(sched.theme || '').trim();
  var i = theme.indexOf(':');
  if (i !== -1) { svc.series = theme.slice(0, i).trim(); svc.sub = theme.slice(i + 1).trim(); }
  else if (theme) { svc.series = ''; svc.sub = theme; }
  if (sched.pastor) svc.pf = sched.pastor;
}

function tiOpenService(svc) {
  tiTexts(svc);
  tiState.cur = svc;
  tiState.conflict = null;
  tiState.screen = 'builder';
  tiState.open = {};
  tiState.lastJump = null;
  tiState.saveLabel = svc.id ? 'Tersimpan' : '';
  tiState.saveError = false;
  tiState.dl.error = '';
  tiRender();
  window.scrollTo(0, 0);
}

function tiGoList() {
  if (tiState.pending) tiFlushSave();
  tiState.screen = 'list';
  tiState.cur = null;
  tiRender();
  window.scrollTo(0, 0);
}

function tiDeleteCurrent() {
  var svc = tiState.cur;
  if (!svc || !window.confirm('Hapus tata ibadah ' + tiDateLong(svc.date) + '? Ini tidak bisa dibatalkan.')) return;
  if (tiState.pending === svc) { clearTimeout(tiState.saveTimer); tiState.pending = null; }
  var drop = function () {
    tiState.services = tiState.services.filter(function (s) { return s !== svc; });
    tiState.cur = null;
    tiState.screen = 'list';
    tiRender();
  };
  if (!svc.id) { drop(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { flash(res.message); return; }
      drop();
      flash(res.message);
    })
    .withFailureHandler(function (err) { flash('Gagal menghapus: ' + (err && err.message ? err.message : err)); })
    .deleteTataIbadah(svc.id);
}

function tiJumpTo(id) {
  var el = document.getElementById(id);
  if (!el) return;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 110, behavior: 'smooth' });
  if (el.matches('input,select')) setTimeout(function () { el.focus({ preventScroll: true }); }, 350);
  tiState.lastJump = id;
  var card = el.querySelector('[data-ring]') || el;
  card.animate([{ boxShadow: '0 0 0 4px #fbd9bc' }, { boxShadow: '0 0 0 4px rgba(251,217,188,0)' }], { duration: 1600, easing: 'ease-out' });
  tiRenderAside();
}

        '<span style="font-size:14.5px; font-weight:700; color:#3a2a15;">' + esc(b.title) + '</span>' +

  if (isSong && on && song) {
    var u = tiSongUsage(song.id, svc);
    var recent = u && u.weeks <= TI_RECENT_WEEKS;
    var arr = svc.arr[b.k] || '';
    h += '<div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; ' + pad + '">' +
      '<div style="flex:1 1 260px; min-width:0; display:flex; flex-direction:column; gap:4px;">' +
        '<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">' +
          (tiSongCode(song) ? '<span style="font-size:12px; font-weight:700; background:#F3E9CE; color:#6E2621; padding:2px 7px; border-radius:6px;">' + esc(tiSongCode(song)) + '</span>' : '') +
          '<span style="font-family:\'Bricolage Grotesque\',sans-serif; font-size:17px; font-weight:700; color:#3a2a15;">' + esc(song.title) + '</span>' +
          (recent ? '<span class="ti-pill" style="background:#fdf0e6; color:#a3420e; font-weight:600;">Dipakai ' + esc(tiShort(u.date)) + '</span>' : '') +
        '</div>' +
        (song.credits ? '<span style="font-size:12.5px; color:#8a7952;">' + esc(song.credits) + '</span>' : '') +
        '<div style="display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin-top:2px;">' +
          (arr ? '<span style="font-size:12.5px; font-weight:600; color:#6b5a38;">' + esc(arr) + '</span>' : '<span style="font-size:12.5px; font-weight:600; color:#a3420e;">Urutan belum diisi</span>') +
          '<span data-ti="pick" data-k="' + b.k + '" class="ti-link">Ubah urutan</span>' +
        '</div>' +
        (b.cue ? '<span style="font-size:13px; font-style:italic; font-weight:600; color:#31536f; margin-top:2px;">' + esc(b.cue) + '</span>' : '') +
      '</div>' +
      '<button data-ti="pick" data-k="' + b.k + '" class="ti-btn-outline">Ganti lagu</button>' +
    '</div>';
  } else if (isSong && on) {
    h += '<div style="' + pad + '"><button data-ti="pick" data-k="' + b.k + '" style="width:100%; border:1px dashed #E85511; background:#fdf0e6; color:#a3420e; font-size:13.5px; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; text-align:left;">+ Pilih lagu</button></div>';
  } else if (isSong) {
    h += '<span style="' + pad + ' font-size:13px; color:#9a8763; font-weight:600;">Tidak dipakai minggu ini</span>';
  }

  if (b.kind === 'variant') {
    h += '<div style="' + pad + ' display:flex; flex-direction:column; gap:6px; align-items:flex-start;">' +
      '<div class="ti-seg">' + b.opts.map(function (o) {
        return '<button data-ti="variant" data-k="' + b.k + '" data-v="' + esc(o[0]) + '" class="' + (svc.variants[b.k] === o[0] ? 'on' : '') + '">' + esc(o[1]) + '</button>';
      }).join('') + '</div>' +
      '<span style="font-size:12.5px; color:#8a7952;">' + esc(b.notes[svc.variants[b.k]] || '') + '</span>' +
    '</div>';
  }

  if (b.k === 'b17') {
    var ov = tiState.liturgy.offeringVerse || {};
    h += '<span style="' + pad + ' font-size:12.5px; color:#8a7952; line-height:1.5;">Dicetak setelah ajakan: <b>Dasar Persembahan kita adalah ' + esc(ov.ref) + '</b> <i>(' + esc(ov.text) + ')</i></span>';
  }

  if (b.kind === 'auto' || b.kind === 'optional') {
    var theme = tiTheme(svc), main = theme, note = '';
    if (b.k === 'b0') note = tiDateLong(svc.date) + ' · ' + (svc.season || 'masa belum diisi') + ' · ' + (svc.pf || 'PF belum dipilih');
    if (b.k === 'b4') note = 'Nas: ' + (svc.kp || 'belum diisi') + ' · diambil dari detail ibadah';
    if (b.k === 'b12') note = 'Judul khotbah otomatis dari tema · ' + (svc.pf || 'PF belum dipilih');
    if (b.k === 'b15') {
      var nextPk = svc.date ? tiByDate(tiAddDays(svc.date, 7)) : null;
      nextPk = nextPk && nextPk.pk ? nextPk : null;
      main = on ? 'Dipakai minggu ini' : 'Tidak dipakai minggu ini';
      note = nextPk ? 'Minggu depan (' + tiShort(nextPk.date) + ') Perjamuan Kudus' : 'Nyalakan bila Minggu depan Perjamuan Kudus';
    }
    h += '<div style="' + pad + ' display:flex; flex-direction:column; gap:2px;">' +
      '<span style="font-family:\'Bricolage Grotesque\',sans-serif; font-size:16px; font-weight:700; color:' + (on ? '#3a2a15' : '#9a8763') + ';">' + esc(main) + '</span>' +
      '<span style="font-size:12px; color:#8a7952;">' + esc(note) + '</span>' +
    '</div>';
  }

  var inputs = '';
  var area = function (key, label, rows, placeholder) {
    return '<label class="ti-label"><span>' + label + '</span><textarea id="tiF-' + key + '" data-tit="' + key + '" rows="' + rows + '" placeholder="' + esc(placeholder || '') + '" class="ti-field" style="resize:vertical; line-height:1.5; font-family:inherit; font-size:14px;">' + esc(tx[key]) + '</textarea></label>';
  };
  if (b.field) inputs += area(b.field, b.fieldLabel, b.field === 'call' ? 2 : 5, b.field === 'call' ? 'Ajakan singkat liturgos sebelum lagu' : '');
  if (b.reading) {
    inputs += '<label class="ti-label"><span>Bacaan Alkitab (dibacakan PF)</span><input id="tiF-reading" data-tit="reading" value="' + esc(tx.reading) + '" placeholder="mis. Roma 12:1-8" class="ti-field" style="padding:9px 12px; font-size:14px;"></label>';
  }
  if (b.verse) {
    inputs += '<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">' +
        '<span style="font-size:12.5px; font-weight:700; color:#8a7952;">Nas</span>' +
        '<select id="tiF-baBook" data-tif="baBook" class="ti-field" style="flex:1 1 170px; width:auto; padding:9px 12px; font-size:14px;">' +
          '<option value="">Pilih kitab</option>' + TI_BOOKS.map(function (bk) { return '<option' + (svc.baBook === bk ? ' selected' : '') + '>' + bk + '</option>'; }).join('') +
        '</select>' +
        '<input data-tif="baCh" type="number" min="1" value="' + esc(svc.baCh) + '" placeholder="Pasal" class="ti-field" style="width:84px; padding:9px 12px; font-size:14px;">' +
        '<span style="color:#8a7952; font-weight:700;">:</span>' +
        '<input data-tif="baVs" value="' + esc(svc.baVs) + '" placeholder="Ayat, mis. 1-2" class="ti-field" style="width:130px; padding:9px 12px; font-size:14px;">' +
        '<span style="font-size:11px; font-weight:700; padding:3px 7px; border:1px solid #e6d8b6; border-radius:6px; color:#8a7952;">TB</span>' +
      '</div>' +
      '<span id="tiBaMsg">' + tiBaMsgHtml() + '</span>' +
      area('baText', 'Teks ayat (dicetak di liturgi)', 3, 'Terisi otomatis dari Alkitab TB setelah nas lengkap') +
      '<span id="tiBaFetch">' + tiBaFetchHtml() + '</span>';
  }

  return {
    style: 'background:' + (on ? '#fff' : '#FEFBF2') + '; border:' + border + '; border-radius:14px; padding:12px 14px 14px;',

  };
}

function tiBlockHtml(b) {
  var p = tiBlockParts(b);
  return '<div data-ring id="tiCard-' + b.k + '" style="' + p.style + '">' +
    '<div id="tiMain-' + b.k + '" style="display:flex; flex-direction:column; gap:10px;">' + p.main + '</div>' +
    (p.inputs ? '<div style="padding-left:34px; display:flex; flex-direction:column; gap:8px; margin-top:10px;">' + p.inputs + '</div>' : '') +
  '</div>';
}

function tiBaFetchHtml() {
  var f = tiState.baFetch, svc = tiState.cur, tx = tiTexts(svc), ref = tiBa(svc);
  if (f.busy) return '<span style="font-size:12px; color:#9a8763;">Mengambil teks ' + esc(ref) + '…</span>';
  if (f.error) return '<span style="font-size:12px; font-weight:600; color:#a3420e;">' + esc(f.error) + '</span> <span data-ti="fetchBa" class="ti-link">Coba lagi</span>';
  if (!ref) return '';
  var stale = tx.baText && tx.baTextRef && tx.baTextRef !== ref;
  return '<span style="font-size:12px; color:' + (stale ? '#a3420e' : '#9a8763') + ';">' +
    (stale ? 'Teks ini untuk ' + esc(tx.baTextRef) + ', bukan ' + esc(ref) + '. ' : tx.baText ? 'Sumber: Alkitab TB (SABDA) · bisa diedit. ' : '') +
    '</span><span data-ti="fetchBa" class="ti-link">' + (tx.baText ? 'Ambil ulang teks' : 'Ambil teks') + '</span>';
}

/* Fills the Berita anugerah verse text from Alkitab TB; force replaces text the user edited. */
function tiFetchBa(force) {
  var svc = tiState.cur, ref = svc && tiBa(svc);
  if (!ref) return;
  var tx = tiTexts(svc);
  if (!force && tx.baText && (tx.baTextRef === ref || !tx.baTextAuto)) { tiRenderBaFetch(); return; }
  tiState.baFetch = { busy: true, error: '' };
  tiRenderBaFetch();
  google.script.run
    .withSuccessHandler(function (res) {
      tiState.baFetch = { busy: false, error: res.success ? '' : res.message };
      if (res.success && tiState.cur === svc && tiBa(svc) === ref) {
        tx.baText = res.text; tx.baTextRef = ref; tx.baTextAuto = true;
        var el = document.getElementById('tiF-baText');
        if (el) el.value = res.text;
        tiRenderAside();
        tiQueueSave();
      }
      tiRenderBaFetch();
    })
    .withFailureHandler(function (err) { tiState.baFetch = { busy: false, error: err && err.message ? err.message : String(err) }; tiRenderBaFetch(); })
    .fetchBibleText(svc.baBook, svc.baCh, String(svc.baVs || '').trim());
}

function tiRenderBaFetch() {
  var el = document.getElementById('tiBaFetch');
  if (el) el.innerHTML = tiBaFetchHtml();
}

/* Banner above the form: an edit conflict, or the Published lock. */
function tiRenderBanner() {
  var el = document.getElementById('tiBanner'), svc = tiState.cur;
  if (!el || !svc) return;
  var box = function (bg, bd, fg, text, buttons) {
    return '<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:' + bg + '; border:1px solid ' + bd + '; border-radius:16px; padding:14px 18px; font-size:14px;">' +
      '<span style="line-height:1.5; color:' + fg + ';">' + text + '</span><span style="display:flex; gap:8px; flex-wrap:wrap;">' + buttons + '</span></div>';
  };
  var c = tiState.conflict;
  if (c && c.svc === svc) {
    el.innerHTML = box('#fdf0e6', '#f6cfb3', '#a3420e', '<strong>Tata ibadah ini baru disimpan dari perangkat lain' + (c.latest && c.latest.updatedAt ? '' : '') + '.</strong> Perubahan Anda belum tersimpan.',
      '<button data-ti="conflictLoad" class="ti-btn-outline">Muat versi terbaru</button><button data-ti="conflictForce" class="ti-btn-outline" style="background:#6E2621; color:#fff; border-color:#6E2621;">Simpan versi saya</button>');
  } else if (svc.status === 'Published') {
    el.innerHTML = box('#e3ebdc', '#c5d4b8', '#24401F', '<strong>Sudah diterbitkan.</strong> Terkunci agar tidak berubah tanpa sengaja. Ubah status ke Review untuk mengedit.',
      '<button data-ti="status" data-v="Review" class="ti-btn-outline">Buka kunci (Review)</button>');
  } else el.innerHTML = '';
}

function tiBaMsgHtml() {
  var svc = tiState.cur, vs = String(svc.baVs || '').trim();
  if (vs && !TI_VS_RE.test(vs)) return '<span style="font-size:12.5px; font-weight:600; color:#a3420e;">Format ayat: 1, 1-3, atau 1,4</span>';
  var ba = tiBa(svc);
  return ba ? '<span class="ti-pill" style="background:#F3E9CE; color:#6E2621;">' + esc(ba) + ' · Alkitab TB2</span>' : '';

function tiRenderBlock(k) {
  var card = document.getElementById('tiCard-' + k), main = document.getElementById('tiMain-' + k);

  var p = tiBlockParts(TI_BLOCK[k]);

function tiRenderSaveLabel() {
  var el = document.getElementById('tiSaveLabel');

  el.style.color = tiState.saveError ? TI_RED : '#8a7952';
}

/* Everything in the builder that derives from the form, minus the inputs themselves. */
function tiRenderDynamic() {
  var svc = tiState.cur;
  if (!svc || !document.getElementById('tiTitle')) return;
  document.getElementById('tiEyebrow').textContent = tiDateLong(svc.date) + (svc.season ? ' · ' + svc.season : '');
  document.getElementById('tiTitle').innerHTML = esc(svc.series ? svc.series + ': ' : '') + '<span style="color:#6E2621;">' + esc(svc.sub || '…') + '</span>';
  var sched = tiScheduleOn(svc.date);
  var hint = document.getElementById('tiSchedHint');
  var schedTheme = sched ? (sched.theme || '') : '';
  var differs = sched && (schedTheme !== tiTheme(svc) || (sched.pastor || '') !== (svc.pf || ''));
  var row = function (inner) { return '<span style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:#8a7952; font-weight:600;">' + inner + '</span>'; };
  if (sched) {
    hint.innerHTML = row('Di jadwal: ' + esc(schedTheme || 'tanpa tema') + (sched.pastor ? ' · ' + esc(sched.pastor) : '') +
      (differs ? '<span data-ti="useSchedule" class="ti-link">Pakai dari jadwal</span><span data-ti="syncSchedule" class="ti-link">Perbarui jadwal</span>' : ' <span style="color:#24401F;">✓ sama</span>'));
  } else {

  }
  TI_BLOCKS.forEach(function (b) { if (b.kind !== 'fixed') tiRenderBlock(b.k); });
  tiRenderBaFetch();
  tiRenderBanner();
  var baMsg = document.getElementById('tiBaMsg');
  if (baMsg) baMsg.innerHTML = tiBaMsgHtml();
  tiRenderAside();
  tiRenderSaveLabel();
}

function tiRenderAside() {
  var svc = tiState.cur, el = document.getElementById('tiAside');
  if (!svc || !el) return;
  var chk = tiChecks(svc);
  var redN = chk.reds.length, ambN = chk.ambers.length;
  var todos = tiTodos(svc);
  var li = -1;
  todos.forEach(function (t, i) { if (t.id === tiState.lastJump) li = i; });
  var nextT = todos.length ? todos[(li + 1) % todos.length] : null;

  var checks = chk.reds.map(function (c) { c.color = TI_RED; c.icon = '!'; return c; })
    .concat(chk.ambers.map(function (c) { c.color = TI_AMBER; c.icon = '!'; return c; }))
    .concat(chk.greens.map(function (c) { c.color = TI_GREEN; c.icon = '✓'; return c; }));

  var statusNote = redN ? 'Selesaikan ' + redN + ' pemblokir merah untuk menerbitkan.' : svc.status === 'Published' ? 'Sudah diterbitkan.' : 'Siap diterbitkan.';
  var card = 'class="ti-card" style="padding:16px 18px; display:flex; flex-direction:column; gap:12px;"';

  el.innerHTML =
    '<div ' + card + '>' +
      '<div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;"><span class="ti-eyebrow">Perlu diisi</span><span style="font-size:12.5px; font-weight:600; color:#8a7952;">' + (todos.length ? todos.length + ' tersisa' : 'Lengkap') + '</span></div>' +
      '<span style="font-size:13.5px; font-weight:600; color:#3a2a15;">' + (nextT ? 'Berikutnya: ' + esc(nextT.label) : 'Semua kolom dan slot sudah terisi.') + '</span>' +
      (nextT ? '<button data-ti="jump" data-to="' + nextT.id + '" class="ti-btn-orange">Isi berikutnya ↓</button>'
             : '<span style="background:#e3ebdc; color:#24401F; font-weight:700; font-size:14px; padding:12px 14px; border-radius:12px; text-align:center;">Semua terisi ✓</span>') +
    '</div>' +
    '<div ' + card + '>' +
      '<span class="ti-eyebrow">Status</span>' +
      '<div class="ti-seg" style="display:grid; grid-template-columns:repeat(3, 1fr);">' + ['Draft', 'Review', 'Published'].map(function (v) {
        var blocked = v === 'Published' && redN > 0;
        return '<button data-ti="status" data-v="' + v + '" class="' + (svc.status === v ? 'on' : '') + '"' + (blocked ? ' disabled' : '') + '>' + v + '</button>';
      }).join('') + '</div>' +
      '<span style="font-size:12.5px; color:#8a7952;">' + statusNote + '</span>' +
    '</div>' +
    '<div ' + card + '>' +
      '<div style="display:flex; justify-content:space-between; align-items:baseline;"><span class="ti-eyebrow">Pemeriksaan</span><span style="font-size:12.5px; font-weight:600; color:#8a7952;">' + redN + ' merah · ' + ambN + ' kuning</span></div>' +
      '<div style="display:flex; flex-direction:column; gap:4px;">' + checks.map(function (c) {
        return '<button ' + (c.to ? 'data-ti="jump" data-to="' + c.to + '" class="ti-hover"' : '') + ' style="text-align:left; cursor:' + (c.to ? 'pointer' : 'default') + '; display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:9px; align-items:start; font-size:13.5px; line-height:1.4; padding:5px 7px; margin:0 -7px; border-radius:9px;">' +
          '<span style="width:17px; height:17px; border-radius:50%; background:' + c.color + '; color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; margin-top:1px; font-weight:800;">' + c.icon + '</span>' +
          '<span style="display:flex; flex-direction:column; gap:1px; min-width:0;"><span style="color:#3a2a15; font-weight:600;">' + esc(c.text) + '</span>' + (c.sub ? '<span style="font-size:12px; color:#8a7952;">' + esc(c.sub) + '</span>' : '') + '</span>' +
          '<span style="font-size:12px; color:#c6b58c;">' + (c.to ? '→' : '') + '</span>' +
        '</button>';
      }).join('') + '</div>' +
    '</div>' +
    '<div ' + card + '>' + tiOutputHtml(svc, redN) + '</div>' +
    '<button data-ti="delete" style="align-self:flex-start; color:' + TI_RED + '; font-size:13px; font-weight:700; cursor:pointer; padding:2px 4px;">Hapus tata ibadah ini</button>';
}

/* ---------- liturgy download (.docx / .pdf) ---------- */

function tiOutputHtml(svc, redN) {
  var busy = tiState.dl.busy, err = tiState.dl.error;

    var dis = !svc.id || busy;

      (busy === fmt ? 'Menyiapkan…' : label) + '</button>';
  };
  return '<div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;"><span class="ti-eyebrow">Liturgi</span>' +
      '<span style="font-size:12px; font-weight:600; color:#9a8763;">A5 · format Pemuda</span></div>' +
    '<div style="display:flex; gap:8px;">' + btn('pdf', 'Unduh PDF', true) + btn('docx', 'Unduh .docx', false) + '</div>' +
    btn('gdoc', 'Buat Google Doc', false).replace('flex:1;', 'width:100%;') +
    (svc.doc ? '<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:10px; border-top:1px solid #f1e7cd;">' +
      '<span style="display:flex; flex-direction:column; gap:1px;"><span style="font-size:14px; font-weight:700; color:#3a2a15;">Google Doc</span>' +
      '<span style="font-size:12px; color:#8a7952;">Dibuat ' + esc(svc.doc.at) + ' · Drive › Tata Ibadah</span></span>' +
      '<a href="' + esc(svc.doc.url) + '" target="_blank" style="font-size:13px; font-weight:700; color:#E85511; white-space:nowrap;">Buka ↗</a></div>' : '') +

    (err ? '<span style="font-size:12.5px; font-weight:600; color:' + TI_RED + '; line-height:1.5;">' + esc(err) + '</span>' : '');
}

/* Builds the liturgy on the server (after any pending autosave): saves .pdf/.docx in the browser, or makes a Google Doc. */
function tiDownload(fmt) {
  var svc = tiState.cur, dl = tiState.dl;
  var reds = tiChecks(svc).reds.length;
  if (reds && !window.confirm('Masih ada ' + reds + ' pemblokir merah. Tetap buat liturgi?')) return;
  dl.busy = fmt; dl.error = '';
  tiRenderAside();
  tiAfterSave(function () {
    google.script.run
      .withSuccessHandler(function (res) {
        dl.busy = '';
        if (!res.success) { dl.error = res.message; tiRenderAside(); return; }
        if (fmt === 'gdoc') { svc.doc = res.doc; flash(res.message); tiRenderAside(); return; }
        var bin = atob(res.base64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([bytes], { type: res.mimeType }));
        var a = document.createElement('a');
        a.href = url; a.download = res.filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
        flash(res.filename + ' diunduh');
        tiRenderAside();
      })
      .withFailureHandler(function (err) { dl.busy = ''; dl.error = err && err.message ? err.message : String(err); tiRenderAside(); })
      [fmt === 'gdoc' ? 'createLiturgyDoc' : 'downloadLiturgy'](svc.id, fmt);
  });
}

}

/* ---------- pasted lyrics → sections ---------- */

var TI_HEADING_RE = /^[\[\(]?\s*(bait|verse|ayat|v|reff?|refrain|chorus|korus|bridge|jembatan|pre[\s-]?chorus|pre[\s-]?reff?|tag|coda|ending|outro|intro|interlude|ad[\s-]?lib)\s*(\d+)?\s*[\]\)]?\s*[:.]?\s*(.*)$/i;
var TI_CHORD_RE = /\[[A-G][#b]?(m|maj|min|sus|dim|aug|add)?\d*(\/[A-G][#b]?)?\]/g;
var TI_FOOTER_RE = /^(ccli|©|\(c\)|copyright|for use solely|note: reproduction|all rights reserved|admin\.? by|lisensi)/i;
var TI_FOOTER_SKIP_RE = /^(ccli (song|license)|for use solely|note: reproduction)/i;
var TI_REPEAT_RE = /\s*[\(\[]?\s*(?:x\s*(\d)|(\d)\s*x)\s*[\)\]]?\s*$/i;

/* Canonical label for a heading word: verses become "Bait N", the rest keep a tidy English/Indonesian name. */
function tiHeadingLabel(word, num, counters) {
  var w = word.toLowerCase().replace(/[\s-]/g, '');
  if (w === 'bait' || w === 'verse' || w === 'ayat' || w === 'v') {
    var n = num ? Number(num) : (counters.verse + 1);
    counters.verse = Math.max(counters.verse, n);
    return 'Bait ' + n;
  }
  var names = { ref: 'Ref', reff: 'Ref', refrain: 'Ref', chorus: 'Chorus', korus: 'Chorus', bridge: 'Bridge', jembatan: 'Bridge',
    prechorus: 'Pre-Chorus', preref: 'Pre-Ref', prereff: 'Pre-Ref', tag: 'Tag', coda: 'Coda', ending: 'Ending', outro: 'Outro',
    intro: 'Intro', interlude: 'Interlude', adlib: 'Ad lib' };
  return (names[w] || word) + (num ? ' ' + num : '');
}

/*
 * Turns pasted lyrics into { title, credits, sections:[{label,text}], arr }.
 * Understands section headings ("Verse 1", "Reff:", "[Chorus]", "1."),
 * ChordPro ({title:}, {soc}, [G] chords), SongSelect text exports (title
 * line + CCLI footer) and "(2x)" repeats. Without headings, blank-line
 * paragraphs become verses and a paragraph that repeats becomes the Ref.
 */
function tiParseLyrics(raw) {
  var lines = String(raw || '').replace(/\r\n?/g, '\n').split('\n');
  var title = '', credits = [], blocks = [], cur = null, counters = { verse: 0 }, sawHeading = false, footer = false;

  var start = function (label) { cur = { label: label, lines: [], repeat: 1 }; blocks.push(cur); };
  var push = function (text) {
    if (!cur) start(null);
    var rep = text.match(TI_REPEAT_RE);
    if (rep) { cur.repeat = Number(rep[1] || rep[2]); text = text.replace(rep[0], ''); }
    if (text.trim()) cur.lines.push(text);
  };

  lines.forEach(function (line) {
    var t = line.replace(TI_CHORD_RE, '').replace(/\s+$/, '');
    var trimmed = t.trim();
    var dir = trimmed.match(/^\{\s*([a-z_]+)\s*(?::\s*(.*?))?\s*\}$/i);
    if (dir) {
      var key = dir[1].toLowerCase(), val = (dir[2] || '').trim();
      if (key === 'title' || key === 't') title = val;
      else if (/^(subtitle|st|artist|composer|lyricist|copyright)$/.test(key)) { if (val) credits.push(val); }
      else if (key === 'soc' || key === 'start_of_chorus') { sawHeading = true; start(tiHeadingLabel(val || 'Chorus', '', counters)); }
      else if (key === 'sov' || key === 'start_of_verse') { sawHeading = true; start(tiHeadingLabel('Verse', (val.match(/\d+/) || [''])[0], counters)); }
      else if (key === 'sob' || key === 'start_of_bridge') { sawHeading = true; start('Bridge'); }
      else if (/^(c|comment|ci|comment_italic)$/.test(key)) {
        var hm = val.match(TI_HEADING_RE);
        if (hm && !hm[3]) { sawHeading = true; start(tiHeadingLabel(hm[1], hm[2], counters)); }
      } else if (/^(eoc|end_of_chorus|eov|end_of_verse|eob|end_of_bridge)$/.test(key)) cur = null;
      return;
    }
    if (TI_FOOTER_RE.test(trimmed) || (footer && trimmed)) {
      footer = true;
      if (!TI_FOOTER_SKIP_RE.test(trimmed)) credits.push(trimmed.replace(/^(©|\(c\))\s*/i, '© ').replace(/\s*\|\s*/g, ', '));
      return;
    }
    if (!trimmed) { if (cur && cur.lines.length) cur = null; return; }

    var num = trimmed.match(/^(\d+)\s*[.)]\s*(.*)$/);
    if (num && Number(num[1]) < 30) {
      sawHeading = true;
      start(tiHeadingLabel('Bait', num[1], counters));
      if (num[2]) push(num[2]);
      return;
    }
    var repM = trimmed.match(TI_REPEAT_RE);
    var head = repM ? trimmed.replace(repM[0], '').trim() : trimmed;
    var hm2 = head.length <= 40 || /[:\]]/.test(head) ? head.match(TI_HEADING_RE) : null;
    if (hm2 && (!hm2[3] || /^[\[\(]?\s*\w[\w\s-]*\d*\s*[\]\):]/.test(head))) {
      sawHeading = true;
      start(tiHeadingLabel(hm2[1], hm2[2], counters));
      if (repM) cur.repeat = Number(repM[1] || repM[2]);
      if (hm2[3]) push(hm2[3].trim());
      return;
    }
    push(trimmed);
  });

  /* SongSelect / slide exports put the title alone on the first line. */
  if (!title && blocks.length > 1 && !blocks[0].label && blocks[0].lines.length === 1 && blocks[0].lines[0].length <= 60 && (footer || sawHeading)) {
    title = blocks.shift().lines[0];
  }

  var sections = [], order = [], textByLabel = {}, labelByText = {};
  if (!sawHeading) {
    var count = {};
    blocks.forEach(function (b) { var k = b.lines.join('\n'); count[k] = (count[k] || 0) + 1; });
    var refText = Object.keys(count).filter(function (k) { return count[k] > 1; }).sort(function (a, b) { return count[b] - count[a]; })[0];
    var v = 0;
    blocks.forEach(function (b) {
      var k = b.lines.join('\n');
      b.label = k === refText ? 'Ref' : labelByText[k] || 'Bait ' + (++v);
      labelByText[k] = b.label;
    });
  }

  var unnamed = 0;
  blocks.forEach(function (b) {
    var text = b.lines.join('\n').trim();
    var label = b.label || (sections.length ? 'Bagian ' + (++unnamed + 1) : 'Bait 1');
    if (!text) {
      if (textByLabel[label] != null) for (var r = 0; r < b.repeat; r++) order.push(label);
      return;
    }
    if (textByLabel[label] != null && textByLabel[label] !== text) {
      for (var n = 2; textByLabel[label + ' ' + n] != null && textByLabel[label + ' ' + n] !== text; n++);
      label = label + ' ' + n;
    }
    if (textByLabel[label] == null) { textByLabel[label] = text; sections.push({ label: label, text: text }); }
    for (var i = 0; i < b.repeat; i++) order.push(label);
  });

  return { title: title, credits: credits.join(' · '), sections: sections, arr: order.join(' → ') };
}

            return '<div class="ti-card" style="border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px;">' +
              '<div style="display:flex; gap:8px; align-items:center;"><input data-tisf="label" data-i="' + i + '" value="' + esc(s.label) + '" placeholder="mis. Bait 1, Ref, Chorus" class="ti-field" style="padding:9px 12px; font-weight:700;">' +
              '<button data-ti="sfRemove" data-i="' + i + '" class="icon-btn" aria-label="Hapus bagian" style="width:34px; height:34px; border-radius:10px; color:#b3a37c; cursor:pointer; flex-shrink:0;">✕</button></div>' +
              '<textarea data-tisf="text" data-i="' + i + '" rows="4" placeholder="Lirik" class="ti-field" style="resize:vertical; line-height:1.5; font-family:inherit; padding:9px 12px;">' + esc(s.text) + '</textarea>' +
            '</div>';
          }).join('') +
          '<button data-ti="sfAdd" style="border:1px dashed #d9c79b; background:#fff; color:#6E2621; font-size:13.5px; font-weight:700; padding:11px; border-radius:12px; cursor:pointer;">+ Tambah bagian</button>' +
        '</div>' +
        (f.error ? '<div style="background:#fbe6e2; border:1px solid #f0c8c1; color:#8c2b20; font-size:13px; font-weight:600; padding:11px 14px; border-radius:12px;">' + esc(f.error) + '</div>' : '') +
      '</div>' +
      '<div style="flex-shrink:0; border-top:1px solid #e7d9b3; background:#F3E9CE; padding:16px 26px;">' +
        '<button data-ti="sfSave" class="ti-btn-orange" style="width:100%; padding:15px; font-size:15.5px;"' + (f.saving ? ' disabled' : '') + '>' + (f.saving ? 'Menyimpan…' : f.id ? 'Simpan lagu' : 'Tambah ke perpustakaan') + '</button>' +
      '</div>' +
    '</section>' +
  '</div>';
}

function tiSaveSongForm() {
  var f = tiState.songForm;
  if (!f.title.trim()) { f.error = 'Judul lagu wajib diisi.'; tiRenderModal(); return; }
  f.saving = true; f.error = '';
  tiRenderModal();
  google.script.run
    .withSuccessHandler(function (res) {
      f.saving = false;
      if (!res.success) { f.error = res.message; tiRenderModal(); return; }
      var songs = tiState.songs.filter(function (s) { return s.id !== res.song.id; }).concat([res.song]);
      tiSetSongs(songs);
      tiState.songForm = null;
      tiRenderModal();
      if (tiState.picker) tiSelectSong(res.song.id);
      tiRenderDynamic();
      if (tiState.screen === 'library') tiRenderLibraryList();
      flash(res.message);
    })
    .withFailureHandler(function (err) {
      f.saving = false;
      f.error = err && err.message ? err.message : String(err);
      tiRenderModal();
    })
    .saveSong({ id: f.id, hymnal: f.hymnal, number: f.number, title: f.title, credits: f.credits, language: f.language, arr: f.arr, sections: f.sections });
}

/* ---------- events (delegated) ---------- */

function tiOnClick(e) {
  var el = e.target.closest && e.target.closest('[data-ti]');
  if (!el) return;
  var a = el.getAttribute('data-ti'), k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
  var svc = tiState.cur, pk = tiState.picker, sf = tiState.songForm;
  var i = Number(el.getAttribute('data-i'));

  var editing = { toggle: 1, variant: 1, pick: 1, useSchedule: 1, fetchBa: 1 };
  if (editing[a] && svc && svc.status === 'Published' && tiState.screen === 'builder') { flash('Terkunci: ubah status ke Review untuk mengedit'); return; }

  switch (a) {
    case 'tab': tiState.screen = v; tiState.cur = null; tiRender(); window.scrollTo(0, 0); break;
    case 'libH': tiState.lib.h = v; tiRenderLibraryList(); break;
    case 'libEdit': tiOpenSongForm(tiState.songById[el.getAttribute('data-id')]); break;
    case 'libDelete':
      var sid = el.getAttribute('data-id'), stats = tiSongStats(sid);
      if (stats.count) { tiState.lib.merge = sid; tiState.lib.mergeTo = ''; tiRenderLibraryList(); }
      else if (window.confirm('Hapus “' + tiState.songById[sid].title + '” dari perpustakaan?')) tiDeleteSong(sid);
      break;
    case 'libMerge':
      if (!tiState.lib.mergeTo) { flash('Pilih lagu pengganti dulu'); return; }
      if (window.confirm('Ganti lagu ini dengan “' + tiState.songById[tiState.lib.mergeTo].title + '” di semua tata ibadah, lalu hapus?')) tiDeleteSong(el.getAttribute('data-id'), tiState.lib.mergeTo);
      break;
    case 'libCancel': tiState.lib.merge = null; tiRenderLibraryList(); break;
    case 'syncSchedule': tiSyncSchedule(); break;
    case 'fetchBa': tiFetchBa(true); break;
    case 'conflictLoad':
      var latest = tiState.conflict && tiState.conflict.latest;
      if (latest) Object.keys(latest).forEach(function (key) { svc[key] = latest[key]; });
      tiState.conflict = null; tiState.pending = null;
      tiState.saveLabel = 'Versi terbaru dimuat'; tiState.saveError = false;
      tiRender();
      break;
    case 'conflictForce':
      if (tiState.conflict && tiState.conflict.latest) svc.updatedAt = tiState.conflict.latest.updatedAt;
      tiState.conflict = null; svc.forceSave = true;
      tiRenderBanner(); tiQueueSave();
      break;
    case 'new': tiNewService(el.getAttribute('data-date')); break;
    case 'duplicate': tiNewService(el.getAttribute('data-date'), true); break;
    case 'open': tiOpenService(tiByDate(el.getAttribute('data-date'))); break;
    case 'openSvc': tiOpenService(tiState.services[Number(el.getAttribute('data-idx'))]); break;
    case 'statusF': tiState.statusF = v; tiRender(); break;
    case 'back': tiGoList(); break;
    case 'delete': tiDeleteCurrent(); break;
    case 'jump': tiJumpTo(el.getAttribute('data-to')); break;
    case 'expand': tiState.open[k] = !tiState.open[k]; tiRenderBlock(k); break;
    case 'toggle': svc.enabled[k] = !svc.enabled[k]; tiRenderDynamic(); tiQueueSave(); break;
    case 'variant': svc.variants[k] = v; tiRenderBlock(k); tiRenderAside(); tiQueueSave(); break;
    case 'status':
      if (el.disabled) return;
      var was = svc.status;
      svc.status = v;
      if (was === 'Published' || v === 'Published') tiRender(); else tiRenderAside();
      tiQueueSave();
      break;
    case 'useSchedule':
      tiApplySchedule(svc, tiScheduleOn(svc.date));
      ['series', 'sub', 'pf'].forEach(function (f) { document.getElementById('tiF-' + f).value = svc[f]; });
      tiRenderDynamic(); tiQueueSave(); break;
    case 'pick': e.preventDefault(); tiOpenPicker(k); break;
    case 'download': if (!el.disabled) tiDownload(v); break;

    case 'closePicker': tiState.picker = null; tiRenderModal(); break;
    case 'confirmPick': tiConfirmPick(); break;
    case 'hymnal': pk.h = v; tiRenderPickerParts(); tiOnlineSearchSoon(); break;
    case 'onlineImport': tiOnlineImport(el.getAttribute('data-h'), el.getAttribute('data-n'), el.getAttribute('data-row')); break;
    case 'selSong': tiSelectSong(el.getAttribute('data-id')); break;
    case 'seqReset': var song = tiState.songById[pk.sel]; pk.seq = song.arr ? song.arr.split(' → ') : []; pk.chipSel = null; tiRenderPickerParts(); break;
    case 'seqRepeat': if (pk.seq.length) { pk.seq = pk.seq.concat(pk.seq); pk.chipSel = null; tiRenderPickerParts(); } break;
    case 'addMenu': pk.addMenu = !pk.addMenu; tiRenderPickerParts(); break;
    case 'seqAdd': pk.seq.push(v); tiRenderPickerParts(); break;
    case 'chip': pk.chipSel = pk.chipSel === i ? null : i; tiRenderPickerParts(); break;
    case 'chipRemove': e.stopPropagation(); pk.seq.splice(i, 1); pk.chipSel = null; tiRenderPickerParts(); break;
    case 'chipLeft': if (pk.chipSel > 0) tiSeqMove(pk.chipSel, pk.chipSel - 1); break;
    case 'chipRight': if (pk.chipSel < pk.seq.length - 1) tiSeqMove(pk.chipSel, pk.chipSel + 1); break;
    case 'chipDup': pk.seq.splice(pk.chipSel + 1, 0, pk.seq[pk.chipSel]); pk.chipSel++; tiRenderPickerParts(); break;
    case 'secToggle': pk.secOpen[v] = !pk.secOpen[v]; pk.secEdit[v] = false; tiRenderPickerParts(); break;
    case 'secEdit': pk.secEdit[v] = true; tiRenderPickerParts(); break;
    case 'secDone': pk.secEdit[v] = false; tiRenderPickerParts(); break;
    case 'newSong': tiOpenSongForm(null); break;
    case 'editSong': tiOpenSongForm(tiState.songById[pk.sel]); break;

    case 'closeSongForm': tiState.songForm = null; tiRenderModal(); break;
    case 'sfAdd': sf.sections.push({ label: '', text: '' }); tiRenderModal(); break;
    case 'sfRemove': sf.sections.splice(i, 1); tiRenderModal(); break;
    case 'sfSave': tiSaveSongForm(); break;
    case 'sfParse': tiParsePaste(); break;
    case 'sfPasteOpen': sf.pasteOpen = true; tiRenderModal(); break;
  }
}

function tiOnInput(e) {
  var t = e.target, svc = tiState.cur;
  var f = t.getAttribute && t.getAttribute('data-tif');
  if (f && svc) {
    if (f === 'pk') svc.pk = t.checked;
    else svc[f] = t.value;
    if (f === 'date') {
      svc.season = tiSeason(t.value) || svc.season;
      document.getElementById('tiF-season').value = svc.season;
    }
    if (f === 'baBook' || f === 'baCh' || f === 'baVs') {
      tiState.baFetch = { busy: false, error: '' };
      clearTimeout(tiState.baTimer);
      tiState.baTimer = setTimeout(function () { tiFetchBa(false); }, 700);
    }
    tiRenderDynamic();
    tiQueueSave();
    return;
  }
  var tt = t.getAttribute && t.getAttribute('data-tit');
  if (tt && svc) {
    var texts = tiTexts(svc);
    texts[tt] = t.value;
    if (tt === 'baText') { texts.baTextAuto = false; if (!texts.baTextRef) texts.baTextRef = tiBa(svc); tiRenderBaFetch(); }
    tiRenderAside();
    tiQueueSave();
    return;
  }
  var lb = t.getAttribute && t.getAttribute('data-tilib');
  if (lb === 'q') { tiState.lib.q = t.value; tiRenderLibraryList(); return; }
  if (lb === 'mergeTo') { tiState.lib.mergeTo = t.value; return; }
  var p = t.getAttribute && t.getAttribute('data-tipk');
  if (p === 'q') { tiState.picker.q = t.value; tiRenderPickerParts(); tiOnlineSearchSoon(); return; }
  if (p === 'lyric') { tiState.picker.lyrics[tiState.picker.sel + '|' + t.getAttribute('data-v')] = t.value; return; }
  var sf = t.getAttribute && t.getAttribute('data-tisf');
  if (sf) {
    var i = t.getAttribute('data-i');
    if (i != null) tiState.songForm.sections[Number(i)][sf] = t.value;
    else tiState.songForm[sf] = t.value;
    return;
  }
  var sel = t.getAttribute && t.getAttribute('data-tisel');
  if (sel === 'monthF') { tiState.monthF = t.value; tiRender(); }
}

function tiOnKey(e) {
  var pk = tiState.picker;
  if (e.key === 'Escape') {
    if (tiState.songForm) { tiState.songForm = null; tiRenderModal(); return; }
    if (pk) { tiState.picker = null; tiRenderModal(); return; }
  }
  if (!pk || tiState.songForm || e.target.id !== 'tiPkQ') return;
  if (e.key === 'Enter') { e.preventDefault(); tiConfirmPick(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  var ids = tiPickerMatches().results.map(function (s) { return s.id; });
  if (!ids.length) return;
  var i = ids.indexOf(pk.sel);
  tiSelectSong(ids[e.key === 'ArrowDown' ? Math.min(i + 1, ids.length - 1) : Math.max(i - 1, 0)]);
  var row = document.getElementById('tiPkRow-' + pk.sel);
  if (row) row.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', tiOnClick);
document.addEventListener('input', tiOnInput);
document.addEventListener('keydown', tiOnKey);
document.addEventListener('dragstart', function (e) {
  var el = e.target.closest && e.target.closest('[data-ti-seq]');
  if (!el || !tiState.picker) return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', el.getAttribute('data-ti-seq'));
  tiState.picker.dragI = Number(el.getAttribute('data-ti-seq'));
  el.style.opacity = 0.4;
});
document.addEventListener('dragover', function (e) {
  if (e.target.closest && e.target.closest('[data-ti-seq]')) e.preventDefault();
});
document.addEventListener('drop', function (e) {
  var el = e.target.closest && e.target.closest('[data-ti-seq]');
  var pk = tiState.picker;
  if (!el || !pk) return;
  e.preventDefault();
  var to = Number(el.getAttribute('data-ti-seq'));
  if (pk.dragI == null || pk.dragI === to) { pk.dragI = null; tiRenderPickerParts(); return; }
  tiSeqMove(pk.dragI, to);
});
document.addEventListener('dragend', function () {
  if (tiState.picker && tiState.picker.dragI != null) { tiState.picker.dragI = null; tiRenderPickerParts(); }
});
</script>
